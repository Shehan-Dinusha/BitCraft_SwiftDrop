server:
  port: 8084
spring:
  application:
    name: dispatch-assignment-service
  datasource:
    url: jdbc:postgresql://dispatch-postgres-0.dispatch-postgres-hl.swiftdrop-data.svc.cluster.local:5432/swiftdrop_dispatch
    username: ${DB_USERNAME:swiftdrop}
    password: ${DB_PASSWORD:swiftdrop}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq.default.svc.cluster.local}
    port: ${RABBITMQ_PORT:5672}
management:
  endpoints:
    web:
      exposure:
        include: health,info

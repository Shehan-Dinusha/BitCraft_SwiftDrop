server:
  port: 8084
spring:
  application:
    name: dispatch-assignment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/swiftdrop_dispatch}
    username: ${DB_USERNAME:swiftdrop}
    password: ${DB_PASSWORD:changeme_pg}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:swiftdrop}
    password: ${RABBITMQ_PASSWORD:changeme_rabbit}
    listener:
      simple:
        # Never requeue a failed message for an immediate redelivery loop.
        # Rejected messages are dead-lettered to dlq.dispatch.events by the
        # x-dead-letter-exchange argument on every dispatch queue.
        default-requeue-rejected: false
        retry:
          # Bounded in-process retry for transient failures; permanent failures
          # skip retries (see ListenerRetryPolicyConfig).
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s
management:
  endpoints:
    web:
      exposure:
        include: health,info
swiftdrop:
  # The cash ledger: a courier hands over their cash before ending a shift.
  delivery-service-url: ${DELIVERY_SERVICE_URL:http://localhost:8085}
springdoc:
  api-docs:
    version: OPENAPI_3_1
  swagger-ui:
    path: /swagger-ui.html

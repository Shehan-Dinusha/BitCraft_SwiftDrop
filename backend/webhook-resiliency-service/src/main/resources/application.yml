server:
  port: 8087
spring:
  application:
    name: webhook-resiliency-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/swiftdrop_webhook}
    username: ${DB_USERNAME:swiftdrop}
    password: ${DB_PASSWORD:changeme_pg}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:swiftdrop}
    password: ${RABBITMQ_PASSWORD:changeme_rabbit}
    listener:
      simple:
        # Ingestion is a short database transaction per message; keep the unacknowledged window small so a
        # crash redelivers little, and bound consumers per replica.
        prefetch: 10
        concurrency: 2
        max-concurrency: 4
webhook:
  ingestion:
    retry:
      # Attempts per message (including the first) before it is dead-lettered.
      max-attempts: 3
      initial-interval: 1s
      multiplier: 2.0
      max-interval: 10s
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    version: OPENAPI_3_1
  swagger-ui:
    path: /swagger-ui.html

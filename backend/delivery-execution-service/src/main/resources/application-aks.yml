server:
  port: 8085
spring:
  application:
    name: delivery-execution-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://delivery-postgres-0.delivery-postgres-hl.swiftdrop-data.svc.cluster.local:5432/swiftdrop_delivery}
    username: ${DB_USERNAME:swiftdrop}
    password: ${DB_PASSWORD:changeme_pg}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq.default.svc.cluster.local}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:swiftdrop}
    password: ${RABBITMQ_PASSWORD:changeme_rabbit}
management:
  endpoints:
    web:
      exposure:
        include: health,info

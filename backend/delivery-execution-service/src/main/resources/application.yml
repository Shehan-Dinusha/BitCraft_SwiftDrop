server:
  port: 8085
spring:
  application:
    name: delivery-execution-service
  config:
    import:
      - "optional:classpath:application-secret.yml"
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/swiftdrop_delivery}
    username: ${DB_USERNAME:swiftdrop}
    password: ${DB_PASSWORD:changeme_pg}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:swiftdrop}
    password: ${RABBITMQ_PASSWORD:changeme_rabbit}
    listener:
      simple:
        # Never requeue a failed message for an immediate redelivery loop. Rejected messages are
        # dead-lettered to dlq.delivery.events by the queue's x-dead-letter-exchange argument.
        default-requeue-rejected: false
        retry:
          # Bounded in-process retry for transient failures; permanent failures skip retries
          # (see ListenerRetryPolicyConfig).
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    version: OPENAPI_3_1
  swagger-ui:
    path: /swagger-ui.html
swiftdrop:
  # Addresses and fee for the courier carrying a parcel.
  order-service-url: ${ORDER_SERVICE_URL:http://localhost:8082}
  delivery:
    pod-storage-dir: ${POD_STORAGE_DIR:/tmp/swiftdrop/pod}
azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    container-name: ${AZURE_STORAGE_CONTAINER_NAME:pod-images}

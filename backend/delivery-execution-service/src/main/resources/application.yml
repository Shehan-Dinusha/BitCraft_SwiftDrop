server:
  port: 8085
spring:
  application:
    name: delivery-execution-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5436/swiftdrop_delivery
    username: ${DB_USERNAME:swiftdrop}
    password: ${DB_PASSWORD:swiftdrop}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    version: OPENAPI_3_1
  swagger-ui:
    path: /swagger-ui.html

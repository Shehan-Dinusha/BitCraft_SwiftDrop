server:
  port: 8082
spring:
  application:
    name: customer-order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/swiftdrop_order}
    username: ${DB_USERNAME:swiftdrop}
    password: ${DB_PASSWORD:changeme_pg}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:swiftdrop}
    password: ${RABBITMQ_PASSWORD:changeme_rabbit}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    version: OPENAPI_3_1
  swagger-ui:
    path: /swagger-ui.html
pricing:
  # local = built-in tariff copy, remote = call the pricing service (no fallback between them)
  mode: ${PRICING_MODE:local}
  service:
    url: ${PRICING_SERVICE_URL:http://localhost:8083}
    connect-timeout-ms: ${PRICING_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${PRICING_READ_TIMEOUT_MS:2000}

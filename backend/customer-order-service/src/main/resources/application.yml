server:
  port: 8082
spring:
  application:
    name: customer-order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/swiftdrop_order}
    username: ${DB_USERNAME:swiftdrop}
    password: ${DB_PASSWORD:changeme_pg}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:swiftdrop}
    password: ${RABBITMQ_PASSWORD:changeme_rabbit}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    version: OPENAPI_3_1
  # Service-to-service endpoints: the gateway never routes /internal/**, so keep them out of the public docs.
  paths-to-exclude:
    - /internal/**
  swagger-ui:
    path: /swagger-ui.html
swiftdrop:
  public-tracking-base-url: ${PUBLIC_TRACKING_BASE_URL:http://localhost:5173}
dispatch:
  service:
    # The working calendar (holidays) the delivery promise counts.
    url: ${DISPATCH_SERVICE_URL:http://localhost:8084}
pricing:
  service:
    url: ${PRICING_SERVICE_URL:http://localhost:8083}
    connect-timeout-ms: ${PRICING_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${PRICING_READ_TIMEOUT_MS:5000}

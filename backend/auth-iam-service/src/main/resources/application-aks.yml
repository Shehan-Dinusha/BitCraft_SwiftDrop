server:
  port: 8081

spring:
  application:
    name: auth-iam-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://iam-postgres-headless.swiftdrop-data.svc.cluster.local:5432/swiftdrop_iam}
    username: ${DB_USERNAME:swiftdrop}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq.swiftdrop-messaging.svc.cluster.local}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:swiftdrop}
    password: ${RABBITMQ_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis.swiftdrop-messaging.svc.cluster.local}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s

swiftdrop:
  auth:
    refresh-cookie:
      # Secure flag on the HttpOnly refresh-token cookie. Only set false for plain-HTTP local setups.
      secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
    mfa:
      # Emailed second sign-in factor for SYSTEM_ADMIN and DISPATCHER. Needs a real email provider
      # (NOTIFICATION_EMAIL_PROVIDER=azure) or the code never reaches the user.
      enabled: ${AUTH_MFA_ENABLED:false}
  jwt:
    algorithm: ${JWT_ALGORITHM:RS256}
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:swiftdrop-iam}
    audience: ${JWT_AUDIENCE:swiftdrop}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:${JWT_EXPIRATION_MS:3600000}}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:14}
    blacklist-prefix: ${JWT_BLACKLIST_PREFIX:jwt:blacklist:}
  bootstrap:
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      district: ${BOOTSTRAP_ADMIN_DISTRICT:COLOMBO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

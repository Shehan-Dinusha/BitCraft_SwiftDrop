server:
  port: 8081

spring:
  application:
    name: auth-iam-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5431/swiftdrop_iam}
    username: ${DB_USERNAME:swiftdrop}
    password: ${DB_PASSWORD:changeme_pg}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:swiftdrop}
    password: ${RABBITMQ_PASSWORD:changeme_rabbit}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s

swiftdrop:
  jwt:
    algorithm: ${JWT_ALGORITHM:HS256}
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    secret: ${JWT_SECRET:swiftdrop-local-dev-secret-key-must-be-at-least-256-bits-long!!}
    issuer: ${JWT_ISSUER:swiftdrop-iam}
    audience: ${JWT_AUDIENCE:swiftdrop}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:${JWT_EXPIRATION_MS:3600000}}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}
    blacklist-prefix: ${JWT_BLACKLIST_PREFIX:jwt:blacklist:}
  bootstrap:
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      district: ${BOOTSTRAP_ADMIN_DISTRICT:COLOMBO}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      # Redirect URI must be registered in Google Cloud Console.
      # In production route this through the gateway; locally point directly at IAM.
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth2/google/callback}
      frontend-url: ${FRONTEND_URL:http://localhost:5173}
      # TTL (seconds) for the CSRF state token stored in Redis (5 minutes).
      state-ttl-seconds: 300

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    version: OPENAPI_3_1
  swagger-ui:
    path: /swagger-ui.html

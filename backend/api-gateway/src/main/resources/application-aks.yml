server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
  data:
    redis:
      host: ${REDIS_HOST:redis.swiftdrop-messaging.svc.cluster.local}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq.swiftdrop-messaging.svc.cluster.local}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:swiftdrop}
    password: ${RABBITMQ_PASSWORD:changeme_rabbit}

swiftdrop:
  routes:
    auth: ${AUTH_SERVICE_URL:http://auth-iam-service.swiftdrop-apps.svc.cluster.local:8080}
    order: ${ORDER_SERVICE_URL:http://customer-order-service.swiftdrop-apps.svc.cluster.local:8080}
    pricing: ${PRICING_SERVICE_URL:http://pricing-zone-service.swiftdrop-apps.svc.cluster.local:8080}
    dispatch: ${DISPATCH_SERVICE_URL:http://dispatch-assignment-service.swiftdrop-apps.svc.cluster.local:8080}
    delivery: ${DELIVERY_SERVICE_URL:http://delivery-execution-service.swiftdrop-apps.svc.cluster.local:8080}
    merchant: ${MERCHANT_SERVICE_URL:http://merchant-b2b-service.swiftdrop-apps.svc.cluster.local:8080}
    webhook: ${WEBHOOK_SERVICE_URL:http://webhook-resiliency-service.swiftdrop-apps.svc.cluster.local:8080}
    notification: ${NOTIFICATION_SERVICE_URL:http://notification-service.swiftdrop-apps.svc.cluster.local:8080}
    analytics: ${ANALYTICS_SERVICE_URL:http://analytics-ai-service.swiftdrop-apps.svc.cluster.local:8080}
  jwt:
    secret: ${JWT_SECRET:swiftdrop-local-dev-secret-key-must-be-at-least-256-bits-long!!}
    blacklist-prefix: ${JWT_BLACKLIST_PREFIX:jwt:blacklist:}
  rate-limit:
    public-tracking:
      limit: ${PUBLIC_TRACKING_RATE_LIMIT:60}
      window-seconds: ${PUBLIC_TRACKING_RATE_WINDOW_SECONDS:60}
  merchant:
    api-key-validation-url: ${MERCHANT_API_KEY_VALIDATION_URL:http://merchant-b2b-service.swiftdrop-apps.svc.cluster.local:8080/internal/v1/api-keys/validate}
    api-key-cache-ttl-seconds: ${MERCHANT_API_KEY_CACHE_TTL_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true

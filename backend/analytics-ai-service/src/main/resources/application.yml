server:
  port: 8089
ai:
  provider: ${AI_PROVIDER:mock}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:}
  endpoint: ${AI_ENDPOINT:}
  gateway-url: ${GATEWAY_URL:http://localhost:8080}
spring:
  application:
    name: analytics-ai-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/swiftdrop_analytics}
    username: ${DB_USERNAME:swiftdrop}
    password: ${DB_PASSWORD:changeme_pg}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:swiftdrop}
    password: ${RABBITMQ_PASSWORD:changeme_rabbit}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    version: OPENAPI_3_1
  # Legacy aliases of /api/v1/analytics and /api/v1/analytics/ai. They still work through the gateway,
  # but are left out of the docs so each operation is listed once.
  paths-to-exclude:
    - /api/v1/operational-kpi/**
    - /api/v1/ai-delivery-assistant/**
  swagger-ui:
    path: /swagger-ui.html

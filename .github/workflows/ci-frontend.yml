# ──────────────────────────────────────────────────────────────────────────────
# CI – Frontend (Node 20 / Vite / TypeScript / ESLint / Tailwind)
# Triggers on pull requests touching frontend apps or shared UI libraries.
# ──────────────────────────────────────────────────────────────────────────────
name: CI – Frontend

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/ci-frontend.yml"

concurrency:
  group: ci-frontend-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck-build:
    name: Lint, Type-Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: apps/swiftdrop-dashboard

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: apps/swiftdrop-dashboard

      - name: ESLint
        run: npx eslint . --max-warnings 0
        working-directory: apps/swiftdrop-dashboard

      - name: Build (Vite + Tailwind)
        run: npm run build
        working-directory: apps/swiftdrop-dashboard
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/swiftdrop-dashboard/dist/
          retention-days: 7

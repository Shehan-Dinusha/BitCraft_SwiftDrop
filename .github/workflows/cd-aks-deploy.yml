# ──────────────────────────────────────────────────────────────────────────────
# CD – Build images, push to ACR, deploy to AKS with Helm.
#
# Push to main: rebuilds only the components that changed (all backend services
# when backend/pom.xml or common-contracts changes), then `helm upgrade` the
# whole chart. Unchanged components keep the image tag currently running.
#
# Manual run (Actions → CD – AKS Deploy → Run workflow), target_service:
#   all          build every image (REQUIRED for the very first deployment)
#   <component>  build one component, e.g. api-gateway or frontend
#   none         build nothing; re-apply chart/config changes only
#   (blank)      same detection as a push
#
# Required repository secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID,
#   AZURE_SUBSCRIPTION_ID (OIDC), HELM_SECRETS_VALUES (values-secrets.yaml content)
# Optional repository variables: ACR_NAME, AKS_CLUSTER, AKS_RESOURCE_GROUP,
#   DEPLOY_PROFILE (student | production; default student)
# ──────────────────────────────────────────────────────────────────────────────
name: CD – AKS Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/helm/**"
      - ".github/workflows/cd-aks-deploy.yml"
  workflow_dispatch:
    inputs:
      target_service:
        description: "all | none | <component> | blank = changed only"
        required: false
        default: ""
        type: string

concurrency:
  group: cd-aks-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME || 'swiftdropacr' }}
  AKS_CLUSTER: ${{ vars.AKS_CLUSTER || 'swiftdrop-aks' }}
  AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP || 'rg-swiftdrop-prod' }}
  DEPLOY_PROFILE: ${{ vars.DEPLOY_PROFILE || 'student' }}
  HELM_VERSION: v3.17.0
  HELM_RELEASE: swiftdrop
  HELM_NAMESPACE: default
  APPS_NAMESPACE: swiftdrop-apps
  CHART_PATH: infra/helm/swiftdrop
  IMAGE_TAG: ${{ github.sha }}
  ALL_COMPONENTS: >-
    api-gateway auth-iam-service customer-order-service pricing-zone-service
    dispatch-assignment-service delivery-execution-service merchant-b2b-service
    webhook-resiliency-service notification-service analytics-ai-service frontend

jobs:
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: filter
        env:
          TARGET: ${{ inputs.target_service }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          read -ra all <<< "$ALL_COMPONENTS"
          to_json() { if [ "$#" -eq 0 ]; then echo '[]'; else printf '%s\n' "$@" | jq -R . | jq -sc .; fi; }
          selected=()

          if [ "$TARGET" = "all" ]; then
            selected=("${all[@]}")
          elif [ "$TARGET" = "none" ]; then
            selected=()
          elif [ -n "$TARGET" ]; then
            if [[ " ${all[*]} " != *" $TARGET "* ]]; then
              echo "::error::Unknown component '$TARGET'. Valid: all, none, ${all[*]}"
              exit 1
            fi
            selected=("$TARGET")
          else
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              base="$BEFORE"
            else
              base="HEAD~1"
            fi
            changed="$(git diff --name-only "$base" HEAD)"
            rebuild_backend=false
            if grep -qE '^backend/(pom\.xml|common-contracts/)' <<< "$changed"; then
              rebuild_backend=true
            fi
            for c in "${all[@]}"; do
              if [ "$c" = "frontend" ]; then
                if grep -q '^frontend/' <<< "$changed"; then selected+=("$c"); fi
              elif [ "$rebuild_backend" = true ] || grep -q "^backend/${c}/" <<< "$changed"; then
                selected+=("$c")
              fi
            done
          fi

          json="$(to_json "${selected[@]}")"
          echo "Components to build: $json"
          echo "services=$json" >> "$GITHUB_OUTPUT"

  build-push:
    name: Build & Push – ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: az acr login --name "$ACR_NAME"

      # Backend Dockerfiles copy backend/pom.xml and common-contracts, so the build
      # context must be backend/ (the Maven build runs inside the image).
      - name: Build & push image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          if [ "$SERVICE" = "frontend" ]; then
            context="frontend"; dockerfile="frontend/Dockerfile"
          else
            context="backend"; dockerfile="backend/${SERVICE}/Dockerfile"
          fi
          image="${ACR_NAME}.azurecr.io/${SERVICE}"
          docker build -t "${image}:${IMAGE_TAG}" -t "${image}:latest" -f "$dockerfile" "$context"
          docker push --all-tags "$image"

  deploy:
    name: Helm Deploy to AKS
    needs: [detect-changes, build-push]
    # Run when images were built successfully, or when nothing needed building.
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.build-push.result == 'success' || needs.build-push.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          cluster-name: ${{ env.AKS_CLUSTER }}
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Write secret values
        env:
          HELM_SECRETS_VALUES: ${{ secrets.HELM_SECRETS_VALUES }}
        run: |
          if [ -z "$HELM_SECRETS_VALUES" ]; then
            echo "::error::Repository secret HELM_SECRETS_VALUES is not set (see docs/deployment/AKS-HELM-DEPLOYMENT.md)."
            exit 1
          fi
          umask 077
          printf '%s\n' "$HELM_SECRETS_VALUES" > "$RUNNER_TEMP/values-secrets.yaml"

      # Built components get this commit's SHA; the rest keep whatever tag is
      # running now, so a single-service change never redeploys the others.
      - name: Resolve image tags
        env:
          BUILT: ${{ needs.detect-changes.outputs.services }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/image-tags.yaml"
          backend_lines=""
          frontend_tag=""
          for c in $ALL_COMPONENTS; do
            if jq -e --arg c "$c" 'any(.[]; . == $c)' <<< "$BUILT" > /dev/null; then
              tag="$IMAGE_TAG"
            else
              image="$(kubectl get deployment "$c" -n "$APPS_NAMESPACE" \
                -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
              if [ -z "$image" ]; then
                echo "::error::'$c' is not deployed yet and was not built. Run this workflow manually with target_service=all."
                exit 1
              fi
              tag="${image##*:}"
            fi
            echo "$c -> $tag"
            if [ "$c" = "frontend" ]; then
              frontend_tag="$tag"
            else
              backend_lines+="  ${c}:"$'\n'"    image:"$'\n'"      tag: \"${tag}\""$'\n'
            fi
          done
          {
            echo "services:"
            printf '%s' "$backend_lines"
            echo "frontend:"
            echo "  image:"
            echo "    tag: \"${frontend_tag}\""
          } > "$out"

      - name: Helm lint
        run: |
          profile_args=()
          if [ "$DEPLOY_PROFILE" != "production" ]; then
            profile_args=(-f "$CHART_PATH/values-${DEPLOY_PROFILE}.yaml")
          fi
          helm lint "$CHART_PATH" "${profile_args[@]}" -f "$RUNNER_TEMP/values-secrets.yaml"

      - name: Helm upgrade --install
        run: |
          set -euo pipefail
          profile_args=()
          if [ "$DEPLOY_PROFILE" != "production" ]; then
            profile_args=(-f "$CHART_PATH/values-${DEPLOY_PROFILE}.yaml")
          fi
          helm upgrade --install "$HELM_RELEASE" "$CHART_PATH" \
            --namespace "$HELM_NAMESPACE" \
            "${profile_args[@]}" \
            -f "$RUNNER_TEMP/values-secrets.yaml" \
            -f "$RUNNER_TEMP/image-tags.yaml" \
            --set global.imageRegistry="${ACR_NAME}.azurecr.io" \
            --wait --timeout 20m

      - name: Verify deployment
        run: |
          helm status "$HELM_RELEASE" -n "$HELM_NAMESPACE"
          kubectl get pods -n swiftdrop-data -o wide
          kubectl get pods -n swiftdrop-messaging -o wide
          kubectl get pods,svc,hpa,ingress -n "$APPS_NAMESPACE" -o wide

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -l app.kubernetes.io/part-of=swiftdrop -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 60 || true
          # Logs of every pod with a container that is not ready (includes CrashLoopBackOff).
          for ns in swiftdrop-apps swiftdrop-data swiftdrop-messaging; do
            pods="$(kubectl get pods -n "$ns" -o json 2>/dev/null \
              | jq -r '.items[] | select(([.status.containerStatuses[]?.ready] | all) | not) | .metadata.name' || true)"
            for pod in $pods; do
              echo "── $ns/$pod"
              kubectl logs -n "$ns" "$pod" --all-containers --tail=80 || true
              kubectl logs -n "$ns" "$pod" --all-containers --previous --tail=40 2>/dev/null || true
            done
          done

      - name: Remove secret values
        if: always()
        run: rm -f "$RUNNER_TEMP/values-secrets.yaml"

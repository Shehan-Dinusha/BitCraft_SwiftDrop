# Dependabot opens PRs against `dev` when a dependency has a newer or patched version.
# Minor/patch updates are grouped per ecosystem to keep the PR count manageable.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Base images of every Dockerfile (eclipse-temurin, maven, node, nginx-unprivileged).
  - package-ecosystem: docker
    directories:
      - /backend/*
      - /frontend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

# Accepted Trivy findings. Every entry needs a reason; keep this list short.
misconfigurations:
  # Read-only root filesystem: PostgreSQL, RabbitMQ and Redis write runtime files
  # (sockets, pid/cookie files, config rendered by the image entrypoint) outside
  # their data volume. They already run as non-root with all capabilities dropped.
  # All SwiftDrop application pods do use a read-only root filesystem.
  - id: AVD-KSV-0014
    paths:
      - "infra/helm/swiftdrop/templates/postgres.yaml"
      - "infra/helm/swiftdrop/templates/rabbitmq.yaml"
      - "infra/helm/swiftdrop/templates/redis.yaml"
    statement: Third-party data stores need a writable root filesystem.

  # False positive: the rule matches "TOKEN" in the key names. These two keys hold
  # token lifetimes (milliseconds / days), not secret values. Real secrets (DB
  # passwords, JWT keys, OAuth client secret) come from Kubernetes Secrets.
  - id: AVD-KSV-0109
    paths:
      - "infra/helm/swiftdrop/templates/backend-services.yaml"
    statement: JWT_*_TOKEN_EXPIRATION_* are durations, not secrets.

    restart: unless-stopped
    networks:
      - swiftdrop-net

  # ═══════════════════════════════════════════════════════════════════════════
  # DATABASE – Pricing Service (Port 5434)
  # ═══════════════════════════════════════════════════════════════════════════
  pricing-postgres:
    image: postgres:16-alpine
    container_name: swiftdrop-pricing-postgres
    hostname: pricing-postgres
    ports:

# ──────────────────────────────────────────────────────────────────────────────
# SwiftDrop – Local Development Infrastructure
# Physical Database Isolation: 9 dedicated PostgreSQL 16 containers
# Event Messaging: RabbitMQ 3.13 with pre-configured exchanges & queues
# ──────────────────────────────────────────────────────────────────────────────
name: swiftdrop

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # MESSAGE BROKER
  # ═══════════════════════════════════════════════════════════════════════════
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: swiftdrop-rabbitmq
    hostname: swiftdrop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-swiftdrop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-changeme_rabbit}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-SWIFTDROP_ERLANG_COOKIE_SECRET}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/local/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    configs:
      - source: rabbitmq_conf
        target: /etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    networks:
      - swiftdrop-net

  # ═══════════════════════════════════════════════════════════════════════════
  # API GATEWAY AND REAL-TIME TRACKING HUB
  # ═══════════════════════════════════════════════════════════════════════════
  # Shared cache for JWT blacklist and public tracking rate limits.
  redis:
    image: redis:7-alpine
    container_name: swiftdrop-redis
    hostname: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - swiftdrop-net

  auth-iam-service:
    build:
      context: ./backend
      dockerfile: auth-iam-service/Dockerfile
    container_name: swiftdrop-auth-iam
    profiles: ["apps"]
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: default
      DB_URL: jdbc:postgresql://iam-postgres:5432/swiftdrop_iam
      DB_USERNAME: ${POSTGRES_USER:-swiftdrop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-swiftdrop}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-changeme_rabbit}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-swiftdrop-local-dev-secret-key-must-be-at-least-256-bits-long!!}
      JWT_ISSUER: ${JWT_ISSUER:-swiftdrop-iam}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-swiftdrop}
      JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:-3600000}
      JWT_REFRESH_TOKEN_EXPIRATION_DAYS: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-30}
      JWT_BLACKLIST_PREFIX: ${JWT_BLACKLIST_PREFIX:-jwt:blacklist:}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_DISTRICT: ${BOOTSTRAP_ADMIN_DISTRICT:-COLOMBO}
    depends_on:
      iam-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - swiftdrop-net

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: swiftdrop-api-gateway
    profiles: ["apps"]
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: default
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-swiftdrop}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-changeme_rabbit}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MERCHANT_API_KEY_VALIDATION_URL: http://merchant-b2b-service:8086/internal/v1/api-keys/validate
      AUTH_SERVICE_URL: http://auth-iam-service:8081
      ORDER_SERVICE_URL: http://customer-order-service:8082
      PRICING_SERVICE_URL: http://pricing-zone-service:8083
      DISPATCH_SERVICE_URL: http://dispatch-assignment-service:8084
      DELIVERY_SERVICE_URL: http://delivery-execution-service:8085
      MERCHANT_SERVICE_URL: http://merchant-b2b-service:8086
      WEBHOOK_SERVICE_URL: http://webhook-resiliency-service:8087
      NOTIFICATION_SERVICE_URL: http://notification-service:8088
      ANALYTICS_SERVICE_URL: http://analytics-ai-service:8089
      PUBLIC_TRACKING_RATE_LIMIT: ${PUBLIC_TRACKING_RATE_LIMIT:-60}
      PUBLIC_TRACKING_RATE_WINDOW_SECONDS: ${PUBLIC_TRACKING_RATE_WINDOW_SECONDS:-60}
      JWT_BLACKLIST_PREFIX: ${JWT_BLACKLIST_PREFIX:-jwt:blacklist:}
      JWT_SECRET: ${JWT_SECRET:-swiftdrop-local-dev-secret-key-must-be-at-least-256-bits-long!!}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-iam-service:
        condition: service_healthy
      customer-order-service:
        condition: service_healthy
      pricing-zone-service:
        condition: service_healthy
      dispatch-assignment-service:
        condition: service_healthy
      delivery-execution-service:
        condition: service_healthy
      merchant-b2b-service:
        condition: service_healthy
      webhook-resiliency-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      analytics-ai-service:
        condition: service_healthy
    networks:
      - swiftdrop-net


# ──────────────────────────────────────────────────────────────────────────────
# SwiftDrop – Local Development Infrastructure
# Physical Database Isolation: 9 dedicated PostgreSQL 16 containers
# Event Messaging: RabbitMQ 3.13 with pre-configured exchanges & queues
# ──────────────────────────────────────────────────────────────────────────────
name: swiftdrop

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # MESSAGE BROKER
  # ═══════════════════════════════════════════════════════════════════════════
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: swiftdrop-rabbitmq
    hostname: swiftdrop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-swiftdrop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-changeme_rabbit}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-SWIFTDROP_ERLANG_COOKIE_SECRET}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/local/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    configs:
      - source: rabbitmq_conf
        target: /etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - swiftdrop-net

  # ═══════════════════════════════════════════════════════════════════════════
  # API GATEWAY AND REAL-TIME TRACKING HUB
  # ═══════════════════════════════════════════════════════════════════════════
  # Shared cache for JWT blacklist and public tracking rate limits.
  redis:
    image: redis:7-alpine
    container_name: swiftdrop-redis
    hostname: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - swiftdrop-net

  auth-iam-service:
    build:
      context: ./backend
      dockerfile: auth-iam-service/Dockerfile
    container_name: swiftdrop-auth-iam
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:postgresql://iam-postgres:5432/swiftdrop_iam
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-swiftdrop}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-swiftdrop}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-changeme_rabbit}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-swiftdrop-local-dev-secret-key-must-be-at-least-256-bits-long!!}
      JWT_ISSUER: ${JWT_ISSUER:-swiftdrop-iam}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-swiftdrop}
      JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:-3600000}
      JWT_REFRESH_TOKEN_EXPIRATION_DAYS: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-30}
      JWT_BLACKLIST_PREFIX: ${JWT_BLACKLIST_PREFIX:-jwt:blacklist:}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_DISTRICT: ${BOOTSTRAP_ADMIN_DISTRICT:-COLOMBO}
    depends_on:
      iam-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - swiftdrop-net

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: swiftdrop-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: default
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-swiftdrop}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-changeme_rabbit}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MERCHANT_API_KEY_VALIDATION_URL: http://host.docker.internal:8086/internal/v1/api-keys/validate
      PUBLIC_TRACKING_RATE_LIMIT: ${PUBLIC_TRACKING_RATE_LIMIT:-60}
      PUBLIC_TRACKING_RATE_WINDOW_SECONDS: ${PUBLIC_TRACKING_RATE_WINDOW_SECONDS:-60}
      JWT_BLACKLIST_PREFIX: ${JWT_BLACKLIST_PREFIX:-jwt:blacklist:}
      JWT_SECRET: ${JWT_SECRET:-swiftdrop-local-dev-secret-key-must-be-at-least-256-bits-long!!}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - swiftdrop-net

  # ═══════════════════════════════════════════════════════════════════════════
  # DATABASE – IAM Service (Port 5432)
  # ═══════════════════════════════════════════════════════════════════════════
  iam-postgres:
    image: postgres:16-alpine
    container_name: swiftdrop-iam-postgres
    hostname: iam-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: swiftdrop_iam
      POSTGRES_USER: ${POSTGRES_USER:-swiftdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - iam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swiftdrop} -d swiftdrop_iam"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - swiftdrop-net

  # ═══════════════════════════════════════════════════════════════════════════
  # DATABASE – Order Service (Port 5433)
  # ═══════════════════════════════════════════════════════════════════════════
  order-postgres:
    image: postgres:16-alpine
    container_name: swiftdrop-order-postgres
    hostname: order-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: swiftdrop_order
      POSTGRES_USER: ${POSTGRES_USER:-swiftdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:

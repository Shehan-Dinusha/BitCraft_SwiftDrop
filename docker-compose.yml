      - swiftdrop-net

# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGS
# ═══════════════════════════════════════════════════════════════════════════════
configs:
  rabbitmq_conf:
    content: |
      management.load_definitions = /etc/rabbitmq/definitions.json
      vm_memory_high_watermark.relative = 0.7
      disk_free_limit.relative = 1.5
      consumer_timeout = 3600000

# ═══════════════════════════════════════════════════════════════════════════════
# NAMED VOLUMES – Physical isolation: one volume per database instance
# ═══════════════════════════════════════════════════════════════════════════════
volumes:
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local
  iam_pgdata:
    driver: local
  order_pgdata:
    driver: local
  pricing_pgdata:
    driver: local
  dispatch_pgdata:
    driver: local
  delivery_pgdata:
    driver: local
  merchant_pgdata:
    driver: local
  webhook_pgdata:
    driver: local
  notify_pgdata:
    driver: local
  analytics_pgdata:
    driver: local

# ═══════════════════════════════════════════════════════════════════════════════
# NETWORKS
# ═══════════════════════════════════════════════════════════════════════════════
networks:
  swiftdrop-net:
    driver: bridge
    name: swiftdrop-network

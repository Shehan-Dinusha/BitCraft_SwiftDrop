      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - swiftdrop-net

  # ═══════════════════════════════════════════════════════════════════════════
  # DATABASE – Dispatch Service (Port 5435)
  # ═══════════════════════════════════════════════════════════════════════════
  dispatch-postgres:
    image: postgres:16-alpine
    container_name: swiftdrop-dispatch-postgres
    hostname: dispatch-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: swiftdrop_dispatch
      POSTGRES_USER: ${POSTGRES_USER:-swiftdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg}
      PGDATA: /var/lib/postgresql/data/pgdata

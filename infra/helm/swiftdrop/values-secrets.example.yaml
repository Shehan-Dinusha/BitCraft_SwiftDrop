# ──────────────────────────────────────────────────────────────────────────────
# SwiftDrop — secret values TEMPLATE (safe to commit: contains no real secrets)
#
# Generate the real file with:   bash scripts/generate-helm-secrets.sh
# which writes infra/helm/swiftdrop/values-secrets.yaml (git-ignored).
#
# For GitHub Actions, store that whole file as the repository secret
# HELM_SECRETS_VALUES:   gh secret set HELM_SECRETS_VALUES < infra/helm/swiftdrop/values-secrets.yaml
# ──────────────────────────────────────────────────────────────────────────────

secrets:
  postgres:
    iam:       { username: swiftdrop, password: CHANGE_ME }
    order:     { username: swiftdrop, password: CHANGE_ME }
    pricing:   { username: swiftdrop, password: CHANGE_ME }
    dispatch:  { username: swiftdrop, password: CHANGE_ME }
    delivery:  { username: swiftdrop, password: CHANGE_ME }
    merchant:  { username: swiftdrop, password: CHANGE_ME }
    webhook:   { username: swiftdrop, password: CHANGE_ME }
    notify:    { username: swiftdrop, password: CHANGE_ME }
    analytics: { username: swiftdrop, password: CHANGE_ME }

  rabbitmq:
    username: swiftdrop
    password: CHANGE_ME
    erlangCookie: CHANGE_ME

  jwt:
    secret: CHANGE_ME_TO_AT_LEAST_32_CHARACTERS_LONG
    # openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt-private.pem
    privateKey: |
      -----BEGIN PRIVATE KEY-----
      CHANGE_ME
      -----END PRIVATE KEY-----
    # openssl pkey -in jwt-private.pem -pubout -out jwt-public.pem
    publicKey: |
      -----BEGIN PUBLIC KEY-----
      CHANGE_ME
      -----END PUBLIC KEY-----

  bootstrapAdmin:
    username: admin
    password: CHANGE_ME
    email: admin@example.com
    district: COLOMBO

  # Optional — leave empty to disable Google sign-in.
  googleOAuth:
    clientId: ""
    clientSecret: ""

  # Optional — analytics-ai-service runs with AI_PROVIDER=mock by default.
  aiProvider:
    apiKey: ""

# Let's Encrypt account e-mail (expiry notices).
certManager:
  clusterIssuer:
    email: you@example.com

# ──────────────────────────────────────────────────────────────────────────────
# SwiftDrop Helm chart — default values (FULL / production profile)
#
#   helm upgrade --install swiftdrop infra/helm/swiftdrop -n default \
#     -f infra/helm/swiftdrop/values-student.yaml \      # optional: small cluster profile
#     -f infra/helm/swiftdrop/values-secrets.yaml        # never committed
#
# Any string inside a service `config:` map is rendered with `tpl`, so it can
# reference other values, e.g. "{{ .Values.namespaces.apps }}".
# ──────────────────────────────────────────────────────────────────────────────

global:
  # Registry prefix for SwiftDrop images (CD overrides this with the real ACR login server).
  imageRegistry: swiftdropacr.azurecr.io
  # Fallback tag when a component has no explicit image.tag (CD pins every component to a git SHA).
  imageTag: latest
  imagePullPolicy: IfNotPresent
  # Applied to every Spring Boot container. The JVM default (25% of the container
  # limit) leaves most of the memory limit unused; command-line flags in a
  # Dockerfile still take precedence over this.
  javaToolOptions: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"

# Optional image pull secrets (not needed on AKS when the cluster is attached to ACR).
imagePullSecrets: []

# The namespace split is an architecture rule: apps / data / messaging.
namespaces:
  # Set to false only if the namespaces are created outside this chart.
  create: true
  apps: swiftdrop-apps
  data: swiftdrop-data
  messaging: swiftdrop-messaging

# ── Storage ──────────────────────────────────────────────────────────────────
# Azure Managed Disk StorageClasses created by the chart (cluster-scoped).
# WaitForFirstConsumer provisions each volume in the same zone as its pod.
storageClasses:
  - name: managed-csi-premium
    provisioner: disk.csi.azure.com
    reclaimPolicy: Retain
    parameters:
      skuName: Premium_LRS
      cachingmode: ReadOnly
      fsType: ext4
  - name: managed-csi-standard
    provisioner: disk.csi.azure.com
    reclaimPolicy: Retain
    parameters:
      skuName: StandardSSD_LRS
      cachingmode: ReadOnly
      fsType: ext4

# ── Secrets ──────────────────────────────────────────────────────────────────
# Real values live in values-secrets.yaml (git-ignored; see values-secrets.example.yaml
# and scripts/generate-helm-secrets.sh). With create=false the chart only
# references Secrets with the same names that you created yourself.
secrets:
  create: true
  # Per-database credentials, keyed like postgres.databases (iam, order, ...).
  # Each becomes "<key>-postgres-credentials" in the data AND apps namespaces.
  postgres: {}
  rabbitmq:
    username: swiftdrop
    password: ""
    erlangCookie: ""
  jwt:
    # HS256 shared secret (>= 32 chars). Still read by the gateway and auth-iam.
    secret: ""
    # RS256 key pair, PEM. Private key MUST be PKCS#8 ("BEGIN PRIVATE KEY").
    # auth-iam-service refuses to start in the aks profile without both keys.
    privateKey: ""
    publicKey: ""
  bootstrapAdmin:
    username: ""
    password: ""
    email: ""
    district: COLOMBO
  googleOAuth:
    clientId: ""
    clientSecret: ""
  aiProvider:
    apiKey: ""

# ── Shared config (ConfigMap "swiftdrop-common-config", mounted into every backend service) ──
commonConfig:
  SPRING_PROFILES_ACTIVE: aks
  SERVER_PORT: "8080"
  RABBITMQ_HOST: "rabbitmq.{{ .Values.namespaces.messaging }}.svc.cluster.local"
  RABBITMQ_PORT: "5672"

# Init container that blocks app start-up until its database / broker / cache accept
# TCP connections, so services do not crash-loop while StatefulSets are starting.
waitForDependencies:
  enabled: true
  image: busybox:1.36.1

# ── Backend service defaults ─────────────────────────────────────────────────
# Merge order per service:  serviceDefaults  <  services.<name>  <  serviceOverrides
# NOTE: boolean fields cannot be switched off through this merge (Sprig's
# mergeOverwrite skips `false`), except hpa.enabled which is resolved explicitly.
serviceDefaults:
  replicas: 2
  port: 8080
  component: service
  boundedContext: ""
  database: ""
  usesRedis: false
  image:
    repository: ""
    tag: ""
  config: {}
  secretEnv: []
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    cpuUtilization: 70
    memoryUtilization: 80
    scaleUpPods: 2
  probes:
    readinessInitialDelaySeconds: 20
    livenessInitialDelaySeconds: 40
    startupFailureThreshold: 30
  networkPolicy:
    # When non-empty, only pods of these services (same namespace) may call this service.
    allowFromServices: []

# Applied on top of every service (used by values-student.yaml to shrink the cluster).
serviceOverrides: {}

# ── Backend services ─────────────────────────────────────────────────────────
# Add new application.yml variables here (non-secret → config, secret → secretEnv),
# and mirror them in .env.example and docker-compose.yml.
services:
  api-gateway:
    enabled: true
    component: gateway
    usesRedis: true
    image:
      repository: api-gateway
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
    hpa: { minReplicas: 2, maxReplicas: 10, scaleUpPods: 2 }
    config:
      REDIS_HOST: "redis.{{ .Values.namespaces.messaging }}.svc.cluster.local"
      REDIS_PORT: "6379"
      CORS_ALLOWED_ORIGINS: "{{ ternary \"https\" \"http\" .Values.ingress.tls.enabled }}://{{ .Values.ingress.hosts.app }}"
      AUTH_SERVICE_URL: "http://auth-iam-service.{{ .Values.namespaces.apps }}.svc.cluster.local:8080"
      ORDER_SERVICE_URL: "http://customer-order-service.{{ .Values.namespaces.apps }}.svc.cluster.local:8080"
      PRICING_SERVICE_URL: "http://pricing-zone-service.{{ .Values.namespaces.apps }}.svc.cluster.local:8080"
      DISPATCH_SERVICE_URL: "http://dispatch-assignment-service.{{ .Values.namespaces.apps }}.svc.cluster.local:8080"
      DELIVERY_SERVICE_URL: "http://delivery-execution-service.{{ .Values.namespaces.apps }}.svc.cluster.local:8080"
      MERCHANT_SERVICE_URL: "http://merchant-b2b-service.{{ .Values.namespaces.apps }}.svc.cluster.local:8080"
      WEBHOOK_SERVICE_URL: "http://webhook-resiliency-service.{{ .Values.namespaces.apps }}.svc.cluster.local:8080"
      NOTIFICATION_SERVICE_URL: "http://notification-service.{{ .Values.namespaces.apps }}.svc.cluster.local:8080"
      ANALYTICS_SERVICE_URL: "http://analytics-ai-service.{{ .Values.namespaces.apps }}.svc.cluster.local:8080"
      MERCHANT_API_KEY_VALIDATION_URL: "http://merchant-b2b-service.{{ .Values.namespaces.apps }}.svc.cluster.local:8080/internal/v1/api-keys/validate"
      MERCHANT_API_KEY_CACHE_TTL_SECONDS: "60"
      PUBLIC_TRACKING_RATE_LIMIT: "60"
      PUBLIC_TRACKING_RATE_WINDOW_SECONDS: "60"
      JWT_BLACKLIST_PREFIX: "jwt:blacklist:"
      JWT_ALGORITHM: RS256
      JWT_ISSUER: swiftdrop-iam
      JWT_AUDIENCE: swiftdrop
      JWT_JWKS_URL: "http://auth-iam-service.{{ .Values.namespaces.apps }}.svc.cluster.local:8080/api/v1/auth/.well-known/jwks.json"
      JWT_JWKS_CACHE_TTL_SECONDS: "300"
      JWT_JWKS_REFETCH_COOLDOWN_SECONDS: "5"
    secretEnv:
      - { name: JWT_SECRET, secretName: swiftdrop-jwt-credentials, key: secret }

  auth-iam-service:
    enabled: true
    boundedContext: iam
    database: iam
    usesRedis: true
    image:
      repository: auth-iam-service
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 500m, memory: 1Gi }
    hpa: { minReplicas: 2, maxReplicas: 6, scaleUpPods: 2 }
    config:
      REDIS_HOST: "redis.{{ .Values.namespaces.messaging }}.svc.cluster.local"
      REDIS_PORT: "6379"
      JWT_ALGORITHM: RS256
      JWT_ISSUER: swiftdrop-iam
      JWT_AUDIENCE: swiftdrop
      JWT_ACCESS_TOKEN_EXPIRATION_MS: "3600000"
      JWT_REFRESH_TOKEN_EXPIRATION_DAYS: "30"
      JWT_BLACKLIST_PREFIX: "jwt:blacklist:"
      GOOGLE_REDIRECT_URI: "{{ ternary \"https\" \"http\" .Values.ingress.tls.enabled }}://{{ .Values.ingress.hosts.app }}/api/v1/auth/oauth2/google/callback"
      FRONTEND_URL: "{{ ternary \"https\" \"http\" .Values.ingress.tls.enabled }}://{{ .Values.ingress.hosts.app }}"
    secretEnv:
      - { name: JWT_SECRET, secretName: swiftdrop-jwt-credentials, key: secret }
      - { name: JWT_PRIVATE_KEY, secretName: swiftdrop-jwt-credentials, key: private-key }
      - { name: JWT_PUBLIC_KEY, secretName: swiftdrop-jwt-credentials, key: public-key }
      - { name: BOOTSTRAP_ADMIN_USERNAME, secretName: swiftdrop-bootstrap-admin, key: username, optional: true }
      - { name: BOOTSTRAP_ADMIN_PASSWORD, secretName: swiftdrop-bootstrap-admin, key: password, optional: true }
      - { name: BOOTSTRAP_ADMIN_EMAIL, secretName: swiftdrop-bootstrap-admin, key: email, optional: true }
      - { name: BOOTSTRAP_ADMIN_DISTRICT, secretName: swiftdrop-bootstrap-admin, key: district, optional: true }
      - { name: GOOGLE_CLIENT_ID, secretName: swiftdrop-google-oauth, key: client-id, optional: true }
      - { name: GOOGLE_CLIENT_SECRET, secretName: swiftdrop-google-oauth, key: client-secret, optional: true }

  customer-order-service:
    enabled: true
    boundedContext: order
    database: order
    image:
      repository: customer-order-service
    hpa: { minReplicas: 2, maxReplicas: 12, scaleUpPods: 3 }
    config:
      PRICING_SERVICE_URL: "http://pricing-zone-service.{{ .Values.namespaces.apps }}.svc.cluster.local:8080"
      PRICING_CONNECT_TIMEOUT_MS: "1000"
      PRICING_READ_TIMEOUT_MS: "5000"
      PUBLIC_TRACKING_BASE_URL: "{{ ternary \"https\" \"http\" .Values.ingress.tls.enabled }}://{{ .Values.ingress.hosts.app }}"

  pricing-zone-service:
    enabled: true
    boundedContext: pricing
    database: pricing
    image:
      repository: pricing-zone-service
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    hpa: { minReplicas: 2, maxReplicas: 6, scaleUpPods: 2 }

  dispatch-assignment-service:
    enabled: true
    boundedContext: dispatch
    database: dispatch
    image:
      repository: dispatch-assignment-service
    hpa: { minReplicas: 2, maxReplicas: 10, scaleUpPods: 2 }

  delivery-execution-service:
    enabled: true
    boundedContext: delivery
    database: delivery
    image:
      repository: delivery-execution-service
    hpa: { minReplicas: 2, maxReplicas: 12, scaleUpPods: 3 }

  merchant-b2b-service:
    enabled: true
    boundedContext: merchant
    database: merchant
    image:
      repository: merchant-b2b-service
    hpa: { minReplicas: 2, maxReplicas: 8, scaleUpPods: 2 }
    config:
      ORDER_SERVICE_URL: "http://customer-order-service.{{ .Values.namespaces.apps }}.svc.cluster.local:8080"

  webhook-resiliency-service:
    enabled: true
    boundedContext: webhook
    database: webhook
    image:
      repository: webhook-resiliency-service
    hpa: { minReplicas: 2, maxReplicas: 8, scaleUpPods: 2 }
    networkPolicy:
      allowFromServices: [api-gateway]

  notification-service:
    enabled: true
    boundedContext: notification
    database: notify
    image:
      repository: notification-service
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    hpa: { minReplicas: 2, maxReplicas: 8, scaleUpPods: 2 }
    config:
      AUTH_SERVICE_URL: "http://auth-iam-service.{{ .Values.namespaces.apps }}.svc.cluster.local:8080"
      CONTACT_MODE: iam
      CONTACT_CACHE_TTL_MINUTES: "10"

  analytics-ai-service:
    enabled: true
    boundedContext: analytics
    database: analytics
    image:
      repository: analytics-ai-service
    resources:
      requests: { cpu: "1", memory: 1Gi }
      limits: { cpu: "2", memory: 2Gi }
    hpa: { minReplicas: 2, maxReplicas: 6, scaleUpPods: 1 }
    probes:
      readinessInitialDelaySeconds: 30
      livenessInitialDelaySeconds: 60
    config:
      AI_PROVIDER: mock
      AI_MODEL: ""
      AI_ENDPOINT: ""
      GATEWAY_URL: "http://api-gateway.{{ .Values.namespaces.apps }}.svc.cluster.local:8080"
    secretEnv:
      - { name: AI_API_KEY, secretName: analytics-ai-provider, key: api-key, optional: true }

# ── Frontend (React build served by nginx) ───────────────────────────────────
frontend:
  enabled: true
  replicas: 2
  image:
    repository: frontend
    tag: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }
  # Mounted over the image's /etc/nginx/conf.d/default.conf (rendered with tpl).
  # The Ingress already sends /api and /ws straight to the gateway; these proxy
  # blocks keep the pod usable on its own (kubectl port-forward).
  nginxConfig: |
    server {
      listen 80;
      root /usr/share/nginx/html;
      index index.html;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
      }
      location /api/v1/tracking/ {
        proxy_pass http://api-gateway.{{ .Values.namespaces.apps }}.svc.cluster.local:8080;
        proxy_buffering off;
        proxy_read_timeout 3600s;
      }
      location /api/ {
        proxy_pass http://api-gateway.{{ .Values.namespaces.apps }}.svc.cluster.local:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      location /ws/ {
        proxy_pass http://api-gateway.{{ .Values.namespaces.apps }}.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
      }
      location / {
        try_files $uri $uri/ /index.html;
      }
    }

# ── PostgreSQL: one StatefulSet per bounded context (database-per-service) ──
# Merge order per database:  postgres.defaults  <  postgres.databases.<key>  <  postgres.overrides
# Names: StatefulSet "<key>-postgres", headless Service "<key>-postgres-headless",
# Secret "<key>-postgres-credentials", PVC template "<key>-pgdata".
postgres:
  image: postgres:16-alpine
  defaults:
    storageClassName: managed-csi-premium
    storage: 20Gi
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
  overrides: {}
  databases:
    iam:
      dbName: swiftdrop_iam
      boundedContext: iam
      storageClassName: managed-csi-standard
      storage: 10Gi
      resources:
        requests: { cpu: 250m, memory: 256Mi }
        limits: { cpu: 500m, memory: 512Mi }
    order:
      dbName: swiftdrop_order
      boundedContext: order
      storage: 50Gi
    pricing:
      dbName: swiftdrop_pricing
      boundedContext: pricing
      storageClassName: managed-csi-standard
      storage: 10Gi
      resources:
        requests: { cpu: 250m, memory: 256Mi }
        limits: { cpu: 500m, memory: 512Mi }
    dispatch:
      dbName: swiftdrop_dispatch
      boundedContext: dispatch
      storage: 20Gi
    delivery:
      dbName: swiftdrop_delivery
      boundedContext: delivery
      storage: 50Gi
    merchant:
      dbName: swiftdrop_merchant
      boundedContext: merchant
      storage: 50Gi
    webhook:
      dbName: swiftdrop_webhook
      boundedContext: webhook
      storage: 30Gi
    notify:
      dbName: swiftdrop_notify
      boundedContext: notification
      storageClassName: managed-csi-standard
      storage: 20Gi
      resources:
        requests: { cpu: 250m, memory: 256Mi }
        limits: { cpu: 500m, memory: 512Mi }
    analytics:
      dbName: swiftdrop_analytics
      boundedContext: analytics
      storage: 50Gi
      resources:
        requests: { cpu: "1", memory: 1Gi }
        limits: { cpu: "2", memory: 2Gi }

# ── RabbitMQ (event broker) ──────────────────────────────────────────────────
# Exchanges, queues and bindings are declared by each service's RabbitMQConfig.java,
# so the broker does not import infra/local/rabbitmq/definitions.json here.
rabbitmq:
  image: rabbitmq:3.13-management-alpine
  storageClassName: managed-csi-standard
  storage: 20Gi
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  # Mounted as /etc/rabbitmq/conf.d/20-swiftdrop.conf (mirrors docker-compose).
  config: |
    vm_memory_high_watermark.relative = 0.7
    disk_free_limit.relative = 1.5
    consumer_timeout = 3600000

# ── Redis (JWT blacklist + public tracking rate limits) ─────────────────────
redis:
  image: redis:7-alpine
  storageClassName: managed-csi-standard
  storage: 5Gi
  maxMemory: 256mb
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# ── Ingress ──────────────────────────────────────────────────────────────────
# Uses only standard networking.k8s.io/v1 fields, so any Ingress controller works
# (Traefik is installed by docs/deployment/AKS-HELM-DEPLOYMENT.md).
#   app host → frontend, plus same-origin /api and /ws to the gateway (no CORS needed)
#   api host → gateway only (merchant B2B integrations, webhooks, Swagger UI);
#              /actuator is deliberately NOT exposed.
ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    app: swiftdrop.bitcraft.biz
    api: api.swiftdrop.bitcraft.biz
  tls:
    enabled: true
    secretName: swiftdrop-tls

# cert-manager ClusterIssuer (cert-manager itself is installed separately).
certManager:
  clusterIssuer:
    create: true
    name: letsencrypt-prod
    # Required when create=true: Let's Encrypt expiry notices go here.
    email: ""
    server: https://acme-v02.api.letsencrypt.org/directory

{{- /*
  Kubernetes Secrets. Values come from values-secrets.yaml (never committed).
  A Secret can only be referenced from its own namespace, so shared credentials
  are rendered once per consuming namespace:
    <db>-postgres-credentials → data (PostgreSQL) + apps (the owning service)
    rabbitmq-credentials      → messaging (broker) + apps (all services)
*/ -}}
{{- if .Values.secrets.create }}
{{- $s := .Values.secrets }}
{{- $apps := .Values.namespaces.apps }}

{{- $enabledDbs := include "swiftdrop.enabledDatabases" . | splitList "," }}
{{- range $key := keys .Values.postgres.databases | sortAlpha }}
{{- if has $key $enabledDbs }}
{{- $cred := index ($s.postgres | default dict) $key | default dict }}
{{- $password := required (printf "secrets.postgres.%s.password is required (see values-secrets.example.yaml)" $key) $cred.password }}
{{- range $ns := list $.Values.namespaces.data $apps }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "swiftdrop.postgresSecretName" $key }}
  namespace: {{ $ns }}
  labels:
    {{- include "swiftdrop.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $key }}-postgres
type: Opaque
stringData:
  username: {{ $cred.username | default "swiftdrop" | quote }}
  password: {{ $password | quote }}
{{- end }}
{{- end }}
{{- end }}

{{- $rmqPassword := required "secrets.rabbitmq.password is required" $s.rabbitmq.password }}
{{- $rmqCookie := required "secrets.rabbitmq.erlangCookie is required" $s.rabbitmq.erlangCookie }}
{{- range $ns := list $.Values.namespaces.messaging $apps }}
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "swiftdrop.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/name: rabbitmq
type: Opaque
stringData:
  username: {{ $s.rabbitmq.username | default "swiftdrop" | quote }}
  password: {{ $rmqPassword | quote }}
  erlang-cookie: {{ $rmqCookie | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: swiftdrop-jwt-credentials
  namespace: {{ $apps }}
  labels:
    {{- include "swiftdrop.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  secret: {{ required "secrets.jwt.secret is required" $s.jwt.secret | quote }}
  private-key: {{ required "secrets.jwt.privateKey (PKCS#8 PEM) is required for RS256" $s.jwt.privateKey | quote }}
  public-key: {{ required "secrets.jwt.publicKey (X.509 PEM) is required for RS256" $s.jwt.publicKey | quote }}

{{- with $s.bootstrapAdmin }}
{{- if and .username .password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: swiftdrop-bootstrap-admin
  namespace: {{ $apps }}
  labels:
    {{- include "swiftdrop.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  username: {{ .username | quote }}
  password: {{ .password | quote }}
  email: {{ .email | default "" | quote }}
  district: {{ .district | default "COLOMBO" | quote }}
{{- end }}
{{- end }}

{{- with $s.googleOAuth }}
{{- if and .clientId .clientSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: swiftdrop-google-oauth
  namespace: {{ $apps }}
  labels:
    {{- include "swiftdrop.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  client-id: {{ .clientId | quote }}
  client-secret: {{ .clientSecret | quote }}
{{- end }}
{{- end }}

{{- with $s.aiProvider }}
{{- if .apiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: analytics-ai-provider
  namespace: {{ $apps }}
  labels:
    {{- include "swiftdrop.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .apiKey | quote }}
{{- end }}
{{- end }}
{{- end }}

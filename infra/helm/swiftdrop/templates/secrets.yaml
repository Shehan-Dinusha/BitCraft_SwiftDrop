{{- /*
  Kubernetes Secrets. Values come from values-secrets.yaml (never committed).
  A Secret can only be referenced from its own namespace, so shared credentials
  are rendered once per consuming namespace:
    <db>-postgres-credentials → data (PostgreSQL) + apps (the owning service)
    rabbitmq-credentials      → messaging (broker) + apps (all services)
*/ -}}
{{- if .Values.secrets.create }}
{{- $s := .Values.secrets }}
{{- $apps := .Values.namespaces.apps }}

{{- $enabledDbs := include "swiftdrop.enabledDatabases" . | splitList "," }}
{{- range $key := keys .Values.postgres.databases | sortAlpha }}
{{- if has $key $enabledDbs }}
{{- $cred := index ($s.postgres | default dict) $key | default dict }}
{{- $password := required (printf "secrets.postgres.%s.password is required (see values-secrets.example.yaml)" $key) $cred.password }}
{{- range $ns := list $.Values.namespaces.data $apps }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "swiftdrop.postgresSecretName" $key }}
  namespace: {{ $ns }}
  labels:
    {{- include "swiftdrop.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $key }}-postgres
type: Opaque
stringData:
  username: {{ $cred.username | default "swiftdrop" | quote }}
  password: {{ $password | quote }}
{{- end }}
{{- end }}
{{- end }}

{{- $rmqPassword := required "secrets.rabbitmq.password is required" $s.rabbitmq.password }}
{{- $rmqCookie := required "secrets.rabbitmq.erlangCookie is required" $s.rabbitmq.erlangCookie }}
{{- range $ns := list $.Values.namespaces.messaging $apps }}
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "swiftdrop.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/name: rabbitmq
type: Opaque
stringData:
  username: {{ $s.rabbitmq.username | default "swiftdrop" | quote }}
  password: {{ $rmqPassword | quote }}
  erlang-cookie: {{ $rmqCookie | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: swiftdrop-jwt-credentials
  namespace: {{ $apps }}
  labels:
    {{- include "swiftdrop.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  secret: {{ required "secrets.jwt.secret is required" $s.jwt.secret | quote }}
  private-key: {{ required "secrets.jwt.privateKey (PKCS#8 PEM) is required for RS256" $s.jwt.privateKey | quote }}
  public-key: {{ required "secrets.jwt.publicKey (X.509 PEM) is required for RS256" $s.jwt.publicKey | quote }}

{{- with $s.bootstrapAdmin }}
{{- if and .username .password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: swiftdrop-bootstrap-admin
  namespace: {{ $apps }}
  labels:
    {{- include "swiftdrop.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  username: {{ .username | quote }}
  password: {{ .password | quote }}
  email: {{ .email | default "" | quote }}
  district: {{ .district | default "COLOMBO" | quote }}
{{- end }}
{{- end }}

{{- with $s.googleOAuth }}
{{- if and .clientId .clientSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: swiftdrop-google-oauth
  namespace: {{ $apps }}
  labels:
    {{- include "swiftdrop.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  client-id: {{ .clientId | quote }}
  client-secret: {{ .clientSecret | quote }}
{{- end }}
{{- end }}

{{- with $s.podStorage }}
{{- if .azureConnectionString }}
---
apiVersion: v1
kind: Secret
metadata:
  name: delivery-pod-storage
  namespace: {{ $apps }}
  labels:
    {{- include "swiftdrop.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  azure-connection-string: {{ .azureConnectionString | quote }}
{{- end }}
{{- end }}

{{- with $s.aiProvider }}
{{- if .apiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: analytics-ai-provider
  namespace: {{ $apps }}
  labels:
    {{- include "swiftdrop.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .apiKey | quote }}
{{- end }}
{{- end }}

{{- with $s.acsEmail }}
{{- if .accessKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-acs-email
  namespace: {{ $apps }}
  labels:
    {{- include "swiftdrop.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ .accessKey | quote }}
{{- end }}
{{- end }}

{{- with $s.webPush }}
{{- if .privateKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-web-push
  namespace: {{ $apps }}
  labels:
    {{- include "swiftdrop.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  private-key: {{ .privateKey | quote }}
{{- end }}
{{- end }}

{{- with $s.webhook }}
{{- if .secretKeyring }}
{{- /* Checked here so a malformed keyring fails the deploy, not the pods. The service checks it again. */ -}}
{{- $ring := .secretKeyring | mustFromJson }}
{{- if not (kindIs "map" $ring) }}
{{- fail "secrets.webhook.secretKeyring must be a JSON object: {\"activeKeyId\":\"v1\",\"keys\":{\"v1\":\"<base64>\"}}" }}
{{- end }}
{{- $keys := get $ring "keys" }}
{{- if not (and (kindIs "map" $keys) $keys) }}
{{- fail "secrets.webhook.secretKeyring needs a non-empty \"keys\" object" }}
{{- end }}
{{- range $id, $key := $keys }}
{{- if not (regexMatch "^[a-z0-9-]{1,32}$" $id) }}
{{- fail (printf "secrets.webhook.secretKeyring: key id %q must match ^[a-z0-9-]{1,32}$" $id) }}
{{- end }}
{{- if not (and (kindIs "string" $key) (regexMatch "^[A-Za-z0-9+/]{43}=$" $key)) }}
{{- fail (printf "secrets.webhook.secretKeyring: key %q must be standard Base64 of exactly 32 bytes (bash scripts/generate-webhook-keyring.sh --key)" $id) }}
{{- end }}
{{- end }}
{{- $active := get $ring "activeKeyId" }}
{{- if not (and (kindIs "string" $active) (hasKey $keys $active)) }}
{{- fail "secrets.webhook.secretKeyring: activeKeyId must name one of its keys" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: webhook-secret-keyring
  namespace: {{ $apps }}
  labels:
    {{- include "swiftdrop.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/name: webhook-resiliency-service
type: Opaque
stringData:
  keyring: {{ .secretKeyring | quote }}
{{- end }}
{{- end }}
{{- end }}

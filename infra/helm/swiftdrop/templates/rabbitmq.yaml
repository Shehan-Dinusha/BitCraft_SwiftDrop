{{- /* RabbitMQ event broker (namespace: messaging). */ -}}
{{- $ns := .Values.namespaces.messaging }}
{{- $r := .Values.rabbitmq }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: {{ $ns }}
  labels:
    {{- include "swiftdrop.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: rabbitmq
data:
  20-swiftdrop.conf: |
    {{- $r.config | trim | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: {{ $ns }}
  labels:
    {{- include "swiftdrop.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: messaging
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: management, port: 15672, targetPort: 15672 }
    - { name: epmd, port: 4369, targetPort: 4369 }
    - { name: clustering, port: 25672, targetPort: 25672 }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: {{ $ns }}
  labels:
    {{- include "swiftdrop.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: messaging
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: management, port: 15672, targetPort: 15672 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: {{ $ns }}
  labels:
    {{- include "swiftdrop.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: messaging
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "swiftdrop.commonLabels" . | nindent 8 }}
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/component: messaging
      annotations:
        checksum/config: {{ $r.config | sha256sum }}
        checksum/secrets: {{ toYaml .Values.secrets.rabbitmq | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: rabbitmq
          image: {{ $r.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
            - { name: epmd, containerPort: 4369 }
            - { name: clustering, containerPort: 25672 }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: { name: rabbitmq-credentials, key: username }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: rabbitmq-credentials, key: password }
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef: { name: rabbitmq-credentials, key: erlang-cookie }
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/conf.d/20-swiftdrop.conf
              subPath: 20-swiftdrop.conf
              readOnly: true
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: rabbitmq-config
          configMap:
            name: rabbitmq-config
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
        labels:
          app.kubernetes.io/name: rabbitmq
          app.kubernetes.io/part-of: swiftdrop
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ $r.storageClassName }}
        resources:
          requests:
            storage: {{ $r.storage }}

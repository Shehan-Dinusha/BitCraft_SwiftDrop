# ──────────────────────────────────────────────────────────────────────────────
# SwiftDrop – API Gateway (Deployment + Service + HPA)
# Namespace: swiftdrop-apps
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: swiftdrop-apps
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: swiftdrop
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: swiftdrop-apps
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: swiftdrop
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: swiftdrop
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: api-gateway-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-gateway
          image: swiftdropacr.azurecr.io/api-gateway:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: aks
            - name: SERVER_PORT
              value: "8080"
            - name: RABBITMQ_HOST
              value: rabbitmq.swiftdrop-messaging.svc.cluster.local
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: REDIS_HOST
              value: redis.swiftdrop-messaging.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: AUTH_SERVICE_URL
              value: http://auth-iam-service.swiftdrop-apps.svc.cluster.local:8080
            - name: ORDER_SERVICE_URL
              value: http://customer-order-service.swiftdrop-apps.svc.cluster.local:8080
            - name: PRICING_SERVICE_URL
              value: http://pricing-zone-service.swiftdrop-apps.svc.cluster.local:8080
            - name: DISPATCH_SERVICE_URL
              value: http://dispatch-assignment-service.swiftdrop-apps.svc.cluster.local:8080
            - name: DELIVERY_SERVICE_URL
              value: http://delivery-execution-service.swiftdrop-apps.svc.cluster.local:8080
            - name: MERCHANT_SERVICE_URL
              value: http://merchant-b2b-service.swiftdrop-apps.svc.cluster.local:8080
            - name: WEBHOOK_SERVICE_URL
              value: http://webhook-resiliency-service.swiftdrop-apps.svc.cluster.local:8080
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service.swiftdrop-apps.svc.cluster.local:8080
            - name: ANALYTICS_SERVICE_URL
              value: http://analytics-ai-service.swiftdrop-apps.svc.cluster.local:8080
            - name: MERCHANT_API_KEY_VALIDATION_URL
              value: http://merchant-b2b-service.swiftdrop-apps.svc.cluster.local:8080/internal/v1/api-keys/validate
            - name: PUBLIC_TRACKING_RATE_LIMIT
              value: "60"
            - name: PUBLIC_TRACKING_RATE_WINDOW_SECONDS
              value: "60"
            - name: JWT_BLACKLIST_PREFIX
              value: "jwt:blacklist:"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-jwt-credentials
                  key: secret
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: swiftdrop-apps
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: swiftdrop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

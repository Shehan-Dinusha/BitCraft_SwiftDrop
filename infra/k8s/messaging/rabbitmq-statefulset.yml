# ──────────────────────────────────────────────────────────────────────────────
# SwiftDrop – RabbitMQ StatefulSet (swiftdrop-messaging namespace)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: swiftdrop-messaging
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: swiftdrop
    app.kubernetes.io/component: messaging
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
    - name: epmd
      port: 4369
      targetPort: 4369
    - name: clustering
      port: 25672
      targetPort: 25672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: swiftdrop-messaging
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: swiftdrop
    app.kubernetes.io/component: messaging
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: swiftdrop-messaging
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: swiftdrop
    app.kubernetes.io/component: messaging
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: swiftdrop
        app.kubernetes.io/component: messaging
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
            - containerPort: 4369
              name: epmd
            - containerPort: 25672
              name: clustering
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: erlang-cookie
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - "-q"
                - check_running
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - "-q"
                - check_running
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
        labels:
          app.kubernetes.io/name: rabbitmq
          app.kubernetes.io/part-of: swiftdrop
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi-standard
        resources:
          requests:
            storage: 20Gi

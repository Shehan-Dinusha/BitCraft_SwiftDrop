# ──────────────────────────────────────────────────────────────────────────────
# SwiftDrop – Analytics PostgreSQL StatefulSet (50Gi Premium SSD)
# Namespace: swiftdrop-data
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: analytics-postgres-headless
  namespace: swiftdrop-data
  labels:
    app.kubernetes.io/name: analytics-postgres
    app.kubernetes.io/part-of: swiftdrop
    app.kubernetes.io/component: database
    swiftdrop.io/bounded-context: analytics
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: analytics-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: analytics-postgres
  namespace: swiftdrop-data
  labels:
    app.kubernetes.io/name: analytics-postgres
    app.kubernetes.io/part-of: swiftdrop
    app.kubernetes.io/component: database
    swiftdrop.io/bounded-context: analytics
spec:
  serviceName: analytics-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-postgres
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-postgres
        app.kubernetes.io/part-of: swiftdrop
        app.kubernetes.io/component: database
        swiftdrop.io/bounded-context: analytics
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_DB
              value: swiftdrop_analytics
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: analytics-postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-postgres-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: analytics-pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - "-U"
                - "$(POSTGRES_USER)"
                - "-d"
                - swiftdrop_analytics
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - "-U"
                - "$(POSTGRES_USER)"
                - "-d"
                - swiftdrop_analytics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: analytics-pgdata
        labels:
          app.kubernetes.io/name: analytics-postgres
          app.kubernetes.io/part-of: swiftdrop
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi-premium
        resources:
          requests:
            storage: 50Gi

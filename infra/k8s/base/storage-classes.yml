# ──────────────────────────────────────────────────────────────────────────────
# SwiftDrop – Azure Managed Disk StorageClasses
# WaitForFirstConsumer ensures volumes are provisioned in the same AZ as the pod.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: managed-csi-premium
  labels:
    app.kubernetes.io/part-of: swiftdrop
provisioner: disk.csi.azure.com
parameters:
  skuName: Premium_LRS
  cachingmode: ReadOnly
  fsType: ext4
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: managed-csi-standard
  labels:
    app.kubernetes.io/part-of: swiftdrop
provisioner: disk.csi.azure.com
parameters:
  skuName: StandardSSD_LRS
  cachingmode: ReadOnly
  fsType: ext4
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true

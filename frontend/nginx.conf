# PWA: the service worker, its manifest and the HTML shell must be revalidated on every load,
# or phones keep running an old build for days. A map (not a separate location) keeps the
# server-level security headers below: any add_header inside a location would drop them.
map $uri $swiftdrop_cache_control {
  default               "";
  /sw.js                "no-cache";
  /manifest.webmanifest "no-cache";
  /index.html           "no-cache";
}

server {
  listen 8080;  # nginx-unprivileged cannot bind ports below 1024
  root /usr/share/nginx/html;
  index index.html;

  # Browser hardening for the app itself (the gateway adds the same to API responses).
  # - No framing: stops clickjacking of the sign-in and password pages.
  # - No referrer: auth URLs carry one-time values (?code= on the Google callback, ?identifier= on
  #   the reset pages) that must not leak to other sites.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cache-Control $swiftdrop_cache_control always;
  add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
  # CSP limits an XSS bug: scripts only from this origin, no inline scripts, no plugins.
  # 'unsafe-inline' is for style attributes only (React/recharts set inline styles).
  # Fonts come from Google Fonts. Keep in sync with frontend.nginxConfig in the Helm values.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' wss:; frame-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /ws/ {
    proxy_pass http://api-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }
  location /api/v1/tracking/ {
    proxy_pass http://api-gateway:8080;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location / { try_files $uri $uri/ /index.html; }
}

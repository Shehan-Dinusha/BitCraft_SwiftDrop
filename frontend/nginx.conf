server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Browser hardening for the app itself (the gateway adds the same to API responses).
  # - No framing: stops clickjacking of the sign-in and password pages.
  # - No referrer: auth URLs carry one-time values (?code= on the Google callback, ?identifier= on
  #   the reset pages) that must not leak to other sites.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

  location /api/ {
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /ws/ {
    proxy_pass http://api-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }
  location /api/v1/tracking/ {
    proxy_pass http://api-gateway:8080;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location / { try_files $uri $uri/ /index.html; }
}

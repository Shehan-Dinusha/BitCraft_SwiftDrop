openapi: 3.1.0
info:
  title: SwiftDrop Dispatch Assignment API
  description: >-
    Courier assignment, shifts, capacity, and dispatch management APIs.
    Errors use the ApiErrorResponse body. An unexpected server error returns HTTP 500 with
    error "Internal Server Error", message "An unexpected error occurred" and, when the request
    X-Correlation-Id header is a UUID, that correlationId; internal details are never returned.
  version: v1.0.0
servers:
  - url: /
    description: API Gateway (same origin as this Swagger UI)
security:
  - bearerAuth: []
paths:
  /api/v1/dispatch/health:
    get:
      tags:
        - Dispatch
      summary: Check service health
      operationId: dispatchHealth
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /api/v1/dispatch/assign:
    post:
      tags:
        - Dispatch
      summary: Assign a courier to an unassigned order
      description: >-
        Dispatcher confirms a courier for an order in the unassigned queue. An order that
        already has a courier is never replaced by this operation; use /api/v1/dispatch/reassign.
        Requires the DISPATCHER or SYSTEM_ADMIN role.
      operationId: manualAssign
      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          description: Request correlation ID, propagated to the published events when it is a UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualAssignRequest"
      responses:
        "200":
          description: Order assigned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispatchAssignmentResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller role is not DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "400":
          description: Validation failed
        "404":
          description: Assignment or order not found
        "409":
          description: >-
            Order already assigned (Assignment Conflict), courier not available, assignment in a
            terminal state, or the record was changed by a concurrent operation (Conflict). A conflict
            on the courier's record only, such as a status update, is retried automatically up to
            three times before a 409 is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/reassign:
    post:
      tags:
        - Dispatch
      summary: Reassign an order to a different courier
      description: >-
        Explicitly moves an assigned order to another courier. The request must name the courier
        currently assigned, so a reassignment based on a stale view is rejected instead of
        overwriting another dispatcher's decision. Not allowed once dispatch has recorded the parcel
        as picked up. Publishes dispatch.courier.assigned only; the public status is unchanged.
        Requires the DISPATCHER or SYSTEM_ADMIN role.
      operationId: reassign
      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          description: Request correlation ID, propagated to the published events when it is a UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignCourierRequest"
      responses:
        "200":
          description: Order reassigned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispatchAssignmentResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller role is not DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "400":
          description: Validation failed, or the new courier is the current courier
        "404":
          description: Assignment or order not found
        "409":
          description: >-
            Order has no courier yet or is no longer assigned to the expected courier
            (Assignment Conflict), order already picked up (Reassignment Not Allowed), courier not
            available, assignment in a terminal state, or the record was changed by a concurrent
            operation (Conflict). A conflict on the courier's record only, such as a status update,
            is retried automatically up to three times before a 409 is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/assignments:
    get:
      tags:
        - Dispatch
      summary: List dispatch assignments with pagination and optional status filter
      description: >-
        A DISPATCHER gets the orders picked up in their own district; a SYSTEM_ADMIN gets every
        district or the one given.
      operationId: getAssignments
      parameters:
        - name: district
          in: query
          required: false
          description: SYSTEM_ADMIN only; a DISPATCHER always gets their own district.
          schema:
            $ref: "#/components/schemas/SriLankanDistrict"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AssignmentStatus"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of dispatch assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePagedResultDispatchAssignmentResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller role is not DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/assignments/{assignmentId}:
    get:
      tags:
        - Dispatch
      summary: Get dispatch assignment by UUID
      description: >-
        A COURIER sees only an assignment they currently hold; DISPATCHER and SYSTEM_ADMIN see any, including UNASSIGNED orders.
      operationId: getAssignmentById
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dispatch assignment retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispatchAssignmentResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller is not a COURIER, DISPATCHER or SYSTEM_ADMIN, or is a courier who does not hold this assignment (including UNASSIGNED orders)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Assignment not found

  /api/v1/dispatch/assignments/order/{orderId}:
    get:
      tags:
        - Dispatch
      summary: Get dispatch assignment by order UUID
      description: >-
        A COURIER sees only an assignment they currently hold; DISPATCHER and SYSTEM_ADMIN see any, including UNASSIGNED orders.
      operationId: getAssignmentByOrderId
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dispatch assignment retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispatchAssignmentResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller is not a COURIER, DISPATCHER or SYSTEM_ADMIN, or is a courier who does not hold this assignment (including UNASSIGNED orders)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Assignment not found

  /api/v1/dispatch/unassigned:
    get:
      tags:
        - Dispatch
      summary: List unassigned orders pending dispatch
      description: >-
        A DISPATCHER gets their own district's queue; a SYSTEM_ADMIN gets every district or the one
        given.
      operationId: getUnassignedParcels
      parameters:
        - name: district
          in: query
          required: false
          description: SYSTEM_ADMIN only; a DISPATCHER always gets their own district.
          schema:
            $ref: "#/components/schemas/SriLankanDistrict"
      responses:
        "200":
          description: Unassigned orders retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListDispatchAssignmentResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller role is not DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/ready-to-send:
    get:
      tags:
        - Dispatch
      summary: List parcels handed in at the district's hub and waiting to be marked Outbound
      description: >-
        A DISPATCHER gets their own district; a SYSTEM_ADMIN must give the district (400 otherwise).
        Mark one Outbound with the delivery transition AT_ORIGIN_HUB -> IN_TRANSIT.
      operationId: getReadyToSend
      parameters:
        - name: district
          in: query
          required: false
          description: SYSTEM_ADMIN only; a DISPATCHER always gets their own district.
          schema:
            $ref: "#/components/schemas/SriLankanDistrict"
      responses:
        "200":
          description: Parcels ready to send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListDispatchAssignmentResponse"
        "400":
          description: A SYSTEM_ADMIN did not give a district
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/returns:
    get:
      tags:
        - Dispatch
      summary: List failed deliveries a district deals with
      description: >-
        RETURN_TO_HUB: a courier brings it back. HELD_AT_HUB: try again (delivery transition
        HELD_AT_HUB -> AT_DESTINATION_HUB, while canRetry) or return it (-> RETURN_IN_TRANSIT, or
        -> RETURN_AT_HUB when the sender is in the same district). RETURN_OUTBOUND: accept it at the
        sender's hub (-> RETURN_AT_HUB). A DISPATCHER gets their own district; a SYSTEM_ADMIN must give
        the district (400 otherwise).
      operationId: getReturns
      parameters:
        - name: district
          in: query
          required: false
          description: SYSTEM_ADMIN only; a DISPATCHER always gets their own district.
          schema:
            $ref: "#/components/schemas/SriLankanDistrict"
      responses:
        "200":
          description: Returns retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListDispatchAssignmentResponse"
        "400":
          description: A SYSTEM_ADMIN did not give a district
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller role is not DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/incoming:
    get:
      tags:
        - Dispatch
      summary: List open orders coming into a district from another one
      description: >-
        Read-only: the pickup district's dispatcher manages them. A DISPATCHER gets their own
        district; a SYSTEM_ADMIN must give the district (400 otherwise).
      operationId: getIncoming
      parameters:
        - name: district
          in: query
          required: false
          description: SYSTEM_ADMIN only; a DISPATCHER always gets their own district.
          schema:
            $ref: "#/components/schemas/SriLankanDistrict"
      responses:
        "200":
          description: Incoming orders retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListDispatchAssignmentResponse"
        "400":
          description: A SYSTEM_ADMIN did not give a district
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller role is not DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/orders/{orderId}/suggestions:
    get:
      tags:
        - Dispatch
      summary: Suggest available couriers for an order
      description: >-
        Returns the couriers on shift in the district handling the order (a DISPATCHER only for orders of
        their district). Those who can take it come first (eligible true): the smallest vehicle the parcel
        fits, then the emptiest by parcels, weight or volume, then the most recent heartbeat, then courier ID.
        The rest carry an ineligibleReason. For an ASSIGNED or REASSIGNED order the courier currently holding
        it is left out. An order without a recorded size is limited by the parcel count only. Requires the
        DISPATCHER or SYSTEM_ADMIN role.
      operationId: getCourierSuggestions
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Courier suggestions retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListCourierSuggestionResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller role is not DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Assignment or order not found
        "409":
          description: >-
            Invalid Assignment Transition: the order is COMPLETED or CANCELLED, so it cannot be
            assigned or reassigned and no suggestions are returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/couriers/{courierId}/assignments:
    get:
      tags:
        - Dispatch
      summary: List active assignments for a courier
      description: >-
        A COURIER may use only their own courier ID (their user ID); DISPATCHER and SYSTEM_ADMIN may use any.
      operationId: getCourierAssignments
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AssignmentStatus"
      responses:
        "200":
          description: Active assignments for courier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListDispatchAssignmentResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller is not a COURIER, DISPATCHER or SYSTEM_ADMIN, or is a courier acting on another courier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/couriers/health:
    get:
      tags:
        - CourierAvailability
      summary: Check courier availability service health
      operationId: courierHealth
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /api/v1/dispatch/couriers:
    get:
      tags:
        - CourierAvailability
      summary: List couriers with optional district and shift status filters
      description: Requires the DISPATCHER or SYSTEM_ADMIN role.
      operationId: getCouriers
      parameters:
        - name: district
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SriLankanDistrict"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ShiftStatus"
      responses:
        "200":
          description: List of couriers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListCourierShiftResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller role is not DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/couriers/workload:
    get:
      tags:
        - CourierAvailability
      summary: List current courier workloads
      description: Requires the DISPATCHER or SYSTEM_ADMIN role.
      operationId: getWorkloads
      responses:
        "200":
          description: Courier workloads retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListCourierWorkloadResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller role is not DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/couriers/{courierId}:
    get:
      tags:
        - CourierAvailability
      summary: Get courier shift status and live metrics
      description: >-
        A COURIER may use only their own courier ID (their user ID); DISPATCHER and SYSTEM_ADMIN may use any.
      operationId: getCourier
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Courier shift status retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierShiftResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller is not a COURIER, DISPATCHER or SYSTEM_ADMIN, or is a courier acting on another courier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Courier not found

  /api/v1/dispatch/couriers/me/profile:
    get:
      tags:
        - Courier vehicles
      summary: Get my vehicle (COURIER)
      description: 404 until the courier has registered their vehicle; a shift cannot start before that.
      operationId: getMyCourierProfile
      responses:
        "200":
          description: Courier profile retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierProfileResponse"
        "403":
          description: Caller is not a COURIER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: No vehicle registered yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    put:
      tags:
        - Courier vehicles
      summary: Register my vehicle (COURIER)
      description: >-
        Once only, after accepting the invite. 409 when already registered: from then on only the
        dispatcher can change it. maxCapacity is ignored; the vehicle type's default applies.
      operationId: registerMyCourierProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierVehicleRequest"
      responses:
        "200":
          description: Vehicle registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierProfileResponse"
        "400":
          description: Validation failure, e.g. a number plate in the wrong format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller is not a COURIER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Vehicle already registered, or the number plate belongs to another courier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/couriers/profiles:
    get:
      tags:
        - Courier vehicles
      summary: List courier vehicles
      description: >-
        A DISPATCHER sees their own district (the district parameter is ignored); a SYSTEM_ADMIN sees
        every district or the one given.
      operationId: listCourierProfiles
      parameters:
        - name: district
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SriLankanDistrict"
      responses:
        "200":
          description: Courier profiles retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListCourierProfileResponse"
        "403":
          description: Caller is not a DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/couriers/{courierId}/profile:
    put:
      tags:
        - Courier vehicles
      summary: Update a courier's vehicle (DISPATCHER, SYSTEM_ADMIN)
      description: >-
        A DISPATCHER may change couriers of their own district only. Without maxCapacity, a changed
        vehicle type resets the capacity to the new type's default. The courier's shift picks up the
        new vehicle type and capacity straight away.
      operationId: updateCourierProfile
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierVehicleRequest"
      responses:
        "200":
          description: Courier vehicle updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierProfileResponse"
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Not permitted, or the courier belongs to another district
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: The courier has not registered a vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: The number plate belongs to another courier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/orders/{orderId}/courier:
    get:
      tags:
        - Courier vehicles
      summary: The courier handling an order
      description: >-
        For the order's customer (or merchant), so they can recognise the courier at the door: first
        name and vehicle only. data is null while no courier is actively assigned.
      operationId: getOrderCourier
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Courier retrieved, or data null when none is assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOrderCourierResponse"
        "403":
          description: The caller does not own this order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: No dispatch record for this order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/couriers/shifts/start:
    post:
      tags:
        - CourierAvailability
      summary: Start or register courier shift
      description: >-
        A COURIER may use only their own courier ID (their user ID), a DISPATCHER the couriers of their
        district, a SYSTEM_ADMIN any. The shift starts in the courier's home district. The vehicle type and
        parcel capacity come from the courier's registered vehicle; without one the answer is 409 Courier
        Not Available. A shift starts only on a working day (Monday to Saturday, not a listed holiday) from
        7:30 until 17:00 Sri Lanka time; otherwise 409 Shift Conflict says when the next working day is. A
        shift started after 9:00 is marked startedLate. Starting a shift that is already running returns it
        unchanged.
      operationId: startShift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartShiftRequest"
      responses:
        "200":
          description: Courier shift started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierShiftResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller is not a COURIER, DISPATCHER or SYSTEM_ADMIN, or is a courier acting on another courier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: >-
            Courier Not Available: the courier has not registered a vehicle yet. Or Data Conflict: the
            shift record was created by a concurrent request for the same courier (unique-key
            violation). Database details are not returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                dataConflict:
                  summary: Concurrent first-time shift start
                  value:
                    status: 409
                    error: Data Conflict
                    message: The request conflicts with an existing record. Refresh and retry.
                    path: /api/v1/dispatch/couriers/shifts/start
                    timestamp: "2026-11-15T08:30:00Z"

  /api/v1/dispatch/couriers/shifts/{courierId}/end:
    post:
      tags:
        - CourierAvailability
      summary: End courier shift
      description: >-
        A COURIER must have handed over all their cash first (409 Shift Conflict otherwise). A COURIER may use only their own courier ID (their user ID); DISPATCHER and SYSTEM_ADMIN may use any.
      operationId: endShift
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Courier shift ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierShiftResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller is not a COURIER, DISPATCHER or SYSTEM_ADMIN, or is a courier acting on another courier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: >-
            Shift Conflict: the courier still has active parcels, so the shift is left unchanged.
            Also returned as Courier Not Available for an unknown courier, or Conflict when the
            courier's record was changed by a concurrent operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                activeParcels:
                  summary: Courier still has active parcels
                  value:
                    status: 409
                    error: Shift Conflict
                    message: "Cannot end shift: the courier still has 2 active parcel(s). Complete or reassign them first."
                    path: /api/v1/dispatch/couriers/shifts/11111111-2222-4333-8444-555555555555/end
                    timestamp: "2026-11-15T08:30:00Z"

  /api/v1/dispatch/couriers/shifts/status:
    put:
      tags:
        - CourierAvailability
      summary: Start or end the lunch break
      description: >-
        ON_BREAK starts the one lunch break of the shift (started between 12:00 and 14:30 Sri Lanka time, up to
        45 minutes); AVAILABLE ends it, and the courier becomes BUSY again if every parcel place is taken.
        OFFLINE and BUSY are refused with 409 Shift Conflict: a shift ends through End shift, which checks
        parcels and cash, and BUSY follows the parcels held. A courier on break keeps their parcels and can
        be given more. A COURIER may use only their own courier ID (their user ID); DISPATCHER and
        SYSTEM_ADMIN may use any.
      operationId: updateShiftStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShiftStatusRequest"
      responses:
        "200":
          description: Shift status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierShiftResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller is not a COURIER, DISPATCHER or SYSTEM_ADMIN, or is a courier acting on another courier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: >-
            Shift Conflict: OFFLINE or BUSY asked for, the shift has not started, the break is outside 12:00 to
            14:30, or the shift's break was already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/calendar/today:
    get:
      tags:
        - WorkingDay
      summary: Today's working day
      description: >-
        Whether today is open, the hours, the lunch break and the coming holidays, in Sri Lanka time.
        Couriers work Monday to Saturday, 8:00 to 17:00; Sundays and listed holidays are closed. For COURIER,
        DISPATCHER and SYSTEM_ADMIN.
      operationId: getWorkingDay
      responses:
        "200":
          description: Today's working day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWorkdayResponse"
        "403":
          description: Caller is not a COURIER, DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/calendar/closed-days:
    post:
      tags:
        - WorkingDay
      summary: Close a holiday
      description: >-
        Nobody works that day: shifts cannot start. Today or later, and not a Sunday (always closed).
        SYSTEM_ADMIN only. Returns the holidays from today on.
      operationId: addClosedDay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClosedDayRequest"
      responses:
        "200":
          description: Holiday closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListClosedDayResponse"
        "400":
          description: A past day, a Sunday, a day already closed, or a missing name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller is not a SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/calendar/closed-days/{day}:
    delete:
      tags:
        - WorkingDay
      summary: Reopen a holiday
      description: Today or later only. SYSTEM_ADMIN only. Returns the holidays from today on.
      operationId: removeClosedDay
      parameters:
        - name: day
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Holiday reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListClosedDayResponse"
        "400":
          description: A past day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller is not a SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/shops/{merchantId}/couriers:
    get:
      tags:
        - ShopPickup
      summary: Couriers on shift and which of the shop's ready parcels each has room for
      description: >-
        A DISPATCHER gets their own district (the parameter is ignored); a SYSTEM_ADMIN must give it.
      operationId: getShopCouriers
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: district
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SriLankanDistrict"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListShopCourierSuggestionResponse"
        "401":
          description: Missing or invalid gateway identity headers
        "403":
          description: The caller's role does not allow this

  /api/v1/dispatch/shops/{merchantId}/assign:
    post:
      tags:
        - ShopPickup
      summary: Give a shop's ready parcels to one courier, all of them or none
      operationId: assignShopPickup
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignShopPickupRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListDispatchAssignmentResponse"
        "401":
          description: Missing or invalid gateway identity headers
        "403":
          description: The caller's role does not allow this
        "409":
          description: A parcel is not packed, no longer waiting, or does not fit the courier's vehicle

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AssignmentStatus:
      type: string
      description: IN_TRANSFER is between the two legs of a cross-district order; no courier holds it.
      enum: [UNASSIGNED, ASSIGNED, REASSIGNED, IN_TRANSFER, FAILED, CANCELLED, COMPLETED]

    AssignmentLeg:
      type: string
      description: >-
        FIRST_MILE is managed by the pickup district; a cross-district order moves to LAST_MILE, managed
        by the drop-off district, when its hub accepts it, and so does an order tried again after a failed
        attempt. RETURN, back to the sender, is managed by the pickup district.
      enum: [FIRST_MILE, LAST_MILE, RETURN]

    HubStage:
      type: string
      description: Where an order is between the legs, or after a failed delivery.
      enum: [AT_HUB, OUTBOUND, INCOMING, RETURN_TO_HUB, HELD_AT_HUB, RETURN_OUTBOUND, RETURN_AT_HUB]

    DeliveryFailureReason:
      type: string
      enum:
        - CUSTOMER_UNAVAILABLE
        - RECIPIENT_UNAVAILABLE
        - WRONG_ADDRESS
        - INCORRECT_ADDRESS
        - REFUSED_BY_CUSTOMER
        - RECIPIENT_REJECTED
        - ACCESS_RESTRICTED
        - PAYMENT_FAILED
        - DAMAGED
        - DAMAGED_IN_TRANSIT
        - LOST
        - WEATHER_DELAY
        - ADVERSE_WEATHER
        - OTHER

    ShiftStatus:
      type: string
      enum: [AVAILABLE, BUSY, ON_BREAK, OFFLINE]

    VehicleType:
      type: string
      description: >-
        Courier's own vehicle. Default parcel capacity: MOTORCYCLE 5, THREE_WHEELER 10, VAN 25, LORRY 50.
        Total weight, total volume and longest side: MOTORCYCLE 25 kg / 100 l / 50 cm, THREE_WHEELER 150 kg /
        600 l / 100 cm, VAN 600 kg / 4000 l / 200 cm, LORRY 2000 kg / 15000 l / 500 cm.
      enum: [MOTORCYCLE, THREE_WHEELER, VAN, LORRY]

    CourierBlock:
      type: string
      description: >-
        Why a courier cannot take a parcel. TOO_LONG, TOO_HEAVY and TOO_BIG: it does not fit the vehicle at all.
        PARCEL_LIMIT, WEIGHT_LIMIT and VOLUME_LIMIT: no room left beside what the courier holds. A courier on
        their lunch break is not blocked.
      enum:
        [OFF_SHIFT, TOO_LONG, TOO_HEAVY, TOO_BIG, PARCEL_LIMIT, WEIGHT_LIMIT, VOLUME_LIMIT]

    OrderSpeed:
      type: string
      enum: [STANDARD, EXPRESS, SAME_DAY]

    SriLankanDistrict:
      type: string
      enum:
        - COLOMBO
        - GAMPAHA
        - KALUTARA
        - KANDY
        - MATALE
        - NUWARA_ELIYA
        - GALLE
        - MATARA
        - HAMBANTOTA
        - JAFFNA
        - KILINOCHCHI
        - MANNAR
        - VAVUNIYA
        - MULLAITIVU
        - BATTICALOA
        - AMPARA
        - TRINCOMALEE
        - KURUNEGALA
        - PUTTALAM
        - ANURADHAPURA
        - POLONNARUWA
        - BADULLA
        - MONARAGALA
        - RATNAPURA
        - KEGALLE

    ManualAssignRequest:
      type: object
      required:
        - orderId
        - courierId
      properties:
        orderId:
          type: string
          format: uuid
        courierId:
          type: string
          format: uuid
        assignedBy:
          type: string
          example: DISPATCHER_ADMIN
        reason:
          type: string

    ReassignCourierRequest:
      type: object
      required:
        - orderId
        - expectedCurrentCourierId
        - newCourierId
      properties:
        orderId:
          type: string
          format: uuid
        expectedCurrentCourierId:
          type: string
          format: uuid
          description: Courier the dispatcher believes is currently assigned
        newCourierId:
          type: string
          format: uuid
        assignedBy:
          type: string
          example: DISPATCHER_ADMIN
        reason:
          type: string

    StartShiftRequest:
      type: object
      required:
        - courierId
        - courierName
      properties:
        courierId:
          type: string
          format: uuid
        courierName:
          type: string
          example: Sunil Perera
        phone:
          type: string
          pattern: '^$|^(?:\+94|0)?[1-9][0-9]{8}$'
          example: "+94771234567"

    CourierVehicleRequest:
      type: object
      description: A courier's own vehicle.
      required:
        - vehicleType
        - plateNumber
        - vehicleModel
        - vehicleColour
        - licenceNumber
      properties:
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
        plateNumber:
          type: string
          maxLength: 20
          description: Number plate as shown on the vehicle; stored in upper case.
          example: WP BAB-1234
        vehicleModel:
          type: string
          maxLength: 64
          example: Honda Dio
        vehicleColour:
          type: string
          maxLength: 32
          example: Black
        licenceNumber:
          type: string
          maxLength: 20
          example: B1234567
        maxCapacity:
          type: integer
          minimum: 1
          maximum: 200
          description: Only a dispatcher can set it; when left out the vehicle type's default applies.

    CourierProfileResponse:
      type: object
      properties:
        courierId:
          type: string
          format: uuid
        district:
          $ref: "#/components/schemas/SriLankanDistrict"
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
        plateNumber:
          type: string
          example: WP BAB-1234
        vehicleModel:
          type: string
        vehicleColour:
          type: string
        licenceNumber:
          type: string
        maxCapacity:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderCourierResponse:
      type: object
      description: First name and vehicle only; no phone number, licence or courier id.
      properties:
        firstName:
          type: string
          example: Kasun
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
        plateNumber:
          type: string
          example: WP BAB-1234
        vehicleModel:
          type: string
        vehicleColour:
          type: string

    UpdateShiftStatusRequest:
      type: object
      required:
        - courierId
        - status
      properties:
        courierId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ShiftStatus"

    ShopCourierSuggestionResponse:
      type: object
      required:
        - courierId
        - courierName
        - vehicleType
        - activeParcels
        - maxCapacity
        - fittingOrderIds
      properties:
        courierId:
          type: string
          format: uuid
        courierName:
          type: string
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
        activeParcels:
          type: integer
        maxCapacity:
          type: integer
        fittingOrderIds:
          type: array
          items:
            type: string
            format: uuid
        breakEndsAt:
          description: While the courier is on their lunch break, when it should end.
          type: [string, "null"]
          format: date-time

    AssignShopPickupRequest:
      type: object
      required:
        - courierId
        - orderIds
      properties:
        courierId:
          type: string
          format: uuid
        orderIds:
          type: array
          items:
            type: string
            format: uuid

    ApiResponseListShopCourierSuggestionResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/ShopCourierSuggestionResponse"
        timestamp:
          type: string
          format: date-time

    DispatchAssignmentResponse:
      type: object
      properties:
        assignmentId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        trackingNumber:
          type: string
          example: SD-COL-98214
        courierId:
          type: string
          format: uuid
        courierName:
          type: string
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        orderSpeed:
          $ref: "#/components/schemas/OrderSpeed"
        status:
          $ref: "#/components/schemas/AssignmentStatus"
        assignedBy:
          type: string
        assignedAt:
          type: string
          format: date-time
        estimatedPickupMinutes:
          type: integer
        failureReason:
          type: string
        retryCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        leg:
          $ref: "#/components/schemas/AssignmentLeg"
        hubStage:
          $ref: "#/components/schemas/HubStage"
        responsibleDistrict:
          description: The district whose dispatcher manages the order now.
          allOf:
            - $ref: "#/components/schemas/SriLankanDistrict"
        pickedUpAt:
          description: When the courier of the current leg collected the parcel; reassignment is blocked once set.
          type: string
          format: date-time
        lengthCm:
          description: Parcel length in cm; absent for orders booked before sizes were recorded.
          type: number
          example: 30
        widthCm:
          type: number
          example: 20
        heightCm:
          type: number
          example: 10
        weightKg:
          type: number
          example: 2.5
        merchantId:
          type: [string, "null"]
          format: uuid
          description: The shop, for an order it sent.
        merchantName:
          type: [string, "null"]
        shopPickup:
          type: boolean
          description: Collected together with the shop's other parcels (a standard order still at the shop).
        readyForPickup:
          type: boolean
          description: Whether a courier can be sent. A shop's parcel only once the shop said it is packed.
        readyAt:
          type: [string, "null"]
          format: date-time
        deliveryAttempts:
          type: integer
          description: Delivery attempts that failed.
        lastAttemptReason:
          description: Why the last attempt failed.
          oneOf:
            - $ref: "#/components/schemas/DeliveryFailureReason"
            - type: "null"
        canRetry:
          type: boolean
          description: Whether it may still go out for another attempt.

    CourierShiftResponse:
      type: object
      properties:
        courierId:
          type: string
          format: uuid
        courierName:
          type: string
        phone:
          type: string
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
        currentDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        shiftStatus:
          $ref: "#/components/schemas/ShiftStatus"
        activeParcelsCount:
          type: integer
        maxCapacity:
          type: integer
        shiftStartedAt:
          type: string
          format: date-time
        shiftEndedAt:
          type: string
          format: date-time
        lastHeartbeatAt:
          type: string
          format: date-time
        activeWeightKg:
          description: Weight of the parcels held.
          type: number
        maxWeightKg:
          type: integer
        activeVolumeLitres:
          description: Volume of the parcels held.
          type: number
        maxVolumeLitres:
          type: integer
        breakStartedAt:
          description: When the lunch break of this shift started.
          type: [string, "null"]
          format: date-time
        breakEndsAt:
          description: When that break should end, 45 minutes after it started.
          type: [string, "null"]
          format: date-time
        breakEndedAt:
          description: When that break ended.
          type: [string, "null"]
          format: date-time
        startedLate:
          description: Whether the shift started after 9:00.
          type: boolean
        closedAutomatically:
          description: Whether the courier left the shift open and it was closed at night.
          type: boolean

    CourierWorkloadResponse:
      type: object
      properties:
        courierId:
          type: string
          format: uuid
        courierName:
          type: string
        activeParcels:
          type: integer
        maxCapacity:
          type: integer
        currentDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        shiftStatus:
          $ref: "#/components/schemas/ShiftStatus"

    CourierSuggestionResponse:
      type: object
      properties:
        courierId:
          type: string
          format: uuid
        courierName:
          type: string
        currentDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        samePickupDistrict:
          type: boolean
        activeParcels:
          type: integer
        maxCapacity:
          type: integer
        shiftStatus:
          $ref: "#/components/schemas/ShiftStatus"
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
        activeWeightKg:
          description: Weight of the parcels held.
          type: number
        maxWeightKg:
          type: integer
        activeVolumeLitres:
          description: Volume of the parcels held.
          type: number
        maxVolumeLitres:
          type: integer
        maxSideCm:
          description: Longest side of a parcel the vehicle takes.
          type: integer
        eligible:
          description: Whether the order can be assigned to this courier now.
          type: boolean
        ineligibleReason:
          $ref: "#/components/schemas/CourierBlock"
        breakEndsAt:
          description: >-
            While the courier is on their lunch break, when it should end. They can still be given the order
            and see it when they are back.
          type: [string, "null"]
          format: date-time

    WorkdayResponse:
      type: object
      description: Today's working day, in Sri Lanka time.
      required:
        - date
        - open
        - nextWorkingDay
        - shiftCanStart
        - opensAt
        - closesAt
        - shiftFrom
        - breakFrom
        - breakUntil
        - breakMinutes
        - closedDays
      properties:
        date:
          type: string
          format: date
        open:
          description: Whether today is a working day.
          type: boolean
        closedReason:
          description: Why today is closed, "Sunday" or the holiday's name.
          type: [string, "null"]
        nextWorkingDay:
          type: string
          format: date
        shiftCanStart:
          description: Whether a courier can start a shift right now.
          type: boolean
        opensAt:
          type: string
          example: "08:00"
        closesAt:
          type: string
          example: "17:00"
        shiftFrom:
          type: string
          example: "07:30"
        breakFrom:
          type: string
          example: "12:00"
        breakUntil:
          type: string
          example: "14:30"
        breakMinutes:
          type: integer
          example: 45
        closedDays:
          description: Listed holidays from today on.
          type: array
          items:
            $ref: "#/components/schemas/ClosedDayResponse"

    ClosedDayResponse:
      type: object
      required:
        - day
        - name
      properties:
        day:
          type: string
          format: date
        name:
          type: string
          example: Unduvap Poya Day

    ClosedDayRequest:
      type: object
      required:
        - day
        - name
      properties:
        day:
          description: Today or later, and not a Sunday.
          type: string
          format: date
        name:
          type: string
          maxLength: 64
          example: Unduvap Poya Day

    ApiResponseWorkdayResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/WorkdayResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseListClosedDayResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/ClosedDayResponse"
        timestamp:
          type: string
          format: date-time

    ApiErrorResponse:
      type: object
      description: >-
        Error body returned by the global exception handler (com.swiftdrop.contracts.dto.ApiErrorResponse).
        Null fields are omitted.
      required:
        - status
        - error
        - message
        - path
        - timestamp
      properties:
        status:
          type: integer
          example: 409
        error:
          type: string
          description: Error label, for example Conflict, Assignment Conflict, Shift Conflict or Data Conflict
          example: Shift Conflict
        message:
          type: string
          example: "Cannot end shift: the courier still has 2 active parcel(s). Complete or reassign them first."
        path:
          type: string
          example: /api/v1/dispatch/couriers/shifts/11111111-2222-4333-8444-555555555555/end
        correlationId:
          type: string
          description: Request correlation ID, included on 500 responses when the X-Correlation-Id header is a UUID
          example: 0f5e8c4a-2c6d-4a58-9c8f-4c2c4e7b8a11
        fieldErrors:
          type: object
          description: Field name mapped to its validation messages, when present
          additionalProperties:
            type: array

openapi: 3.1.0
info:
  title: SwiftDrop Dispatch Assignment API
  description: Courier assignment, shifts, capacity, and dispatch management APIs.
  version: v1.0.0
servers:
  - url: http://localhost:8080
    description: API Gateway
paths:
  /api/v1/dispatch/health:
    get:
      tags:
        - Dispatch
      summary: Check service health
      operationId: dispatchHealth
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /api/v1/dispatch/assign:
    post:
      tags:
        - Dispatch
      summary: Manual courier assignment override
      description: Allows dispatcher or supervisor to manually assign or reassign a courier to an order.
      operationId: manualAssign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualAssignRequest"
      responses:
        "200":
          description: Order assigned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispatchAssignmentResponse"
        "404":
          description: Assignment or order not found
        "409":
          description: Courier not available

  /api/v1/dispatch/assignments:
    get:
      tags:
        - Dispatch
      summary: List dispatch assignments with pagination and optional status filter
      operationId: getAssignments
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AssignmentStatus"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of dispatch assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePagedResultDispatchAssignmentResponse"

  /api/v1/dispatch/assignments/{assignmentId}:
    get:
      tags:
        - Dispatch
      summary: Get dispatch assignment by UUID
      operationId: getAssignmentById
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dispatch assignment retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispatchAssignmentResponse"
        "404":
          description: Assignment not found

  /api/v1/dispatch/assignments/order/{orderId}:
    get:
      tags:
        - Dispatch
      summary: Get dispatch assignment by order UUID
      operationId: getAssignmentByOrderId
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dispatch assignment retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispatchAssignmentResponse"
        "404":
          description: Assignment not found

  /api/v1/dispatch/unassigned:
    get:
      tags:
        - Dispatch
      summary: List unassigned orders pending dispatch
      operationId: getUnassignedParcels
      responses:
        "200":
          description: Unassigned orders retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListDispatchAssignmentResponse"

  /api/v1/dispatch/couriers/{courierId}/assignments:
    get:
      tags:
        - Dispatch
      summary: List active assignments for a courier
      operationId: getCourierAssignments
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AssignmentStatus"
      responses:
        "200":
          description: Active assignments for courier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListDispatchAssignmentResponse"

  /api/v1/dispatch/couriers/health:
    get:
      tags:
        - CourierAvailability
      summary: Check courier availability service health
      operationId: courierHealth
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /api/v1/dispatch/couriers:
    get:
      tags:
        - CourierAvailability
      summary: List couriers with optional district and shift status filters
      operationId: getCouriers
      parameters:
        - name: district
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SriLankanDistrict"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ShiftStatus"
      responses:
        "200":
          description: List of couriers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListCourierShiftResponse"

  /api/v1/dispatch/couriers/{courierId}:
    get:
      tags:
        - CourierAvailability
      summary: Get courier shift status and live metrics
      operationId: getCourier
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Courier shift status retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierShiftResponse"
        "404":
          description: Courier not found

  /api/v1/dispatch/couriers/shifts/start:
    post:
      tags:
        - CourierAvailability
      summary: Start or register courier shift
      operationId: startShift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartShiftRequest"
      responses:
        "200":
          description: Courier shift started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierShiftResponse"

  /api/v1/dispatch/couriers/shifts/{courierId}/end:
    post:
      tags:
        - CourierAvailability
      summary: End courier shift
      operationId: endShift
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Courier shift ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierShiftResponse"

  /api/v1/dispatch/couriers/shifts/status:
    put:
      tags:
        - CourierAvailability
      summary: Update courier shift status
      operationId: updateShiftStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShiftStatusRequest"
      responses:
        "200":
          description: Shift status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierShiftResponse"

  /api/v1/dispatch/couriers/shifts/location:
    put:
      tags:
        - CourierAvailability
      summary: Record courier GPS location heartbeat ping
      operationId: updateLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierLocationPingRequest"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierShiftResponse"

components:
  schemas:
    AssignmentStatus:
      type: string
      enum: [UNASSIGNED, ASSIGNED, REASSIGNED, FAILED, CANCELLED, COMPLETED]

    ShiftStatus:
      type: string
      enum: [AVAILABLE, BUSY, ON_BREAK, OFFLINE]

    VehicleType:
      type: string
      enum: [MOTORCYCLE, VAN, THREE_WHEELER, BICYCLE]

    OrderSpeed:
      type: string
      enum: [STANDARD, EXPRESS, SAME_DAY]

    SriLankanDistrict:
      type: string
      enum:
        - COLOMBO
        - GAMPAHA
        - KALUTARA
        - KANDY
        - MATALE
        - NUWARA_ELIYA
        - GALLE
        - MATARA
        - HAMBANTOTA
        - JAFFNA
        - KILINOCHCHI
        - MANNAR
        - VAVUNIYA
        - MULLAITIVU
        - BATTICALOA
        - AMPARA
        - TRINCOMALEE
        - KURUNEGALA
        - PUTTALAM
        - ANURADHAPURA
        - POLONNARUWA
        - BADULLA
        - MONARAGALA
        - RATNAPURA
        - KEGALLE

    ManualAssignRequest:
      type: object
      required:
        - orderId
        - courierId
      properties:
        orderId:
          type: string
          format: uuid
        courierId:
          type: string
          format: uuid
        assignedBy:
          type: string
          example: DISPATCHER_ADMIN
        reason:
          type: string

    StartShiftRequest:
      type: object
      required:
        - courierId
        - courierName
        - initialDistrict
      properties:
        courierId:
          type: string
          format: uuid
        courierName:
          type: string
          example: Sunil Perera
        phone:
          type: string
          example: "+94771234567"
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
        initialDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        maxCapacity:
          type: integer
          example: 5

    UpdateShiftStatusRequest:
      type: object
      required:
        - courierId
        - status
      properties:
        courierId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ShiftStatus"

    CourierLocationPingRequest:
      type: object
      required:
        - courierId
        - district
      properties:
        courierId:
          type: string
          format: uuid
        district:
          $ref: "#/components/schemas/SriLankanDistrict"
        latitude:
          type: number
          example: 6.9271
        longitude:
          type: number
          example: 79.8612

    DispatchAssignmentResponse:
      type: object
      properties:
        assignmentId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        trackingNumber:
          type: string
          example: SD-COL-98214
        courierId:
          type: string
          format: uuid
        courierName:
          type: string
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        orderSpeed:
          $ref: "#/components/schemas/OrderSpeed"
        status:
          $ref: "#/components/schemas/AssignmentStatus"
        assignedBy:
          type: string
        assignedAt:
          type: string
          format: date-time
        estimatedPickupMinutes:
          type: integer
        failureReason:
          type: string
        retryCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CourierShiftResponse:
      type: object
      properties:
        courierId:
          type: string
          format: uuid
        courierName:
          type: string
        phone:
          type: string
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
        currentDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        latitude:
          type: number
        longitude:
          type: number
        shiftStatus:
          $ref: "#/components/schemas/ShiftStatus"
        activeParcelsCount:
          type: integer
        maxCapacity:
          type: integer
        shiftStartedAt:
          type: string
          format: date-time
        shiftEndedAt:
          type: string
          format: date-time
        lastHeartbeatAt:
          type: string
          format: date-time

    ApiResponseString:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: string
        timestamp:
          type: string
          format: date-time

    ApiResponseDispatchAssignmentResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/DispatchAssignmentResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseListDispatchAssignmentResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/DispatchAssignmentResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseCourierShiftResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/CourierShiftResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseListCourierShiftResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/CourierShiftResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponsePagedResultDispatchAssignmentResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/DispatchAssignmentResponse"
            page:
              type: integer
            size:
              type: integer
            totalElements:
              type: integer
            totalPages:
              type: integer
            hasNext:
              type: boolean
            hasPrevious:
              type: boolean
        timestamp:
          type: string
          format: date-time

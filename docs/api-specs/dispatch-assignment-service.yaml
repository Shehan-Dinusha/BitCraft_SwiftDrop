openapi: 3.1.0
info:
  title: SwiftDrop Dispatch Assignment API
  description: >-
    Courier assignment, shifts, capacity, and dispatch management APIs.
    Errors use the ApiErrorResponse body. An unexpected server error returns HTTP 500 with
    error "Internal Server Error", message "An unexpected error occurred" and, when the request
    X-Correlation-Id header is a UUID, that correlationId; internal details are never returned.
  version: v1.0.0
servers:
  - url: http://localhost:8080
    description: API Gateway
paths:
  /api/v1/dispatch/health:
    get:
      tags:
        - Dispatch
      summary: Check service health
      operationId: dispatchHealth
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /api/v1/dispatch/assign:
    post:
      tags:
        - Dispatch
      summary: Assign a courier to an unassigned order
      description: >-
        Dispatcher confirms a courier for an order in the unassigned queue. An order that
        already has a courier is never replaced by this operation; use /api/v1/dispatch/reassign.
        Requires the DISPATCHER or SYSTEM_ADMIN role.
      operationId: manualAssign
      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          description: Request correlation ID, propagated to the published events when it is a UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualAssignRequest"
      responses:
        "200":
          description: Order assigned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispatchAssignmentResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller role is not DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "400":
          description: Validation failed
        "404":
          description: Assignment or order not found
        "409":
          description: >-
            Order already assigned (Assignment Conflict), courier not available, assignment in a
            terminal state, or the record was changed by a concurrent operation (Conflict). A conflict
            on the courier's record only, such as a location update, is retried automatically up to
            three times before a 409 is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/reassign:
    post:
      tags:
        - Dispatch
      summary: Reassign an order to a different courier
      description: >-
        Explicitly moves an assigned order to another courier. The request must name the courier
        currently assigned, so a reassignment based on a stale view is rejected instead of
        overwriting another dispatcher's decision. Not allowed once dispatch has recorded the parcel
        as picked up. Publishes dispatch.courier.assigned only; the public status is unchanged.
        Requires the DISPATCHER or SYSTEM_ADMIN role.
      operationId: reassign
      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          description: Request correlation ID, propagated to the published events when it is a UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignCourierRequest"
      responses:
        "200":
          description: Order reassigned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispatchAssignmentResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller role is not DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "400":
          description: Validation failed, or the new courier is the current courier
        "404":
          description: Assignment or order not found
        "409":
          description: >-
            Order has no courier yet or is no longer assigned to the expected courier
            (Assignment Conflict), order already picked up (Reassignment Not Allowed), courier not
            available, assignment in a terminal state, or the record was changed by a concurrent
            operation (Conflict). A conflict on the courier's record only, such as a location update,
            is retried automatically up to three times before a 409 is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/assignments:
    get:
      tags:
        - Dispatch
      summary: List dispatch assignments with pagination and optional status filter
      description: Requires the DISPATCHER or SYSTEM_ADMIN role.
      operationId: getAssignments
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AssignmentStatus"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of dispatch assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePagedResultDispatchAssignmentResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller role is not DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/assignments/{assignmentId}:
    get:
      tags:
        - Dispatch
      summary: Get dispatch assignment by UUID
      operationId: getAssignmentById
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dispatch assignment retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispatchAssignmentResponse"
        "404":
          description: Assignment not found

  /api/v1/dispatch/assignments/order/{orderId}:
    get:
      tags:
        - Dispatch
      summary: Get dispatch assignment by order UUID
      operationId: getAssignmentByOrderId
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dispatch assignment retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispatchAssignmentResponse"
        "404":
          description: Assignment not found

  /api/v1/dispatch/unassigned:
    get:
      tags:
        - Dispatch
      summary: List unassigned orders pending dispatch
      description: Requires the DISPATCHER or SYSTEM_ADMIN role.
      operationId: getUnassignedParcels
      responses:
        "200":
          description: Unassigned orders retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListDispatchAssignmentResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller role is not DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/orders/{orderId}/suggestions:
    get:
      tags:
        - Dispatch
      summary: Suggest available couriers for an order
      description: Returns up to three available couriers, preferring the pickup district and then lowest workload. Requires the DISPATCHER or SYSTEM_ADMIN role.
      operationId: getCourierSuggestions
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Courier suggestions retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListCourierSuggestionResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller role is not DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Assignment or order not found

  /api/v1/dispatch/couriers/{courierId}/assignments:
    get:
      tags:
        - Dispatch
      summary: List active assignments for a courier
      operationId: getCourierAssignments
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AssignmentStatus"
      responses:
        "200":
          description: Active assignments for courier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListDispatchAssignmentResponse"

  /api/v1/dispatch/couriers/health:
    get:
      tags:
        - CourierAvailability
      summary: Check courier availability service health
      operationId: courierHealth
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /api/v1/dispatch/couriers:
    get:
      tags:
        - CourierAvailability
      summary: List couriers with optional district and shift status filters
      description: Requires the DISPATCHER or SYSTEM_ADMIN role.
      operationId: getCouriers
      parameters:
        - name: district
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SriLankanDistrict"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ShiftStatus"
      responses:
        "200":
          description: List of couriers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListCourierShiftResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller role is not DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/couriers/workload:
    get:
      tags:
        - CourierAvailability
      summary: List current courier workloads
      description: Requires the DISPATCHER or SYSTEM_ADMIN role.
      operationId: getWorkloads
      responses:
        "200":
          description: Courier workloads retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListCourierWorkloadResponse"
        "401":
          description: Missing or invalid gateway identity headers (X-User-Id, X-User-Role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Caller role is not DISPATCHER or SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/dispatch/couriers/{courierId}:
    get:
      tags:
        - CourierAvailability
      summary: Get courier shift status and live metrics
      operationId: getCourier
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Courier shift status retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierShiftResponse"
        "404":
          description: Courier not found

  /api/v1/dispatch/couriers/shifts/start:
    post:
      tags:
        - CourierAvailability
      summary: Start or register courier shift
      operationId: startShift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartShiftRequest"
      responses:
        "200":
          description: Courier shift started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierShiftResponse"
        "409":
          description: >-
            Data Conflict: the shift record was created by a concurrent request for the same courier
            (unique-key violation). Database details are not returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                dataConflict:
                  summary: Concurrent first-time shift start
                  value:
                    status: 409
                    error: Data Conflict
                    message: The request conflicts with an existing record. Refresh and retry.
                    path: /api/v1/dispatch/couriers/shifts/start
                    timestamp: "2026-11-15T08:30:00Z"

  /api/v1/dispatch/couriers/shifts/{courierId}/end:
    post:
      tags:
        - CourierAvailability
      summary: End courier shift
      operationId: endShift
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Courier shift ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierShiftResponse"
        "409":
          description: >-
            Shift Conflict: the courier still has active parcels, so the shift is left unchanged.
            Also returned as Courier Not Available for an unknown courier, or Conflict when the
            courier's record was changed by a concurrent operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                activeParcels:
                  summary: Courier still has active parcels
                  value:
                    status: 409
                    error: Shift Conflict
                    message: "Cannot end shift: the courier still has 2 active parcel(s). Complete or reassign them first."
                    path: /api/v1/dispatch/couriers/shifts/11111111-2222-4333-8444-555555555555/end
                    timestamp: "2026-11-15T08:30:00Z"

  /api/v1/dispatch/couriers/shifts/status:
    put:
      tags:
        - CourierAvailability
      summary: Update courier shift status
      operationId: updateShiftStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShiftStatusRequest"
      responses:
        "200":
          description: Shift status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierShiftResponse"

  /api/v1/dispatch/couriers/shifts/location:
    put:
      tags:
        - CourierAvailability
      summary: Record courier GPS location heartbeat ping
      operationId: updateLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierLocationPingRequest"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierShiftResponse"
        "409":
          description: >-
            Conflict: the courier's record kept changing concurrently (for example during an
            assignment) after up to three automatic attempts, or Courier Not Available for an
            unknown courier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                courierRecordChanged:
                  summary: Courier record changed by another operation
                  value:
                    status: 409
                    error: Conflict
                    message: >-
                      The courier's record was changed by another operation, such as a location
                      update or another assignment. Refresh and retry.
                    path: /api/v1/dispatch/couriers/shifts/location
                    timestamp: "2026-11-15T08:30:00Z"

components:
  schemas:
    AssignmentStatus:
      type: string
      enum: [UNASSIGNED, ASSIGNED, REASSIGNED, FAILED, CANCELLED, COMPLETED]

    ShiftStatus:
      type: string
      enum: [AVAILABLE, BUSY, ON_BREAK, OFFLINE]

    VehicleType:
      type: string
      enum: [MOTORCYCLE, VAN, THREE_WHEELER, BICYCLE]

    OrderSpeed:
      type: string
      enum: [STANDARD, EXPRESS, SAME_DAY]

    SriLankanDistrict:
      type: string
      enum:
        - COLOMBO
        - GAMPAHA
        - KALUTARA
        - KANDY
        - MATALE
        - NUWARA_ELIYA
        - GALLE
        - MATARA
        - HAMBANTOTA
        - JAFFNA
        - KILINOCHCHI
        - MANNAR
        - VAVUNIYA
        - MULLAITIVU
        - BATTICALOA
        - AMPARA
        - TRINCOMALEE
        - KURUNEGALA
        - PUTTALAM
        - ANURADHAPURA
        - POLONNARUWA
        - BADULLA
        - MONARAGALA
        - RATNAPURA
        - KEGALLE

    ManualAssignRequest:
      type: object
      required:
        - orderId
        - courierId
      properties:
        orderId:
          type: string
          format: uuid
        courierId:
          type: string
          format: uuid
        assignedBy:
          type: string
          example: DISPATCHER_ADMIN
        reason:
          type: string

    ReassignCourierRequest:
      type: object
      required:
        - orderId
        - expectedCurrentCourierId
        - newCourierId
      properties:
        orderId:
          type: string
          format: uuid
        expectedCurrentCourierId:
          type: string
          format: uuid
          description: Courier the dispatcher believes is currently assigned
        newCourierId:
          type: string
          format: uuid
        assignedBy:
          type: string
          example: DISPATCHER_ADMIN
        reason:
          type: string

    StartShiftRequest:
      type: object
      required:
        - courierId
        - courierName
        - initialDistrict
      properties:
        courierId:
          type: string
          format: uuid
        courierName:
          type: string
          example: Sunil Perera
        phone:
          type: string
          example: "+94771234567"
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
        initialDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        maxCapacity:
          type: integer
          example: 5

    UpdateShiftStatusRequest:
      type: object
      required:
        - courierId
        - status
      properties:
        courierId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ShiftStatus"

    CourierLocationPingRequest:
      type: object
      required:
        - courierId
        - district
      properties:
        courierId:
          type: string
          format: uuid
        district:
          $ref: "#/components/schemas/SriLankanDistrict"
        latitude:
          type: number
          example: 6.9271
        longitude:
          type: number
          example: 79.8612

    DispatchAssignmentResponse:
      type: object
      properties:
        assignmentId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        trackingNumber:
          type: string
          example: SD-COL-98214
        courierId:
          type: string
          format: uuid
        courierName:
          type: string
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        orderSpeed:
          $ref: "#/components/schemas/OrderSpeed"
        status:
          $ref: "#/components/schemas/AssignmentStatus"
        assignedBy:
          type: string
        assignedAt:
          type: string
          format: date-time
        estimatedPickupMinutes:
          type: integer
        failureReason:
          type: string
        retryCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CourierShiftResponse:
      type: object
      properties:
        courierId:
          type: string
          format: uuid
        courierName:
          type: string
        phone:
          type: string
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
        currentDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        latitude:
          type: number
        longitude:
          type: number
        shiftStatus:
          $ref: "#/components/schemas/ShiftStatus"
        activeParcelsCount:
          type: integer
        maxCapacity:
          type: integer
        shiftStartedAt:
          type: string
          format: date-time
        shiftEndedAt:
          type: string
          format: date-time
        lastHeartbeatAt:
          type: string
          format: date-time

    CourierWorkloadResponse:
      type: object
      properties:
        courierId:
          type: string
          format: uuid
        courierName:
          type: string
        activeParcels:
          type: integer
        maxCapacity:
          type: integer
        currentDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        shiftStatus:
          $ref: "#/components/schemas/ShiftStatus"

    CourierSuggestionResponse:
      type: object
      properties:
        courierId:
          type: string
          format: uuid
        courierName:
          type: string
        currentDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        samePickupDistrict:
          type: boolean
        activeParcels:
          type: integer
        maxCapacity:
          type: integer
        shiftStatus:
          $ref: "#/components/schemas/ShiftStatus"

    ApiErrorResponse:
      type: object
      description: >-
        Error body returned by the global exception handler (com.swiftdrop.contracts.dto.ApiErrorResponse).
        Null fields are omitted.
      required:
        - status
        - error
        - message
        - path
        - timestamp
      properties:
        status:
          type: integer
          example: 409
        error:
          type: string
          description: Error label, for example Conflict, Assignment Conflict, Shift Conflict or Data Conflict
          example: Shift Conflict
        message:
          type: string
          example: "Cannot end shift: the courier still has 2 active parcel(s). Complete or reassign them first."
        path:
          type: string
          example: /api/v1/dispatch/couriers/shifts/11111111-2222-4333-8444-555555555555/end
        correlationId:
          type: string
          description: Request correlation ID, included on 500 responses when the X-Correlation-Id header is a UUID
          example: 0f5e8c4a-2c6d-4a58-9c8f-4c2c4e7b8a11
        fieldErrors:
          type: object
          description: Field name mapped to its validation messages, when present
          additionalProperties:
            type: array
            items:
              type: string
        timestamp:
          type: string
          format: date-time

    ApiResponseString:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: string
        timestamp:
          type: string
          format: date-time

    ApiResponseDispatchAssignmentResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/DispatchAssignmentResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseListDispatchAssignmentResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/DispatchAssignmentResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseCourierShiftResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/CourierShiftResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseListCourierShiftResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/CourierShiftResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseListCourierWorkloadResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/CourierWorkloadResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseListCourierSuggestionResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/CourierSuggestionResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponsePagedResultDispatchAssignmentResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/DispatchAssignmentResponse"
            page:
              type: integer
            size:
              type: integer
            totalElements:
              type: integer
            totalPages:
              type: integer
            hasNext:
              type: boolean
            hasPrevious:
              type: boolean
        timestamp:
          type: string
          format: date-time

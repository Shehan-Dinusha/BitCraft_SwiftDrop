openapi: 3.1.0
info:
  title: SwiftDrop Pricing and Zone API
  description: Dynamic delivery tariff calculation, geofence zones, and quote estimation APIs.
  version: v1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/pricing/health:
    get:
      tags: [Pricing]
      summary: Check pricing service health
      operationId: checkPricingHealth
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /api/v1/pricing/quote:
    post:
      tags: [Pricing]
      summary: Calculate dynamic delivery fee quotation
      description: Also served under the alias prefix /api/v1/pricing-quote.
      operationId: calculatePricingQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingQuoteRequest"
      responses:
        "200":
          description: Pricing quotation response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePricingQuoteResponse"
        "400":
          description: Validation failed, or no active tariff or zone mapping is configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/pricing/estimate:
    post:
      tags: [Pricing]
      summary: Calculate a delivery fee estimate
      description: Also served under the alias prefix /api/v1/pricing-quote.
      operationId: estimateDeliveryFee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateRequest"
      responses:
        "200":
          description: Delivery fee estimate response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseEstimateResponse"
        "400":
          description: Validation failed, or no active tariff or zone mapping is configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/pricing/zones:
    get:
      tags: [Pricing]
      summary: List all pricing geofence zones
      operationId: listPricingZones
      responses:
        "200":
          description: List of pricing zones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListPricingZone"

  /api/v1/geofence-zone/health:
    get:
      tags: [Geofence Zone]
      summary: Check geofence zone endpoint health
      operationId: checkGeofenceZoneHealth
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /api/v1/pricing/tariffs:
    get:
      tags: [ Tariff Management ]
      summary: List all tariff rule versions, newest first
      operationId: listTariffRules
      responses:
        "200":
          description: Tariff rule versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListTariffRuleResponse"

  /api/v1/pricing/tariffs/active:
    get:
      tags: [ Tariff Management ]
      summary: Get the active default tariff rule
      operationId: getActiveTariffRule
      responses:
        "200":
          description: Active tariff rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTariffRuleResponse"
        "404":
          description: No active tariff rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"

  /api/v1/pricing/tariffs/default:
    put:
      tags: [ Tariff Management ]
      summary: Publish a new default tariff version (dispatcher or system admin only)
      operationId: publishTariffRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TariffRuleRequest"
      responses:
        "200":
          description: New tariff version published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTariffRuleResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Caller is not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "403":
          description: Caller role is not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "409":
          description: Tariff rule version already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"

  /api/v1/zones:
    get:
      tags: [ Zone Management ]
      summary: List pricing zones
      operationId: listZones
      responses:
        "200":
          description: Pricing zones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListZoneResponse"
    post:
      tags: [ Zone Management ]
      summary: Create a pricing zone (dispatcher or system admin only)
      operationId: createZone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneRequest"
      responses:
        "201":
          description: Zone created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseZoneResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Caller is not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "403":
          description: Caller role is not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "409":
          description: Zone code already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"

  /api/v1/zones/{zoneCode}:
    parameters:
      - name: zoneCode
        in: path
        required: true
        schema:
          type: string
          example: ZONE_WESTERN
    get:
      tags: [ Zone Management ]
      summary: Get a pricing zone
      operationId: getZone
      responses:
        "200":
          description: Pricing zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseZoneResponse"
        "404":
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
    put:
      tags: [ Zone Management ]
      summary: Update a pricing zone (dispatcher or system admin only)
      operationId: updateZone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneRequest"
      responses:
        "200":
          description: Zone updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseZoneResponse"
        "400":
          description: Validation error (ApiErrorResponse), or the zone code in the body differs from the path (ApiResponseVoid)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApiErrorResponse"
                  - $ref: "#/components/schemas/ApiResponseVoid"
        "401":
          description: Caller is not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "403":
          description: Caller role is not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "404":
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
    delete:
      tags: [ Zone Management ]
      summary: Delete a zone that has no districts mapped (dispatcher or system admin only)
      operationId: deleteZone
      responses:
        "200":
          description: Zone deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "401":
          description: Caller is not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "403":
          description: Caller role is not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "404":
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "409":
          description: Zone still has districts mapped to it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"

  /api/v1/zones/districts:
    get:
      tags: [ Zone Management ]
      summary: List district to zone mappings
      operationId: listDistrictMappings
      responses:
        "200":
          description: District mappings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListDistrictMappingResponse"

  /api/v1/zones/districts/{district}:
    put:
      tags: [ Zone Management ]
      summary: Assign a district to a zone (dispatcher or system admin only)
      operationId: assignDistrictToZone
      parameters:
        - name: district
          in: path
          required: true
          description: District name, case-insensitive
          schema:
            $ref: "#/components/schemas/SriLankanDistrict"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistrictMappingRequest"
      responses:
        "200":
          description: Mapping updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDistrictMappingResponse"
        "400":
          description: Validation error (ApiErrorResponse), or unknown district (ApiResponseVoid)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApiErrorResponse"
                  - $ref: "#/components/schemas/ApiResponseVoid"
        "401":
          description: Caller is not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "403":
          description: Caller role is not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "404":
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"

components:
  schemas:
    OrderSpeed:
      type: string
      enum: [STANDARD, EXPRESS, SAME_DAY]
      example: STANDARD

    SriLankanDistrict:
      type: string
      enum:
        - COLOMBO
        - GAMPAHA
        - KALUTARA
        - KANDY
        - MATALE
        - NUWARA_ELIYA
        - GALLE
        - MATARA
        - HAMBANTOTA
        - JAFFNA
        - KILINOCHCHI
        - MANNAR
        - VAVUNIYA
        - MULLAITIVU
        - BATTICALOA
        - AMPARA
        - TRINCOMALEE
        - KURUNEGALA
        - PUTTALAM
        - ANURADHAPURA
        - POLONNARUWA
        - BADULLA
        - MONARAGALA
        - RATNAPURA
        - KEGALLE
      example: COLOMBO

    PricingQuoteRequest:
      type: object
      required:
        - pickupDistrict
        - deliveryDistrict
        - actualWeightKg
      properties:
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        actualWeightKg:
          type: number
          format: double
          minimum: 0.01
          example: 1.5
        lengthCm:
          type: number
          format: double
          minimum: 0.1
          example: 25.0
        widthCm:
          type: number
          format: double
          minimum: 0.1
          example: 20.0
        heightCm:
          type: number
          format: double
          minimum: 0.1
          example: 10.0
        speed:
          allOf:
            - $ref: "#/components/schemas/OrderSpeed"
          default: STANDARD

    PricingQuoteResponse:
      type: object
      properties:
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        pickupZone:
          type: string
          example: ZONE_WESTERN
        deliveryZone:
          type: string
          example: ZONE_CENTRAL
        intraDistrict:
          type: boolean
          example: false
        actualWeightKg:
          type: number
          format: double
          example: 1.5
        volumetricWeightKg:
          type: number
          format: double
          description: Volumetric weight in kg (L*W*H / volumetric divisor of the active tariff rule)
          example: 1.0
        chargeableWeightKg:
          type: number
          format: double
          description: Chargeable billable weight in kg (the higher of actual and volumetric weight)
          example: 1.5
        speed:
          $ref: "#/components/schemas/OrderSpeed"
        baseFee:
          type: number
          format: double
          description: Base starting fee (first weight step included)
          example: 550.0
        weightFee:
          type: number
          format: double
          description: Additional weight fee for every started extra weight step
          example: 60.0
        speedSurcharge:
          type: number
          format: double
          description: Speed surcharge in LKR (total fee minus the standard subtotal)
          example: 0.0
        estimatedFee:
          type: number
          format: double
          example: 610.0
        currency:
          type: string
          example: LKR
        pricingRuleVersionId:
          type: string
          example: PRICING-2026-V1

    EstimateRequest:
      type: object
      required:
        - pickupDistrict
        - deliveryDistrict
        - actualWeightKg
      properties:
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        actualWeightKg:
          type: number
          format: double
          minimum: 0.01
          example: 2.5
        lengthCm:
          type: number
          format: double
          minimum: 0.1
          example: 20.0
        widthCm:
          type: number
          format: double
          minimum: 0.1
          example: 15.0
        heightCm:
          type: number
          format: double
          minimum: 0.1
          example: 10.0
        speed:
          allOf:
            - $ref: "#/components/schemas/OrderSpeed"
          default: STANDARD

    EstimateResponse:
      type: object
      properties:
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        pickupZone:
          type: string
          example: ZONE_WESTERN
        deliveryZone:
          type: string
          example: ZONE_CENTRAL
        intraDistrict:
          type: boolean
          example: false
        actualWeightKg:
          type: number
          format: double
          example: 2.5
        volumetricWeightKg:
          type: number
          format: double
          description: Volumetric weight in kg (L*W*H / volumetric divisor of the active tariff rule)
          example: 0.6
        chargeableWeightKg:
          type: number
          format: double
          example: 2.5
        speed:
          $ref: "#/components/schemas/OrderSpeed"
        baseFee:
          type: number
          format: double
          example: 550.0
        weightFee:
          type: number
          format: double
          example: 240.0
        speedSurcharge:
          type: number
          format: double
          example: 395.0
        estimatedFee:
          type: number
          format: double
          example: 1185.0
        currency:
          type: string
          example: LKR
        pricingRuleVersionId:
          type: string
          example: PRICING-2026-V1
        strategy:
          type: string
          description: Pricing strategy used (STANDARD, EXPRESS or SAME_DAY)
          example: EXPRESS

    PricingZone:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        zoneCode:
          type: string
          example: ZONE_WESTERN
        zoneName:
          type: string
          example: Western Province Metro
        tier:
          type: string
          example: METRO
        baseFee:
          type: number
          format: double
          example: 350.0
        perKgFee:
          type: number
          format: double
          example: 80.0
        expressMultiplier:
          type: number
          format: double
          example: 1.5
        sameDayMultiplier:
          type: number
          format: double
          example: 2.0
        status:
          type: string
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApiErrorResponse:
      type: object
      description: Error body returned by the global exception handler for 400 responses
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation failed
        path:
          type: string
          example: /api/v1/pricing/estimate
        correlationId:
          type: string
          description: Correlation identifier for tracing the failure. Omitted when not set
          example: 0f5e8c4a-2c6d-4a58-9c8f-4c2c4e7b8a11
        fieldErrors:
          type: object
          description: Present for validation errors. Field name mapped to its error messages
          additionalProperties:
            type: array
            items:
              type: string

    ApiResponseString:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Service is online
        data:
          type: string
          example: Pricing service is online
        timestamp:
          type: string
          format: date-time

    ApiResponsePricingQuoteResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Quotation calculated successfully
        data:
          $ref: "#/components/schemas/PricingQuoteResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseEstimateResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Estimate calculated successfully
        data:
          $ref: "#/components/schemas/EstimateResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseListPricingZone:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Pricing zones retrieved successfully
        data:
          type: array
          items:
            $ref: "#/components/schemas/PricingZone"
        timestamp:
          type: string
          format: date-time

    ZoneRequest:
      type: object
      required:
        - zoneCode
        - zoneName
        - tier
        - baseFee
        - perKgFee
        - expressMultiplier
        - sameDayMultiplier
      properties:
        zoneCode:
          type: string
          maxLength: 32
          description: Unique zone code. Cannot be changed on update
          example: ZONE_WESTERN
        zoneName:
          type: string
          maxLength: 128
          example: Western Province Metro
        tier:
          type: string
          maxLength: 32
          example: METRO
        baseFee:
          type: number
          format: double
          minimum: 0
          description: Base fee in LKR for deliveries inside one district of this zone
          example: 350.0
        perKgFee:
          type: number
          format: double
          minimum: 0
          description: Fee in LKR for each extra weight step
          example: 80.0
        expressMultiplier:
          type: number
          format: double
          minimum: 1
          example: 1.5
        sameDayMultiplier:
          type: number
          format: double
          minimum: 1
          example: 2.0
        status:
          type: string
          maxLength: 64
          description: Optional. Defaults to ACTIVE on create and keeps the current value on update
          example: ACTIVE

    ZoneResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        zoneCode:
          type: string
        zoneName:
          type: string
        tier:
          type: string
        baseFee:
          type: number
          format: double
        perKgFee:
          type: number
          format: double
        expressMultiplier:
          type: number
          format: double
        sameDayMultiplier:
          type: number
          format: double
        status:
          type: string
        updatedAt:
          type: string
          format: date-time

    DistrictMappingRequest:
      type: object
      required:
        - zoneCode
      properties:
        zoneCode:
          type: string
          maxLength: 32
          description: Code of an existing zone to map the district to
          example: ZONE_CENTRAL

    DistrictMappingResponse:
      type: object
      properties:
        district:
          $ref: "#/components/schemas/SriLankanDistrict"
        zoneCode:
          type: string

    TariffRuleRequest:
      type: object
      required:
        - basePrice
        - weightStepKg
        - pricePerStep
        - volumetricDivisor
      properties:
        ruleVersionId:
          type: string
          maxLength: 64
          description: Optional. Generated when blank.
          example: PRICING-2026-V2
        basePrice:
          type: number
          format: double
          minimum: 0
          description: Base price in LKR for different-district deliveries. Covers the first weight step
          example: 550.0
        weightStepKg:
          type: number
          format: double
          minimum: 0.01
          description: Size of one weight step in kg
          example: 1.0
        pricePerStep:
          type: number
          format: double
          minimum: 0
          description: Price in LKR for each extra weight step
          example: 120.0
        volumetricDivisor:
          type: number
          format: double
          minimum: 1
          description: Divisor used to turn length x width x height (cm) into volumetric weight (kg)
          example: 5000.0

    TariffRuleResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        ruleVersionId:
          type: string
        fromDistrict:
          type: string
          description: Origin district, or ALL for the default rule
          example: ALL
        toDistrict:
          type: string
          description: Destination district, or ALL for the default rule
          example: ALL
        basePrice:
          type: number
          format: double
        weightStepKg:
          type: number
          format: double
        pricePerStep:
          type: number
          format: double
        volumetricDivisor:
          type: number
          format: double
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ApiResponseVoid:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    ApiResponseZoneResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/ZoneResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseListZoneResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/ZoneResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseDistrictMappingResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/DistrictMappingResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseListDistrictMappingResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/DistrictMappingResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseTariffRuleResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/TariffRuleResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseListTariffRuleResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/TariffRuleResponse"
        timestamp:
          type: string
          format: date-time
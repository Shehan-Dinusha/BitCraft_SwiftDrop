openapi: 3.1.0
info:
  title: SwiftDrop Auth and IAM API
  description: |
    Authentication, token rotation, identity, and role management for SwiftDrop.
    Access tokens are signed JWTs; refresh tokens are opaque, hashed at rest, and rotated on use.
  version: v1.0.0
servers:
  - url: /
    description: API Gateway (same origin as this Swagger UI)
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and issue access and refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '202':
          description: >-
            Password accepted but a second factor is required (SYSTEM_ADMIN and DISPATCHER when
            AUTH_MFA_ENABLED=true). A 6-digit code was emailed; finish with POST /api/v1/auth/login/mfa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallengeResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Account is not active, or the email is not verified yet (the ApiErrorResponse error field is EMAIL_NOT_VERIFIED; call /verify-email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Too many failed login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/login/mfa:
    post:
      tags: [Auth]
      summary: Complete a sign-in with the emailed second-factor code
      description: >-
        Exchanges the challenge from a 202 /login response plus the emailed code for a token pair.
        The refresh token is set as the HttpOnly swiftdrop_refresh cookie. After 5 wrong codes the
        code is destroyed and the user must sign in again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginMfaRequest'
      responses:
        '200':
          description: Token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Wrong or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unknown or expired challenge; sign in again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Too many incorrect codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a customer or merchant account
      description: |
        Creates the account unverified and emails a 6-digit verification code (via notification-service).
        The user must confirm it with `POST /api/v1/auth/verify-email` before password sign-in works.
        Registering again with the same, still-unverified email replaces the pending sign-up.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: Account created; a verification code was emailed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Username, email, or phone already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirm an email address with the emailed code
      description: |
        Marks the account verified. No session is created: the frontend shows a "registered"
        confirmation and the user then signs in with `/login`. Codes expire after 10 minutes, are
        single use, and are destroyed after 5 wrong attempts (HTTP 429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified; the user can now sign in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '400':
          description: Invalid or expired code, or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Email address is already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Too many attempts or requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/username-availability:
    get:
      tags: [Auth]
      summary: Check whether a username is free for a new account
      description: >-
        Used by the sign-up form while the user types. Case-insensitive; a pending (unverified) sign-up
        also holds its username. Rate limited to 60 checks per minute per client IP. The database unique
        index remains the authority, so /register still answers 409 for a taken username.
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
          example: nimal.perera
      responses:
        '200':
          description: Availability of the username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUsernameAvailability'
        '429':
          description: Too many checks from this client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/resend-verification:
    post:
      tags: [Auth]
      summary: Send a new email verification code
      description: Always answers 200 so it cannot be used to discover which accounts exist. Throttled per user and per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierRequest'
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '429':
          description: Too many requests from this client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Email a password reset code
      description: Always answers 200 so it cannot be used to discover which accounts exist. Throttled per user and per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierRequest'
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '429':
          description: Too many requests from this client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password using the emailed reset code
      description: Revokes every existing session of the account. The new password must meet the policy, must not contain the username or email, and must differ from the current password; the code is consumed only when the reset succeeds.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '400':
          description: Invalid or expired code, or password does not meet the policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Too many attempts or requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/invite/preview:
    post:
      tags: [Staff invites]
      summary: Check an invite link
      description: Returns who a staff invite is for. Counts against the per-IP limit of the one-time-code endpoints.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteTokenRequest'
      responses:
        '200':
          description: Invite is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseInvitePreview'
        '400':
          description: The link is invalid, already used, or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/invite/accept:
    post:
      tags: [Staff invites]
      summary: Accept an invite and sign in
      description: >-
        Sets the password chosen on the invite page, spends the invite and signs the person in. The
        refresh token is set as the HttpOnly swiftdrop_refresh cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid, used or expired link, or the password does not meet the policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token and issue a new access token
      description: >-
        Browsers send no body; the refresh token is read from the HttpOnly swiftdrop_refresh
        cookie (Path=/api/v1/auth, SameSite=Strict). Non-browser clients may send it in the body.
        The rotated token is returned as a new Set-Cookie, never in the JSON body.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Refresh token invalid, expired, revoked, or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/oauth2/google/authorize:
    get:
      tags: [Auth]
      summary: Start Google OAuth 2.0 login
      description: Redirects the browser to Google's consent screen. Returns 503 if Google OAuth credentials are not configured.
      operationId: googleAuthorize
      security: []
      responses:
        '302':
          description: Redirect to Google's consent screen
        '503':
          description: Google OAuth is not configured
  /api/v1/auth/oauth2/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth 2.0 callback
      description: >-
        Receives the authorization code from Google, validates the state token, upserts the user, and
        redirects to the frontend callback page with a short-lived one-time exchange code in the query string.
      operationId: googleCallback
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        '302':
          description: Redirect to the frontend OAuth callback page
  /api/v1/auth/oauth2/exchange:
    post:
      tags: [Auth]
      summary: Exchange OAuth one-time code for SwiftDrop tokens
      description: >-
        Accepts the short-lived code issued by the Google callback and returns a token pair. The code is
        consumed immediately and cannot be reused. The refresh token is set as the HttpOnly cookie.
      operationId: googleExchange
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthExchangeRequest'
      responses:
        '200':
          description: Token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /api/v1/auth/.well-known/jwks.json:
    get:
      tags: [Signing keys]
      summary: Get the public JSON Web Key Set
      operationId: jwks
      security: []
      responses:
        '200':
          description: Public RSA verification keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current refresh token and access token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the authenticated user's password and revoke all sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '400':
          description: Validation failure or incorrect current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    patch:
      tags: [Users]
      summary: Update the authenticated user's own profile
      description: Changes first name, last name, phone and district. Username, email, role and status cannot be changed here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Phone number is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    delete:
      tags: [Users]
      summary: Erase the authenticated customer's own account
      description: >
        Needs the current password. Removes the username, email, phone, names and district,
        revokes every session and blocks sign-in. Orders already placed keep an owner id but no
        personal data. Customer accounts only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '200':
          description: Account erased
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '400':
          description: Validation failure or incorrect current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Not a customer account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/users/me/avatar:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile picture
      responses:
        '200':
          description: The picture
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
        '401':
          description: Authentication required
        '404':
          description: No profile picture
    put:
      tags: [Users]
      summary: Set the authenticated user's profile picture
      description: PNG, JPEG or WebP up to 512 KB in the multipart part `file`. The type is checked from the file content.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Profile picture updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '400':
          description: Not a PNG, JPEG or WebP image, or larger than 512 KB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Authentication required
    delete:
      tags: [Users]
      summary: Remove the authenticated user's profile picture
      responses:
        '200':
          description: Profile picture removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '401':
          description: Authentication required
  /api/v1/users:
    get:
      tags: [Users]
      summary: List and search users
      description: Requires SYSTEM_ADMIN.
      parameters:
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Users retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePagedUsers'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: SYSTEM_ADMIN required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    post:
      tags: [Users]
      summary: Provision a platform account with any role
      description: >-
        Requires SYSTEM_ADMIN. Without a password the person is emailed an invite link (valid 72 hours)
        where they choose their own password. Use this for dispatchers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: SYSTEM_ADMIN required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Username, email, or phone already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/users/couriers:
    get:
      tags: [Courier accounts]
      summary: List couriers
      description: >-
        Requires DISPATCHER or SYSTEM_ADMIN. A dispatcher sees the couriers of their own district (the
        district parameter is ignored); a SYSTEM_ADMIN sees every district or the one given.
      parameters:
        - name: district
          in: query
          schema:
            $ref: '#/components/schemas/SriLankanDistrict'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Couriers retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePagedUsers'
        '403':
          description: DISPATCHER or SYSTEM_ADMIN required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    post:
      tags: [Courier accounts]
      summary: Register a courier and email them an invite
      description: >-
        Requires DISPATCHER or SYSTEM_ADMIN. Creates the COURIER account in the dispatcher's own district
        without a password. The courier receives an email link (valid 72 hours) where they choose a
        password and add their vehicle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourierRequest'
      responses:
        '201':
          description: Courier registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: DISPATCHER or SYSTEM_ADMIN required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Username, email, or phone already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/users/couriers/{courierId}:
    get:
      tags: [Courier accounts]
      summary: Get a courier
      description: Requires DISPATCHER or SYSTEM_ADMIN. 403 for a courier of another district.
      parameters:
        - $ref: '#/components/parameters/CourierId'
      responses:
        '200':
          description: Courier retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '403':
          description: Not permitted, or the courier belongs to another district
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Courier not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/users/couriers/{courierId}/invite:
    post:
      tags: [Courier accounts]
      summary: Resend a courier's invite
      description: Sends a new invite link and invalidates the previous one.
      parameters:
        - $ref: '#/components/parameters/CourierId'
      responses:
        '200':
          description: Invite sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '403':
          description: Not permitted, or the courier belongs to another district
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: The courier has already set up the account, or it is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/users/couriers/{courierId}/status:
    patch:
      tags: [Courier accounts]
      summary: Suspend, deactivate, or reactivate a courier
      description: Suspending or deactivating revokes the courier's sessions immediately.
      parameters:
        - $ref: '#/components/parameters/CourierId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Courier status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '403':
          description: Not permitted, or the courier belongs to another district
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Courier not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/users/{userId}:
    get:
      tags: [Users]
      summary: Get a user by public identifier
      description: Requires SYSTEM_ADMIN.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '403':
          description: SYSTEM_ADMIN required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/users/{userId}/role:
    patch:
      tags: [Users]
      summary: Verify an existing account role
      description: Requires SYSTEM_ADMIN. Roles are fixed at account creation. Requests for a different role return 409; the current role is an idempotent no-op.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: Account role unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: SYSTEM_ADMIN required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Account roles cannot be changed after creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/users/{userId}/invite:
    post:
      tags: [Users]
      summary: Resend an account's invite
      description: Requires SYSTEM_ADMIN. Sends a new invite link and invalidates the previous one.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Invite sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '403':
          description: SYSTEM_ADMIN required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: The account has already been set up, or it is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/users/{userId}/status:
    patch:
      tags: [Users]
      summary: Suspend, deactivate, or reactivate a user
      description: Requires SYSTEM_ADMIN. Non-active status revokes all active sessions.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: SYSTEM_ADMIN required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Cannot deactivate the last active SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourierId:
      name: courierId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 320
          description: Username or email address.
          example: customer.one
        password:
          type: string
          maxLength: 72
          format: password
          example: SwiftDrop123
    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challengeId, expiresInMinutes]
      properties:
        mfaRequired:
          type: boolean
          description: Always true; lets clients tell this body apart from a TokenResponse.
          example: true
        challengeId:
          type: string
          description: Opaque, single-use id of this sign-in attempt. Send it to /login/mfa.
        expiresInMinutes:
          type: integer
          format: int32
          example: 10
    LoginMfaRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId:
          type: string
          maxLength: 64
        code:
          type: string
          pattern: '^[0-9]{6}$'
          example: '123456'
    RegisterUserRequest:
      type: object
      required: [username, email, firstName, lastName, password, role, district]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9._-]{3,50}$'
          example: customer.one
        email:
          type: string
          format: email
          maxLength: 320
          example: customer.one@example.com
        phone:
          type: string
          pattern: '^$|^\+?[0-9]{7,15}$'
          example: '+94771234567'
        firstName:
          type: string
          maxLength: 100
          example: Nimal
        lastName:
          type: string
          maxLength: 100
          example: Perera
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          example: SwiftDrop123
        role:
          allOf:
            - $ref: '#/components/schemas/UserRole'
          description: Self-service registration supports CUSTOMER and MERCHANT only.
        district:
          $ref: '#/components/schemas/SriLankanDistrict'
        merchantId:
          type: string
          format: uuid
          nullable: true
    CreateUserRequest:
      type: object
      required: [username, email, firstName, lastName, role, district]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9._-]{3,50}$'
        email:
          type: string
          format: email
          maxLength: 320
        phone:
          type: string
          pattern: '^$|^\+?[0-9]{7,15}$'
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          description: >-
            Optional. Leave it out to email the person an invite link where they choose their own
            password (recommended for staff accounts).
        role:
          $ref: '#/components/schemas/UserRole'
        district:
          $ref: '#/components/schemas/SriLankanDistrict'
        merchantId:
          type: string
          format: uuid
          nullable: true
    CreateCourierRequest:
      type: object
      description: Registers a courier. No password is set; the courier receives an email invite.
      required: [username, email, phone, firstName, lastName]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9._-]{3,50}$'
          example: kasun.colombo
        email:
          type: string
          format: email
          maxLength: 320
        phone:
          type: string
          pattern: '^\+?[0-9]{7,15}$'
          example: '+94771234567'
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        district:
          $ref: '#/components/schemas/SriLankanDistrict'
    InviteTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 64
          description: Invite token from the emailed link (the part after
            #token=).
    AcceptInviteRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
    InvitePreviewResponse:
      type: object
      properties:
        firstName:
          type: string
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        district:
          $ref: '#/components/schemas/SriLankanDistrict'
        expiresAt:
          type: string
          format: date-time
    ApiResponseInvitePreview:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/InvitePreviewResponse'
        timestamp:
          type: string
          format: date-time
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional when the swiftdrop_refresh cookie is sent.
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke.
    VerifyEmailRequest:
      type: object
      required: [identifier, code]
      properties:
        identifier:
          type: string
          maxLength: 320
          description: Username or email address of the account.
          example: customer.one@example.com
        code:
          type: string
          pattern: '^\d{6}$'
          description: 6-digit verification code.
          example: '482913'
    IdentifierRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          maxLength: 320
          description: Username or email address of the account.
          example: customer.one@example.com
    ResetPasswordRequest:
      type: object
      required: [identifier, code, newPassword]
      properties:
        identifier:
          type: string
          maxLength: 320
          description: Username or email address of the account.
          example: customer.one@example.com
        code:
          type: string
          pattern: '^\d{6}$'
          description: 6-digit reset code.
          example: '482913'
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          description: 8-72 characters with at least one letter and one digit.
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 72
          format: password
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          format: password
    UpdateProfileRequest:
      type: object
      description: Self-service profile update.
      required: [firstName, lastName, district]
      properties:
        firstName:
          type: string
          maxLength: 100
          example: Nimal
        lastName:
          type: string
          maxLength: 100
          example: Perera
        phone:
          type: string
          maxLength: 32
          pattern: '^$|^\+?[0-9]{7,15}$'
          description: Phone number; empty removes it.
          example: '+94771234567'
        district:
          $ref: '#/components/schemas/SriLankanDistrict'

    DeleteAccountRequest:
      type: object
      required: [currentPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 72
          format: password
          description: The account's current password, as confirmation.
    UpdateUserRoleRequest:
      type: object
      description: Compatibility request to verify an existing role. Account roles cannot be changed after creation.
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'
    OAuthExchangeRequest:
      type: object
      description: One-time code returned from the Google OAuth callback, to be exchanged for tokens
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          description: One-time exchange code from the OAuth callback redirect
    JwksResponse:
      type: object
      description: JSON Web Key Set. Empty in HS256 mode unless an RSA pair has been configured for migration.
      properties:
        keys:
          type: array
          description: Public RSA signing keys.
          items:
            $ref: '#/components/schemas/JwkResponse'
    JwkResponse:
      type: object
      description: RSA public verification key. Contains no private or symmetric key material.
      properties:
        kty: { type: string, enum: [RSA], description: Key type. }
        use: { type: string, enum: [sig], description: Public key use. }
        alg: { type: string, enum: [RS256], description: Allowed signature algorithm. }
        kid: { type: string, description: "Stable SHA-256 fingerprint of the X.509 public key, encoded as base64url." }
        n: { type: string, description: Unsigned RSA modulus encoded as base64url without padding. }
        e: { type: string, description: Unsigned RSA exponent encoded as base64url without padding. }
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          nullable: true
          description: >-
            Always null for /login, /refresh and /oauth2/exchange: the refresh token is set as the
            HttpOnly swiftdrop_refresh cookie instead.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          example: 3600
        userId:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        district:
          $ref: '#/components/schemas/SriLankanDistrict'
    UserProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        district:
          $ref: '#/components/schemas/SriLankanDistrict'
        merchantId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/UserStatus'
        emailVerified:
          type: boolean
          description: True once the email address has been verified.
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        avatarUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the profile picture last changed; null when there is none. The picture is served by GET /api/v1/users/me/avatar.
        invitePending:
          type: boolean
          description: True while a staff account has not yet accepted its email invite.
        inviteExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the pending invite link expires; null when no invite is pending.
    ApiResponseUserProfile:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/UserProfileResponse'
        timestamp:
          type: string
          format: date-time
    UsernameAvailabilityResponse:
      type: object
      required: [username, available]
      properties:
        username:
          type: string
          description: The username that was checked, trimmed.
        available:
          type: boolean
          description: True when the username is valid and no account (verified or pending) uses it.
        reason:
          type: string
          nullable: true
          enum: [TAKEN, INVALID]
          description: Why it is not available. Null when available.
    ApiResponseUsernameAvailability:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/UsernameAvailabilityResponse'
        timestamp:
          type: string
          format: date-time
    ApiResponseVoid:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
        timestamp:
          type: string
          format: date-time
    ApiResponsePagedUsers:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/PagedUserProfileResponse'
        timestamp:
          type: string
          format: date-time
    PagedUserProfileResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserProfileResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
    ApiErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        correlationId:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        timestamp:
          type: string
          format: date-time
    UserRole:
      type: string
      enum: [CUSTOMER, MERCHANT, COURIER, DISPATCHER, SYSTEM_ADMIN]
    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, DEACTIVATED]
    SriLankanDistrict:
      type: string
      enum:
        - COLOMBO
        - GAMPAHA
        - KALUTARA
        - KANDY
        - MATALE
        - NUWARA_ELIYA
        - GALLE
        - MATARA
        - HAMBANTOTA
        - JAFFNA
        - KILINOCHCHI
        - MANNAR
        - VAVUNIYA
        - MULLAITIVU
        - BATTICALOA
        - AMPARA
        - TRINCOMALEE
        - KURUNEGALA
        - PUTTALAM
        - ANURADHAPURA
        - POLONNARUWA
        - BADULLA
        - MONARAGALA
        - RATNAPURA
        - KEGALLE

openapi: 3.1.0
info:
  title: SwiftDrop Auth and IAM API
  description: |
    Authentication, token rotation, identity, and role management for SwiftDrop.
    Access tokens are signed JWTs; refresh tokens are opaque, hashed at rest, and rotated on use.
    Refresh-token replay commits revocation before returning an error.
    Account-wide access-token revocation applies to tokens issued at or before a cutoff;
    tokens issued by a later successful login remain usable immediately.
  version: v1.0.0
servers:
  - url: http://localhost:8080
    description: API Gateway
security:
  - bearerAuth: []
paths:
  /api/v1/auth/.well-known/jwks.json:
    get:
      tags: [Signing keys]
      summary: Get the public JSON Web Key Set
      description: |
        Anonymous at IAM. Member 1 must separately allow this exact path through the gateway.
        Returns RSA public parameters only, with Cache-Control public, max-age=300.
        In default HS256 mode keys is empty unless an RSA pair is explicitly configured
        for migration. Do not enable RS256 until gateway verification is ready.
      security: []
      responses:
        '200':
          description: Standard unwrapped JSON Web Key Set
          headers:
            Cache-Control:
              schema: {type: string}
              description: Public cache lifetime of 300 seconds
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JwksResponse'}
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and issue access and refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Account is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Too many failed login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a customer or merchant account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: Account registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Username, email, or phone already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token and issue a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Refresh token invalid, expired, revoked, or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current refresh token and access token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the authenticated user's password and revoke all sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '400':
          description: Validation failure or incorrect current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/users:
    get:
      tags: [Users]
      summary: List and search users
      description: Requires SYSTEM_ADMIN.
      parameters:
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Users retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePagedUsers'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: SYSTEM_ADMIN required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    post:
      tags: [Users]
      summary: Provision a platform account with any role
      description: Requires SYSTEM_ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: SYSTEM_ADMIN required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Username, email, or phone already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/users/{userId}:
    get:
      tags: [Users]
      summary: Get a user by public identifier
      description: Requires SYSTEM_ADMIN.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '403':
          description: SYSTEM_ADMIN required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/users/{userId}/role:
    patch:
      tags: [Users]
      summary: Change a user's role
      description: Requires SYSTEM_ADMIN. Revokes the target user's active sessions.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: SYSTEM_ADMIN required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Cannot remove the last active SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/users/{userId}/status:
    patch:
      tags: [Users]
      summary: Suspend, deactivate, or reactivate a user
      description: Requires SYSTEM_ADMIN. Non-active status revokes all active sessions.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: SYSTEM_ADMIN required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Cannot deactivate the last active SYSTEM_ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/users/couriers:
    get:
      tags: [Courier accounts]
      summary: List couriers in the caller's scope
      description: Active DISPATCHER sees only their district; SYSTEM_ADMIN sees all districts. Current IAM data supplies scope.
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/UserStatus'}}
        - {name: search, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, default: 0}}
        - {name: size, in: query, schema: {type: integer, default: 20}}
      responses:
        '200':
          description: Scoped courier identities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiResponsePagedUsers'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Courier accounts]
      summary: Provision a courier identity within the caller's scope
      description: Active DISPATCHER may provision only their district; SYSTEM_ADMIN may use any district. Role is always COURIER; no merchant association or dispatch operational data is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCourierRequest'}
      responses:
        '201':
          description: Courier created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiResponseUserProfile'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/AccountConflict'}
  /api/v1/users/couriers/{courierId}:
    parameters:
      - {name: courierId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Courier accounts]
      summary: Get a courier identity within the caller's scope
      responses:
        '200':
          description: Courier identity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiResponseUserProfile'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/CourierNotFound'}
    put:
      tags: [Courier accounts]
      summary: Replace courier contact details within the caller's scope
      description: Role and district remain unchanged. Email changes revoke existing access and refresh sessions. Vehicle, capacity, shifts and availability belong to dispatch.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateCourierRequest'}
      responses:
        '200':
          description: Contact details replaced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiResponseUserProfile'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/CourierNotFound'}
        '409': {$ref: '#/components/responses/AccountConflict'}
  /api/v1/users/couriers/{courierId}/status:
    parameters:
      - {name: courierId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [Courier accounts]
      summary: Suspend, deactivate or reactivate a courier within the caller's scope
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserStatusRequest'}
      responses:
        '200':
          description: Courier status updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiResponseUserProfile'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/CourierNotFound'}
components:
  responses:
    Unauthenticated:
      description: Valid authentication required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    Forbidden:
      description: Current role, account status or district does not permit this operation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    CourierNotFound:
      description: Courier identity not found; target must have COURIER role
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    AccountConflict:
      description: Unique account detail or one-active-dispatcher district rule conflicts with existing data
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    JwksResponse:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          description: Public RSA keys; no symmetric or private key material.
          items: {$ref: '#/components/schemas/JwkResponse'}
    JwkResponse:
      type: object
      required: [kty, use, alg, kid, n, e]
      properties:
        kty: {type: string, enum: [RSA]}
        use: {type: string, enum: [sig]}
        alg: {type: string, enum: [RS256]}
        kid: {type: string, description: Stable base64url SHA-256 fingerprint of the X.509 public key.}
        n: {type: string, description: Unsigned RSA modulus encoded as base64url without padding.}
        e: {type: string, description: Unsigned RSA exponent encoded as base64url without padding.}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 320
          description: Username or email address.
          example: customer.one
        password:
          type: string
          maxLength: 72
          format: password
          example: SwiftDrop123
    RegisterUserRequest:
      type: object
      required: [username, email, firstName, lastName, password, role, district]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9._-]{3,50}$'
          example: customer.one
        email:
          type: string
          format: email
          maxLength: 320
          example: customer.one@example.com
        phone:
          type: string
          pattern: '^$|^\+?[0-9]{7,15}$'
          example: '+94771234567'
        firstName:
          type: string
          maxLength: 100
          example: Nimal
        lastName:
          type: string
          maxLength: 100
          example: Perera
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          example: SwiftDrop123
        role:
          allOf:
            - $ref: '#/components/schemas/UserRole'
          description: Self-service registration supports CUSTOMER and MERCHANT only.
        district:
          $ref: '#/components/schemas/SriLankanDistrict'
        merchantId:
          type: 'null'
          description: Must be omitted or null. Only the trusted approval workflow may assign an association.
    CreateUserRequest:
      type: object
      description: Administrator provisioning. District is mandatory; only one ACTIVE DISPATCHER may occupy a district. Caller-chosen merchant associations are rejected.
      required: [username, email, firstName, lastName, password, role, district]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9._-]{3,50}$'
        email:
          type: string
          format: email
          maxLength: 320
        phone:
          type: string
          pattern: '^$|^\+?[0-9]{7,15}$'
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
        role:
          $ref: '#/components/schemas/UserRole'
        district:
          $ref: '#/components/schemas/SriLankanDistrict'
        merchantId:
          type: 'null'
          description: Must be omitted or null. Only the trusted approval workflow may assign an association.
    CreateCourierRequest:
      type: object
      required: [username, email, firstName, lastName, password, district]
      properties:
        username: {type: string, pattern: '^[A-Za-z0-9._-]{3,50}$'}
        email: {type: string, format: email, maxLength: 320}
        phone: {type: string, pattern: '^$|^\+?[0-9]{7,15}$', maxLength: 32}
        firstName: {type: string, maxLength: 100}
        lastName: {type: string, maxLength: 100}
        password: {type: string, minLength: 8, maxLength: 72, format: password}
        district: {$ref: '#/components/schemas/SriLankanDistrict'}
    UpdateCourierRequest:
      type: object
      required: [email, firstName, lastName]
      properties:
        email: {type: string, format: email, maxLength: 320}
        phone: {type: string, pattern: '^$|^\+?[0-9]{7,15}$', maxLength: 32, description: Omit or supply null to clear the phone number.}
        firstName: {type: string, maxLength: 100}
        lastName: {type: string, maxLength: 100}
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke.
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 72
          format: password
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          format: password
    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          example: 3600
        userId:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        district:
          $ref: '#/components/schemas/SriLankanDistrict'
    UserProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        district:
          $ref: '#/components/schemas/SriLankanDistrict'
        merchantId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/UserStatus'
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    ApiResponseUserProfile:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/UserProfileResponse'
        timestamp:
          type: string
          format: date-time
    ApiResponseVoid:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
        timestamp:
          type: string
          format: date-time
    ApiResponsePagedUsers:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/PagedUserProfileResponse'
        timestamp:
          type: string
          format: date-time
    PagedUserProfileResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserProfileResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
    ApiErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        correlationId:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        timestamp:
          type: string
          format: date-time
    UserRole:
      type: string
      enum: [CUSTOMER, MERCHANT, COURIER, DISPATCHER, SYSTEM_ADMIN]
    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, DEACTIVATED]
    SriLankanDistrict:
      type: string
      enum:
        - COLOMBO
        - GAMPAHA
        - KALUTARA
        - KANDY
        - MATALE
        - NUWARA_ELIYA
        - GALLE
        - MATARA
        - HAMBANTOTA
        - JAFFNA
        - KILINOCHCHI
        - MANNAR
        - VAVUNIYA
        - MULLAITIVU
        - BATTICALOA
        - AMPARA
        - TRINCOMALEE
        - KURUNEGALA
        - PUTTALAM
        - ANURADHAPURA
        - POLONNARUWA
        - BADULLA
        - MONARAGALA
        - RATNAPURA
        - KEGALLE

openapi: 3.1.0
info:
  title: SwiftDrop Delivery Execution API
  description: Delivery FSM lifecycle, courier transitions, and Proof-of-Delivery verification APIs.
  version: v1.0.0
servers:
  - url: /
    description: API Gateway (same origin as this Swagger UI)
security:
  - bearerAuth: []
paths:
  /api/v1/deliveries/health:
    get:
      tags:
        - DeliveryExecution
      summary: Check delivery service health
      operationId: deliveryHealth
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /api/v1/deliveries/me:
    get:
      tags:
        - DeliveryExecution
      summary: List deliveries assigned to the authenticated courier
      description: Returns today's deliveries and every unfinished one (or those for the given date) assigned to the logged-in courier, ordered by assignment time.
      operationId: getMyDeliveries
      parameters:
        - name: date
          in: query
          required: false
          description: Day to list, as yyyy-MM-dd. Defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Courier deliveries retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListDeliverySessionResponse"

  /api/v1/deliveries/{deliveryId}:
    get:
      tags:
        - DeliveryExecution
      summary: Get delivery session by UUID
      operationId: getDeliveryById
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Delivery session retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDeliverySessionResponse"
        "404":
          description: Delivery not found

  /api/v1/deliveries/order/{orderId}:
    get:
      tags:
        - DeliveryExecution
      summary: Get delivery session by order UUID
      operationId: getDeliveryByOrderId
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Delivery session retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDeliverySessionResponse"
        "404":
          description: Delivery not found

  /api/v1/deliveries/tracking/{trackingNumber}:
    get:
      tags:
        - DeliveryExecution
      summary: Get delivery session by tracking number
      operationId: getDeliveryByTrackingNumber
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delivery session retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDeliverySessionResponse"
        "404":
          description: Delivery not found

  /api/v1/deliveries/courier/{courierId}:
    get:
      tags:
        - DeliveryExecution
      summary: List delivery sessions for a courier
      operationId: getDeliveriesByCourier
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DeliveryState"
      responses:
        "200":
          description: Courier delivery sessions retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListDeliverySessionResponse"

  /api/v1/deliveries/{deliveryId}/job:
    get:
      tags:
        - CourierJob
      summary: Get the addresses, contacts and cash for a delivery
      description: >-
        For the assigned courier, a DISPATCHER of either district, or a SYSTEM_ADMIN. Shows only what the
        current leg needs: the sender and the fee until pickup, and the recipient for the courier who
        delivers. A finished or cancelled delivery gives no contacts and no amounts. Never cached.
      operationId: getCourierJob
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Delivery job retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierJobResponse"
        "401":
          description: Missing or invalid gateway identity headers
        "403":
          description: The caller does not carry this delivery, or works in another district
        "404":
          description: Delivery or order not found
        "503":
          description: The order service did not answer; try again

  /api/v1/deliveries/{deliveryId}/transition:
    post:
      tags:
        - DeliveryExecution
      summary: Transition delivery lifecycle state
      description: Advances delivery state machine according to 12-state FSM rules and guards.
      operationId: transitionDelivery
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionDeliveryRequest"
      responses:
        "200":
          description: State transition executed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDeliverySessionResponse"
        "404":
          description: Delivery session not found
        "409":
          description: Invalid state transition or guard requirement failed

  /api/v1/deliveries/{deliveryId}/proof-of-delivery:
    post:
      tags:
        - ProofOfDelivery
      summary: Upload proof-of-delivery evidence
      operationId: uploadProofOfDelivery
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProofOfDeliveryUploadRequest"
      responses:
        "201":
          description: Evidence uploaded successfully; the proof is marked verified, unlocking DELIVERED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProofOfDeliveryResponse"

    get:
      tags:
        - ProofOfDelivery
      summary: Get proof-of-delivery status for a delivery
      operationId: getProofOfDelivery
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Proof-of-delivery retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProofOfDeliveryResponse"

  /api/v1/cash/me:
    get:
      tags:
        - Cash
      summary: The signed-in courier's cash and latest handovers
      operationId: getMyCash
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCourierCashResponse"
        "401":
          description: Missing or invalid gateway identity headers
        "403":
          description: The caller's role or district does not allow this

  /api/v1/cash/handovers:
    post:
      tags:
        - Cash
      summary: Courier hands over all the cash they hold
      description: >-
        To the dispatcher of their district. Required before the courier ends their shift.
      operationId: submitHandover
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCashHandoverResponse"
        "401":
          description: Missing or invalid gateway identity headers
        "403":
          description: The caller's role or district does not allow this
        "409":
          description: No cash to hand over

  /api/v1/cash/desk:
    get:
      tags:
        - Cash
      summary: A hub's cash
      description: >-
        A DISPATCHER gets their own district (the parameter is ignored); a SYSTEM_ADMIN gets every district or the one given.
      operationId: getCashDesk
      parameters:
        - name: district
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SriLankanDistrict"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCashDeskResponse"
        "401":
          description: Missing or invalid gateway identity headers
        "403":
          description: The caller's role or district does not allow this

  /api/v1/cash/report:
    get:
      tags:
        - Cash
      summary: Revenue and cash for 1 to 90 inclusive Colombo dates
      description: >-
        A DISPATCHER gets their own district (the parameter is ignored); a SYSTEM_ADMIN gets every district or the one given.
      operationId: getCashReport
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: district
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SriLankanDistrict"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCashReportResponse"
        "400":
          description: Missing or invalid dates
        "401":
          description: Missing or invalid gateway identity headers
        "403":
          description: The caller's role or district does not allow this

  /api/v1/cash/handovers/{handoverId}/entries:
    get:
      tags:
        - Cash
      summary: The parcels a handover came from
      operationId: getHandoverEntries
      parameters:
        - name: handoverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListCashEntryResponse"
        "401":
          description: Missing or invalid gateway identity headers
        "403":
          description: The caller's role or district does not allow this
        "404":
          description: Handover not found

  /api/v1/cash/handovers/{handoverId}/count:
    post:
      tags:
        - Cash
      summary: Dispatcher counts a handover
      description: >-
        Only the DISPATCHER of that district. A different amount needs a note.
      operationId: countHandover
      parameters:
        - name: handoverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountHandoverRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCashHandoverResponse"
        "401":
          description: Missing or invalid gateway identity headers
        "403":
          description: The caller's role or district does not allow this
        "404":
          description: Handover not found
        "409":
          description: Already counted, or a different amount without a note

  /api/v1/cash/deposits:
    post:
      tags:
        - Cash
      summary: Dispatcher banks all the cash at their hub
      operationId: createDeposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepositRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCashDepositResponse"
        "401":
          description: Missing or invalid gateway identity headers
        "403":
          description: The caller's role or district does not allow this
        "409":
          description: No cash at the hub, or it changed since it was shown

  /api/v1/cash/deposits/{depositId}/confirm:
    post:
      tags:
        - Cash
      summary: SYSTEM_ADMIN confirms a deposit reached the bank
      operationId: confirmDeposit
      parameters:
        - name: depositId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCashDepositResponse"
        "401":
          description: Missing or invalid gateway identity headers
        "403":
          description: The caller's role or district does not allow this
        "404":
          description: Deposit not found
        "409":
          description: Already reviewed

  /api/v1/cash/deposits/{depositId}/reject:
    post:
      tags:
        - Cash
      summary: SYSTEM_ADMIN rejects a deposit
      description: >-
        Its cash goes back to the hub.
      operationId: rejectDeposit
      parameters:
        - name: depositId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectDepositRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCashDepositResponse"
        "401":
          description: Missing or invalid gateway identity headers
        "403":
          description: The caller's role or district does not allow this
        "404":
          description: Deposit not found
        "409":
          description: Already reviewed

  /api/v1/cash/refunds:
    post:
      tags:
        - Cash
      summary: Dispatcher refunds a delivery fee from the hub's cash
      description: >-
        Only for a delivery that failed because SwiftDrop lost or damaged the parcel, and only by the DISPATCHER of the district that collected the fee.
      operationId: refundFee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundFeeRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCashEntryResponse"
        "401":
          description: Missing or invalid gateway identity headers
        "403":
          description: The caller's role or district does not allow this
        "404":
          description: No such parcel, or this district collected no fee for it
        "409":
          description: Not refundable, already refunded, or not enough cash at the hub

  /api/v1/deliveries/shops/{merchantId}:
    get:
      tags:
        - ShopStop
      summary: The shop's parcels this courier collects, with the address, contact and fees
      operationId: getShopStop
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseShopStopResponse"
        "401":
          description: Missing or invalid gateway identity headers
        "403":
          description: The caller's role does not allow this

  /api/v1/deliveries/shops/{merchantId}/collect:
    post:
      tags:
        - ShopStop
      summary: Pick up the chosen parcels and confirm one payment for them
      description: >-
        All of them, or none. The amount must be exactly their fees; parcels left out stay for later.
      operationId: collectShop
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectShopRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCollectShopResponse"
        "401":
          description: Missing or invalid gateway identity headers
        "403":
          description: The caller's role does not allow this
        "409":
          description: A different amount, a cancelled parcel, or one that is no longer the courier's

  /api/v1/cash/payments:
    get:
      tags:
        - Cash
      summary: The signed-in merchant's payments, newest first, 20 a page
      operationId: getMerchantPayments
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListMerchantPaymentResponse"
        "401":
          description: Missing or invalid gateway identity headers
        "403":
          description: The caller's role does not allow this

  /api/v1/cash/payments/{paymentId}/entries:
    get:
      tags:
        - Cash
      summary: The parcels a payment was for
      description: >-
        Only the merchant who paid it.
      operationId: getMerchantPaymentEntries
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListCashEntryResponse"
        "401":
          description: Missing or invalid gateway identity headers
        "403":
          description: The caller's role does not allow this
        "404":
          description: Payment not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DeliveryState:
      type: string
      description: >-
        Same district: PICKED_UP -> IN_TRANSIT -> OUT_FOR_DELIVERY. Different districts go through both
        hubs: PICKED_UP -> AT_ORIGIN_HUB (the first courier hands it in) -> IN_TRANSIT (the pickup
        district's dispatcher marks it Outbound) -> AT_DESTINATION_HUB (the drop-off district's
        dispatcher accepts it) -> OUT_FOR_DELIVERY (a courier of the drop-off district collects it).
      enum:
        - CREATED
        - ASSIGNED
        - PICKED_UP
        - AT_ORIGIN_HUB
        - IN_TRANSIT
        - AT_DESTINATION_HUB
        - OUT_FOR_DELIVERY
        - DELIVERED
        - FAILED
        - CANCELLED

    DeliveryFailureReason:
      type: string
      enum:
        - RECIPIENT_UNAVAILABLE
        - INCORRECT_ADDRESS
        - ACCESS_RESTRICTED
        - RECIPIENT_REJECTED
        - DAMAGED_IN_TRANSIT
        - ADVERSE_WEATHER
        - PAYMENT_FAILED
        - OTHER

    SriLankanDistrict:
      type: string
      enum:
        - COLOMBO
        - GAMPAHA
        - KALUTARA
        - KANDY
        - MATALE
        - NUWARA_ELIYA
        - GALLE
        - MATARA
        - HAMBANTOTA
        - JAFFNA
        - KILINOCHCHI
        - MANNAR
        - VAVUNIYA
        - MULLAITIVU
        - BATTICALOA
        - AMPARA
        - TRINCOMALEE
        - KURUNEGALA
        - PUTTALAM
        - ANURADHAPURA
        - POLONNARUWA
        - BADULLA
        - MONARAGALA
        - RATNAPURA
        - KEGALLE

    TransitionDeliveryRequest:
      type: object
      required:
        - targetState
      properties:
        targetState:
          $ref: "#/components/schemas/DeliveryState"
        notes:
          type: string
        failureReason:
          $ref: "#/components/schemas/DeliveryFailureReason"
        actorRole:
          type: string
        cashCollected:
          type: number
          description: >-
            The delivery fee the courier confirms collecting from the sender with PICKED_UP. Must match the fee,
            or the answer is 409; leave out for other steps and when nothing is due.
          example: 670.00

    ProofOfDeliveryUploadRequest:
      type: object
      required:
        - photoUrl
        - recipientSignature
      properties:
        photoUrl:
          type: string
        recipientSignature:
          type: string

    ProofOfDeliveryResponse:
      type: object
      properties:
        id:
          type: integer
        deliveryId:
          type: string
          format: uuid
        verified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time

    DeliverySessionResponse:
      type: object
      properties:
        deliveryId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        trackingNumber:
          type: string
        courierId:
          type: string
          format: uuid
        courierName:
          type: string
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        currentState:
          $ref: "#/components/schemas/DeliveryState"
        previousState:
          $ref: "#/components/schemas/DeliveryState"
        failedReason:
          type: string
        attemptCount:
          type: integer
        pickupAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        merchantId:
          type: [string, "null"]
          format: uuid
          description: The shop that sent it, so its parcels are collected together.
        merchantName:
          type: [string, "null"]

    CourierJobStop:
      type: object
      description: A contact and address the courier visits.
      properties:
        name:
          type: string
        phone:
          type: string
          example: "+94771234567"
        alternatePhone:
          type: [string, "null"]
        addressLine1:
          type: string
        addressLine2:
          type: [string, "null"]
        city:
          type: string
        postalCode:
          type: string
        district:
          $ref: "#/components/schemas/SriLankanDistrict"

    CourierJobResponse:
      type: object
      description: >-
        What the courier needs on the leg they are carrying. Stops and amounts that belong to another leg,
        or to a finished or cancelled delivery, are null.
      required:
        - deliveryId
        - cancelled
      properties:
        deliveryId:
          type: string
          format: uuid
        cancelled:
          type: boolean
          description: The order was cancelled, so nothing is to be picked up or collected.
        speed:
          type: string
          enum: [STANDARD, EXPRESS, SAME_DAY]
        pickup:
          oneOf:
            - $ref: "#/components/schemas/CourierJobStop"
            - type: "null"
        dropOff:
          oneOf:
            - $ref: "#/components/schemas/CourierJobStop"
            - type: "null"
        notes:
          type: [string, "null"]
        itemDescription:
          type: [string, "null"]
        lengthCm:
          type: [number, "null"]
        widthCm:
          type: [number, "null"]
        heightCm:
          type: [number, "null"]
        weightKg:
          type: [number, "null"]
        feeToCollect:
          type: [number, "null"]
          description: Delivery fee to collect in cash from the sender, until the parcel is picked up.
          example: 670.00
        currency:
          type: string
          example: LKR

    ApiResponseCourierJobResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/CourierJobResponse"
        timestamp:
          type: string
          format: date-time

    CashEntryResponse:
      type: object
      description: A delivery fee collected or refunded for one parcel.
      required:
        - entryId
        - entryType
        - trackingNumber
        - amount
        - currency
        - recordedAt
      properties:
        entryId:
          type: string
          format: uuid
        entryType:
          type: string
          enum: [COLLECTION, REFUND]
        trackingNumber:
          type: string
        amount:
          type: number
          example: 670.00
        currency:
          type: string
          example: LKR
        note:
          type: [string, "null"]
        recordedAt:
          type: string
          format: date-time

    CashHandoverResponse:
      type: object
      description: Cash a courier handed to their dispatcher.
      required:
        - handoverId
        - courierId
        - district
        - expectedAmount
        - currency
        - status
        - submittedAt
      properties:
        handoverId:
          type: string
          format: uuid
        courierId:
          type: string
          format: uuid
        courierName:
          type: [string, "null"]
        district:
          $ref: "#/components/schemas/SriLankanDistrict"
        expectedAmount:
          type: number
          example: 670.00
        countedAmount:
          type: [number, "null"]
        difference:
          type: [number, "null"]
          description: Counted minus expected. Negative is a shortage, positive an excess.
        currency:
          type: string
          example: LKR
        status:
          type: string
          enum: [SUBMITTED, COUNTED]
        note:
          type: [string, "null"]
        submittedAt:
          type: string
          format: date-time
        countedAt:
          type: [string, "null"]
          format: date-time
        depositId:
          type: [string, "null"]
          format: uuid

    CashDepositResponse:
      type: object
      description: Cash a hub banked.
      required:
        - depositId
        - district
        - amount
        - currency
        - reference
        - status
        - depositedAt
      properties:
        depositId:
          type: string
          format: uuid
        district:
          $ref: "#/components/schemas/SriLankanDistrict"
        amount:
          type: number
          example: 670.00
        currency:
          type: string
          example: LKR
        reference:
          type: string
          example: BOC-884213
        status:
          type: string
          enum: [SUBMITTED, CONFIRMED, REJECTED]
        depositedAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, "null"]
          format: date-time
        reviewNote:
          type: [string, "null"]

    CashHoldingResponse:
      type: object
      description: A courier who holds cash they have not handed over yet.
      required:
        - courierId
        - amount
        - parcels
        - since
      properties:
        courierId:
          type: string
          format: uuid
        courierName:
          type: [string, "null"]
        amount:
          type: number
          example: 670.00
        parcels:
          type: integer
        since:
          type: string
          format: date-time

    CourierCashResponse:
      type: object
      description: The signed-in courier's cash.
      required:
        - inHand
        - currency
        - entries
        - handovers
      properties:
        inHand:
          type: number
          example: 670.00
        currency:
          type: string
          example: LKR
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CashEntryResponse"
        handovers:
          type: array
          items:
            $ref: "#/components/schemas/CashHandoverResponse"

    CashDeskResponse:
      type: object
      description: A hub's cash.
      required:
        - currency
        - withCouriers
        - toCount
        - atHub
        - refunds
        - hubCash
        - deposits
      properties:
        district:
          oneOf:
            - $ref: "#/components/schemas/SriLankanDistrict"
            - type: "null"
        currency:
          type: string
          example: LKR
        withCouriers:
          type: array
          items:
            $ref: "#/components/schemas/CashHoldingResponse"
        toCount:
          type: array
          items:
            $ref: "#/components/schemas/CashHandoverResponse"
        atHub:
          type: array
          items:
            $ref: "#/components/schemas/CashHandoverResponse"
        refunds:
          type: array
          items:
            $ref: "#/components/schemas/CashEntryResponse"
        hubCash:
          type: number
          example: 670.00
        deposits:
          type: array
          items:
            $ref: "#/components/schemas/CashDepositResponse"

    CashReportDay:
      type: object
      required:
        - date
        - revenue
        - parcels
      properties:
        date:
          type: string
          format: date
        revenue:
          type: number
        parcels:
          type: integer

    CashReportDistrict:
      type: object
      required:
        - district
        - revenue
        - parcels
        - lastMileDelivered
      properties:
        district:
          $ref: "#/components/schemas/SriLankanDistrict"
        revenue:
          type: number
        parcels:
          type: integer
        lastMileDelivered:
          type: integer
          description: Parcels from other districts delivered here.

    CashReportResponse:
      type: object
      description: Revenue and cash for a period, read from the cash ledger.
      required:
        - from
        - to
        - currency
        - revenue
        - refunds
        - parcels
        - shortage
        - excess
        - withCouriers
        - toCount
        - atHub
        - toConfirm
        - days
        - districts
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        currency:
          type: string
          example: LKR
        revenue:
          type: number
          description: Delivery fees collected minus refunds, under the pickup district.
        refunds:
          type: number
        parcels:
          type: integer
        shortage:
          type: number
        excess:
          type: number
        withCouriers:
          type: number
          description: Now, with couriers and not handed over.
        toCount:
          type: number
          description: Now, handed over but not counted.
        atHub:
          type: number
          description: Now, counted at the hub and not banked.
        toConfirm:
          type: number
          description: Now, banked and waiting for an admin.
        days:
          type: array
          items:
            $ref: "#/components/schemas/CashReportDay"
        districts:
          type: array
          items:
            $ref: "#/components/schemas/CashReportDistrict"

    ApiResponseCashReportResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/CashReportResponse"
        timestamp:
          type: string
          format: date-time

    CountHandoverRequest:
      type: object
      required:

openapi: 3.1.0
info:
  title: SwiftDrop Analytics and AI API
  description: Operational KPI tracking, courier telemetry analytics, and AI delivery assistant APIs.
  version: v1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/ai/mcp:
    post:
      tags: [DeliveryMcp]
      operationId: deliveryMcp
      summary: Customer-only stateless MCP Streamable HTTP tools
      description: MCP protocol 2025-03-26. Supports initialize, ping, tools/list and tools/call. Uses JSON-RPC envelopes instead of ApiResponse. Native clients only; all Origin headers are rejected. Send a customer Bearer token through the gateway. Tool calls share the chat ten-request per-minute per-user budget and reuse ownership checks, safe output, argument validation and durable audits. No session IDs or server-initiated streams. Notifications return 202 without a body.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, const: '2.0' }
                id: { type: [string, integer] }
                method: { type: string }
                params: { type: object, additionalProperties: true }
      responses:
        "200":
          description: JSON-RPC result or protocol error (-32700 parse error, -32600 invalid request, -32601 unknown method, -32602 invalid params); tool failures have result.isError true
          content:
            application/json:
              schema:
                type: object
                required: [jsonrpc, id]
                properties:
                  jsonrpc: { type: string, const: '2.0' }
                  id: { type: [string, integer, 'null'] }
                  result: { type: object, additionalProperties: true }
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: integer }
                      message: { type: string }
        "202": { description: Notification accepted }
        "401": { $ref: '#/components/responses/Unauthenticated' }
        "403": { description: Customer role required or browser Origin rejected }
        "429": { description: Shared assistant request limit reached }
        "500": { description: Tool audit could not be persisted }
        "503": { description: Rate limiter capacity reached }
    get:
      tags: [DeliveryMcp]
      operationId: deliveryMcpStream
      summary: No server-initiated SSE stream is offered
      security: [{ bearerAuth: [] }]
      responses:
        "405": { description: Use POST; server-initiated SSE is not supported }
        "401": { $ref: '#/components/responses/Unauthenticated' }
        "403": { description: Customer role required or browser Origin rejected }
  /api/v1/ai/chat:
    post:
      tags: [DeliveryChat]
      operationId: deliveryAssistantChat
      summary: Customer-only tracking and pricing chat with at most three tool calls
      description: Requires CUSTOMER role. Tracking first verifies order ownership through the protected order API, then selects public-safe fields. Other customers' parcels and unknown parcels produce the same unavailable-to-you answer. Ten messages per minute per user per service instance. Conversations expire after 30 minutes of inactivity and are lost on restart. Unknown and foreign conversation IDs both return 404. Estimates use STANDARD speed and actual weight only.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiChatRequest' }
      responses:
        "200":
          description: Assistant reply and safe tool execution labels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseAiChat' }
        "400": { description: Invalid message or conversation UUID }
        "401": { $ref: '#/components/responses/Unauthenticated' }
        "403": { description: Chat requires CUSTOMER role }
        "404": { description: Conversation not found or expired }
        "429": { description: Ten-message per-minute limit reached; retry in 60 seconds }
        "503": { description: Model provider unavailable or conversation capacity reached }
  /api/v1/analytics/deliveries/daily:
    get:
      tags: [AnalyticsReports]
      operationId: dailyDeliveryReport
      summary: Daily event-time counts for DISPATCHER or SYSTEM_ADMIN
      description: Inclusive Asia/Colombo dates, maximum 90 days. Every requested date is returned, with zero counts for missing days. Creations and outcomes use their respective occurrence dates.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        "200":
          description: Zero-filled daily counts, sorted by date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseDailyDeliveryReport' }
        "400": { $ref: '#/components/responses/InvalidReportRequest' }
        "401": { $ref: '#/components/responses/Unauthenticated' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ReportFailure' }

  /api/v1/analytics/success-rate:
    get:
      tags: [AnalyticsReports]
      operationId: deliverySuccessRate
      summary: Weighted delivery outcome rates for DISPATCHER or SYSTEM_ADMIN
      description: Inclusive Asia/Colombo dates, maximum 90 days. Percentages use summed outcomes and HALF_UP rounding to two decimals. Cancellations and returns are excluded. Both rates are explicitly null when there are no completed outcomes.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        "200":
          description: Delivered and failed counts and rates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseDeliverySuccessRate' }
        "400": { $ref: '#/components/responses/InvalidReportRequest' }
        "401": { $ref: '#/components/responses/Unauthenticated' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ReportFailure' }

  /api/v1/analytics/couriers/workload:
    get:
      tags: [AnalyticsReports]
      operationId: courierWorkloadReport
      summary: Current projected courier workload for DISPATCHER or SYSTEM_ADMIN
      description: Known couriers sorted by ID, including zero-workload couriers. No date filters. Empty storage returns zero total and an empty list. Read time does not guarantee broker completeness or online availability.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current active orders across known couriers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseCourierWorkloadReport' }
        "401": { $ref: '#/components/responses/Unauthenticated' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ReportFailure' }

  /api/v1/analytics/health:
    get:
      tags: [OperationalKpi]
      summary: Health check endpoint for operational analytics
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseString'

  /api/v1/analytics/kpis:
    get:
      tags: [OperationalKpi]
      summary: Retrieve system-wide and district-level operational KPIs
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Operational KPI summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOperationalKpiSummary'

  /api/v1/analytics/couriers:
    get:
      tags: [OperationalKpi]
      summary: List courier performance analytics across districts
      security: [{ bearerAuth: [] }]
      parameters:
        - name: district
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of courier performance metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCourierPerformanceList'

  /api/v1/analytics/couriers/{courierId}:
    get:
      tags: [OperationalKpi]
      summary: Get performance analytics for a specific courier
      security: [{ bearerAuth: [] }]
      parameters:
        - name: courierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Courier performance response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCourierPerformance'
        "404":
          description: Courier not found

  /api/v1/analytics/snapshots/aggregate:
    post:
      tags: [OperationalKpi]
      summary: Read current persisted analytics projections
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current event-projected operational KPIs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOperationalKpiSummary'

  /api/v1/analytics/ai/health:
    get:
      tags: [AiDeliveryAssistant]
      summary: Health check endpoint for AI assistant service
      responses:
        "200":
          description: AI assistant health response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseString'

  /api/v1/analytics/ai/predict-delay:
    post:
      tags: [AiDeliveryAssistant]
      summary: Calculate predictive delay risk score and operational mitigation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelayRiskPredictionRequest'
      responses:
        "200":
          description: Delay risk prediction response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDelayRiskPrediction'

  /api/v1/analytics/ai/reroute-suggestions:
    post:
      tags: [AiDeliveryAssistant]
      summary: Generate dynamic transit reroute suggestions for delayed parcels
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnomalyRerouteRequest'
      responses:
        "200":
          description: Anomaly reroute response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAnomalyReroute'

  /api/v1/analytics/ai/agent-query:
    post:
      tags: [AiDeliveryAssistant]
      summary: Customer-only compatibility endpoint for order assistant chat
      description: Requires CUSTOMER role and uses the same safe chat flow and order ownership checks. callerPersona is ignored for authorization. Starts a new ephemeral conversation. confidence is 0 (not a calibrated probability); route optimization is outside this chat scope.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantQueryRequest'
      responses:
        "200":
          description: Agent query response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAssistantQuery'
        "403": { description: Chat requires CUSTOMER role }

  /api/v1/analytics/ai/audits:
    get:
      tags: [AiDeliveryAssistant]
      summary: Retrieve recent AI tool execution audit logs for compliance
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of AI audit logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAiAuditList'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Gateway validates JWT and replaces caller identity headers. Downstream ports must remain internal.
  parameters:
    FromDate:
      name: from
      in: query
      required: true
      description: First included Asia/Colombo date; range must contain 1 to 90 inclusive days.
      schema: { type: string, format: date }
    ToDate:
      name: to
      in: query
      required: true
      description: Last included Asia/Colombo date; must be on or after from.
      schema: { type: string, format: date }
  responses:
    InvalidReportRequest:
      description: Missing or invalid ISO date, reversed range, or more than 90 inclusive days
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    Unauthenticated:
      description: Missing or invalid gateway authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    Forbidden:
      description: Verified role is neither DISPATCHER nor SYSTEM_ADMIN
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    ReportFailure:
      description: Unexpected service failure; internal details are not exposed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
  schemas:
    AiChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
        conversationId: { type: string, format: uuid }
    AiToolUse:
      type: object
      required: [name, outcome]
      properties:
        name: { type: string, enum: [track_parcel, calculate_estimate, DISALLOWED_TOOL] }
        outcome: { type: string, enum: [OK, INVALID_ARGUMENTS, NOT_FOUND, UNAVAILABLE, REFUSED, LIMIT_REACHED] }
    AiChatResponse:
      type: object
      required: [reply, conversationId, toolCalls]
      properties:
        reply: { type: string }
        conversationId: { type: string, format: uuid }
        toolCalls:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/AiToolUse' }
    ApiResponseAiChat:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/AiChatResponse' }
        timestamp: { type: string, format: date-time }
    ApiErrorResponse:
      type: object
      required: [status, error, message, path, timestamp]
      properties:
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }
        correlationId: { type: string }
        timestamp: { type: string, format: date-time }
    DailyDeliveryReportResponse:
      type: object
      required: [from, to, timezone, days]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        timezone: { type: string, const: Asia/Colombo }
        days:
          type: array
          items:
            type: object
            required: [date, created, delivered, failed]
            properties:
              date: { type: string, format: date }
              created: { type: integer, format: int64, minimum: 0 }
              delivered: { type: integer, format: int64, minimum: 0 }
              failed: { type: integer, format: int64, minimum: 0 }
    DeliverySuccessRateResponse:
      type: object
      required: [from, to, timezone, delivered, failed, completed, successRatePercent, failureRatePercent]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        timezone: { type: string, const: Asia/Colombo }
        delivered: { type: integer, format: int64, minimum: 0 }
        failed: { type: integer, format: int64, minimum: 0 }
        completed: { type: integer, format: int64, minimum: 0 }
        successRatePercent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        failureRatePercent: { type: [number, 'null'], minimum: 0, maximum: 100 }
    CourierWorkloadReportResponse:
      type: object
      required: [asOf, totalActiveOrders, couriers]
      properties:
        asOf: { type: string, format: date-time }
        totalActiveOrders: { type: integer, format: int64, minimum: 0 }
        couriers:
          type: array
          items:
            type: object
            required: [courierId, activeOrders]
            properties:
              courierId: { type: string, format: uuid }
              activeOrders: { type: integer, format: int64, minimum: 0 }
    ApiResponseDailyDeliveryReport:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/DailyDeliveryReportResponse' }
        timestamp: { type: string, format: date-time }
    ApiResponseDeliverySuccessRate:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/DeliverySuccessRateResponse' }
        timestamp: { type: string, format: date-time }
    ApiResponseCourierWorkloadReport:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/CourierWorkloadReportResponse' }
        timestamp: { type: string, format: date-time }
    ApiResponseString:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { type: string }
        timestamp: { type: string, format: date-time }

    DistrictKpiResponse:
      type: object
      properties:
        district: { type: string }
        totalParcels: { type: integer, description: 'Distinct orders created today in Asia/Colombo' }
        deliveredOnTime: { type: [integer, 'null'], deprecated: true, description: 'Unavailable without an SLA deadline contract' }
        breachedSla: { type: [integer, 'null'], deprecated: true, description: 'Unavailable without an SLA deadline contract' }
        failedDeliveries: { type: integer }
        onTimeRate: { type: [number, 'null'], deprecated: true }
        avgTransitMinutes: { type: [number, 'null'], deprecated: true, description: 'Measured transit interval unavailable' }

    OperationalKpiSummaryResponse:
      type: object
      properties:
        totalParcels: { type: integer, description: 'Distinct orders created today in Asia/Colombo' }
        deliveredOnTime: { type: [integer, 'null'], deprecated: true, description: 'Unavailable without an SLA deadline contract' }
        breachedSla: { type: [integer, 'null'], deprecated: true, description: 'Unavailable without an SLA deadline contract' }
        failedDeliveries: { type: integer }
        systemOnTimeRate: { type: [number, 'null'], deprecated: true, description: 'Unavailable without measured SLA deadlines' }
        avgTransitMinutes: { type: [number, 'null'], deprecated: true, description: 'Measured transit interval unavailable' }
        activeCouriers: { type: integer, description: 'Known couriers with current nonterminal work' }
        districtBreakdowns:
          type: array
          items:
            $ref: '#/components/schemas/DistrictKpiResponse'

    ApiResponseOperationalKpiSummary:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/OperationalKpiSummaryResponse' }
        timestamp: { type: string, format: date-time }

    CourierPerformanceResponse:
      type: object
      properties:
        courierId: { type: string, format: uuid }
        courierName: { type: string }
        currentDistrict: { type: [string, 'null'], description: 'Latest observed parcel district; not registered operating district' }
        totalAssigned: { type: integer }
        deliveredCount: { type: integer }
        failedCount: { type: integer }
        avgTransitMinutes: { type: [number, 'null'], deprecated: true, description: 'Measured transit interval unavailable' }
        onTimePercentage: { type: [number, 'null'], deprecated: true }
        customerRating: { type: [number, 'null'], deprecated: true, description: 'Rating events unavailable' }
        status: { type: string }
        lastEventAt: { type: string, format: date-time }

    ApiResponseCourierPerformance:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/CourierPerformanceResponse' }
        timestamp: { type: string, format: date-time }

    ApiResponseCourierPerformanceList:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/CourierPerformanceResponse'
        timestamp: { type: string, format: date-time }

    DelayRiskPredictionRequest:
      type: object
      required: [originDistrict, destinationDistrict]
      properties:
        originDistrict: { type: string }
        destinationDistrict: { type: string }
        deliverySpeed: { type: string }
        weatherCondition: { type: string }
        trafficCongestion: { type: string }

    DelayRiskPredictionResponse:
      type: object
      properties:
        insightId: { type: string, format: uuid }
        originDistrict: { type: string }
        destinationDistrict: { type: string }
        deliverySpeed: { type: string }
        riskLevel: { type: string }
        riskScore: { type: number }
        predictedDelayMinutes: { type: integer }
        recommendedAction: { type: string }
        reasoning: { type: string }
        weatherOrTrafficFactor: { type: string }

    ApiResponseDelayRiskPrediction:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/DelayRiskPredictionResponse' }
        timestamp: { type: string, format: date-time }

    AnomalyRerouteRequest:
      type: object
      required: [trackingNumber, currentDistrict, destinationDistrict]
      properties:
        trackingNumber: { type: string }
        currentDistrict: { type: string }
        destinationDistrict: { type: string }
        delayMinutes: { type: integer }
        anomalyReason: { type: string }

    AnomalyRerouteResponse:
      type: object
      properties:
        trackingNumber: { type: string }
        suggestedTransitHub: { type: string }
        recommendedSpeed: { type: string }
        priorityScore: { type: integer }
        suggestedSteps:
          type: array
          items: { type: string }
        rationale: { type: string }

    ApiResponseAnomalyReroute:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/AnomalyRerouteResponse' }
        timestamp: { type: string, format: date-time }

    AssistantQueryRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 1800 }
        callerPersona: { type: string, maxLength: 64, description: Ignored for authorization }
        contextTrackingNumber: { type: string, maxLength: 64 }

    AssistantQueryResponse:
      type: object
      properties:
        answer: { type: string }
        detectedIntent: { type: string }
        confidence: { type: number, description: Deprecated compatibility field; always 0 }
        suggestedActions:
          type: array
          items: { type: string }
        toolInvocations:
          type: array
          items: { type: string }

    ApiResponseAssistantQuery:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/AssistantQueryResponse' }
        timestamp: { type: string, format: date-time }

    AiAuditResponse:
      type: object
      properties:
        auditId: { type: string, format: uuid }
        toolName: { type: string }
        callerPersona: { type: string }
        promptOrQuery: { type: 'null', description: Deprecated field; no raw prompts are stored }
        outputResult: { type: [string, 'null'], description: Safe outcome code only }
        executionTimeMs: { type: integer }
        success: { type: boolean }
        createdAt: { type: string, format: date-time }

    ApiResponseAiAuditList:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/AiAuditResponse'
        timestamp: { type: string, format: date-time }

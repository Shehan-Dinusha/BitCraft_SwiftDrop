openapi: 3.1.0
info:
  title: SwiftDrop Webhook Resiliency API
  description: |
    Webhook subscriptions, scheduled delivery retries, HMAC-SHA256 signatures, and failed-delivery replay APIs.
    The legacy dead-letter API (/api/v1/webhooks/dlq) is read-only history; its replay operations answer 410 Gone.

    Authentication and authorization: every operation except the health checks requires a Bearer JWT, verified by
    the API gateway. The gateway removes any client-supplied X-User-Id, X-User-Role, X-Merchant-Id and
    X-District-Id headers and re-injects them from the verified token; the service derives the caller from those
    headers only (never from request parameters). The merchant identity is the token's merchantId claim, which is
    distinct from the user id. The service must be reachable only through the gateway.

    Roles:
    - MERCHANT: manages only its own merchant's endpoints, failed deliveries and legacy dead-letter records.
    - SYSTEM_ADMIN: all operations for every merchant.
    - Other roles (including DISPATCHER): 403.

    Another merchant's endpoint or dead-letter record returns 404, indistinguishable from an unknown ID.

    ## Verifying outbound webhook requests (signature contract)

    Every webhook SwiftDrop sends to a merchant endpoint is an HTTPS POST with a JSON body, signed with the
    endpoint's signing secret. The secret is shown once, when the endpoint is registered. Requests carry:

    - `X-SwiftDrop-Signature: sha256=<64 lowercase hex characters>`
    - `X-SwiftDrop-Timestamp: <Unix time in whole seconds>`
    - `X-SwiftDrop-Event-Id` (stable per event; use it to ignore duplicates), `X-SwiftDrop-Delivery-Id` (stable
      across retries of one delivery), `X-SwiftDrop-Event` (event type), `X-SwiftDrop-Attempt`, and
      `User-Agent: SwiftDrop-Webhooks/1`.

    Signature: `HMAC-SHA256(key, signedBytes)`, hex-encoded in lowercase, where
    - `key` = the UTF-8 bytes of the whole secret string exactly as shown at registration (including its `whsec_` prefix);
    - `signedBytes` = the ASCII bytes of the timestamp header value, then one `.` byte, then the **raw request body
      bytes exactly as received**. Do not parse and re-serialise the JSON before verifying: any change in spacing,
      field order or number formatting invalidates the signature.

    To verify a request:
    1. Read `X-SwiftDrop-Timestamp`. Reject the request if it is missing, not an integer, or more than 5 minutes
       away from your current time (older or in the future).
    2. Build `timestamp + "." + rawBody` as bytes.
    3. Compute HMAC-SHA256 over those bytes with your endpoint secret as the key, and hex-encode it in lowercase.
    4. Remove the `sha256=` prefix from `X-SwiftDrop-Signature` (reject other prefixes) and compare the two hex
       strings with a constant-time comparison function.
    5. Reject the request (for example with 401) on any mismatch; otherwise process it, de-duplicating by
       `X-SwiftDrop-Event-Id`.

    Pseudocode (placeholder values; never commit a real secret):

        expected = hex(hmac_sha256(utf8(SECRET), ascii(timestampHeader + ".") + rawBodyBytes))
        valid    = abs(now_unix_seconds - int(timestampHeader)) <= 300
                   and signatureHeader starts with "sha256="
                   and constant_time_equals(expected, signatureHeader without "sha256=")

    ## Delivery behaviour

    - Events: `order.created`, and `parcel.status.changed` when the public status changes (never for a step
      inside the same status). A status can move back, for example `OUT_FOR_DELIVERY` to `IN_TRANSIT` when the
      courier brings the parcel back to the hub. Test pings are `webhook.test.ping`: one request, never retried,
      never listed as a failed delivery.
    - Answer with any 2xx within 5 seconds. No answer, a connection failure, 408, 425, 429 or 5xx is retried after
      about 30 seconds, 2 minutes and 10 minutes (±20 %), 4 attempts in all; a `Retry-After` on 429 or 503 can
      lengthen a wait up to 10 minutes. 3xx (redirects are not followed) and other 4xx stop at once. A delivery
      that stops is listed under `/api/v1/webhooks/deliveries/failed`.
    - A parcel's events are sent one at a time, oldest first, per endpoint. A replay, or an event received late,
      can arrive after a newer one: compare `occurredAt` and keep the latest status.
    - A replay is a new delivery of the same event: same `X-SwiftDrop-Event-Id`, new `X-SwiftDrop-Delivery-Id`,
      attempts counted from 1. One replay per failed delivery can be active; a delivered replay cannot be repeated.
    - A paused endpoint receives nothing; its events are kept and sent after it is activated again.
  version: v1.0.0
servers:
  - url: /
    description: API Gateway (same origin as this Swagger UI)
security:
  - bearerAuth: []
paths:
  /api/v1/webhooks/subscriptions/health:
    get:
      tags: [WebhookSubscription]
      summary: Health check for webhook subscription controller
      security: []
      responses:
        "200":
          description: OK
  /api/v1/webhooks/subscriptions:
    get:
      tags: [WebhookSubscription]
      summary: List webhook endpoints
      description: >-
        A MERCHANT receives only its own endpoints; a merchantId other than its own is refused with 403.
        A SYSTEM_ADMIN may filter by merchantId or omit it to list every endpoint.
      parameters:
        - name: merchantId
          in: query
          required: false
          description: Merchant filter for SYSTEM_ADMIN. Merchant clients should omit it.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of registered webhook endpoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListWebhookEndpointResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [WebhookSubscription]
      summary: Register a new webhook subscription endpoint
      description: >-
        A MERCHANT registers under the merchantId of its token; merchantId may be omitted and any other value is
        refused with 403. A SYSTEM_ADMIN must supply merchantId (400 otherwise). Other roles: 403.
        The response is the only place the generated signing secret is ever returned; GET and list never
        include it. The target URL must pass the destination (SSRF) policy described on targetUrl; otherwise
        400 "Invalid Webhook URL" with a fixed, non-revealing message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookEndpointRequest"
      responses:
        "201":
          description: Webhook endpoint successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWebhookEndpointCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/webhooks/subscriptions/{endpointId}:
    get:
      tags: [WebhookSubscription]
      summary: Get webhook endpoint details by ID
      description: Another merchant's endpoint returns 404, exactly like an unknown ID.
      parameters:
        - name: endpointId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Webhook endpoint details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWebhookEndpointResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [WebhookSubscription]
      summary: Delete a webhook endpoint subscription
      parameters:
        - name: endpointId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Endpoint deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/webhooks/subscriptions/{endpointId}/status:
    patch:
      tags: [WebhookSubscription]
      summary: Toggle active status for a webhook endpoint
      description: >-
        active=false pauses the endpoint: nothing is sent to it, and events that arrive meanwhile are kept and sent
        after it is activated again (active=true).
      parameters:
        - name: endpointId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: Webhook endpoint status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWebhookEndpointResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/webhooks/subscriptions/{endpointId}/test:
    post:
      tags: [WebhookSubscription]
      summary: Dispatch a test ping to the webhook endpoint
      description: >-
        One POST of event `webhook.test.ping`, with the same envelope, headers and signature as a real event and
        no retry. Returns the HTTP status, failure classification and latency; the endpoint's
        response body is never returned.
      parameters:
        - name: endpointId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ping delivery attempt result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWebhookDeliveryAttemptResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/webhooks/subscriptions/{endpointId}/attempts:
    get:
      tags: [WebhookSubscription]
      summary: List delivery attempts and history for an endpoint
      parameters:
        - name: endpointId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of delivery attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListWebhookDeliveryAttemptResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/webhooks/deliveries/failed:
    get:
      tags: [FailedDeliveries]
      operationId: listFailedDeliveries
      summary: List failed deliveries, newest first (up to 200)
      description: A MERCHANT sees its own; a SYSTEM_ADMIN every merchant's. Other roles receive 403.
      responses:
        "200":
          description: Deliveries that used up their attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListFailedDeliveryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/webhooks/deliveries/failed/replay:
    post:
      tags: [FailedDeliveries]
      operationId: replayAllFailedDeliveries
      summary: Queue every failed delivery that was never replayed, or whose last replay failed too
      responses:
        "202":
          description: How many replays were queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseInteger"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/webhooks/deliveries/failed/{deliveryId}/replay:
    post:
      tags: [FailedDeliveries]
      operationId: replayFailedDelivery
      summary: Queue a failed delivery to be sent again
      description: >-
        Sent in the background with the same event id and a new delivery id, on the normal retry schedule. Safe to
        repeat: one that is already waiting, running or delivered is returned unchanged.
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: The failed delivery with its latest replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFailedDeliveryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/webhooks/dlq/health:
    get:
      tags: [DlqReplay]
      summary: Health check for the legacy dead-letter API
      security: []
      responses:
        "200":
          description: OK
  /api/v1/webhooks/dlq:
    get:
      tags: [DlqReplay]
      summary: List legacy dead-letter webhook records (read-only history)
      description: >-
        Records written by the retired synchronous dispatcher; nothing writes them any more. A MERCHANT sees only
        its own records (a different merchantId is refused with 403). A SYSTEM_ADMIN may filter by merchantId or
        omit it to see every merchant. Other roles: 403. Current failures are under /api/v1/webhooks/deliveries/failed.
      parameters:
        - name: merchantId
          in: query
          required: false
          description: Merchant filter for SYSTEM_ADMIN. Merchant clients should omit it.
          schema:
            type: string
            format: uuid
        - name: unreplayedOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of dead-letter queue records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListDeadLetterWebhookResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/webhooks/dlq/{dlqId}:
    get:
      tags: [DlqReplay]
      summary: Get a legacy dead-letter record by ID
      description: >-
        MERCHANT (own records) and SYSTEM_ADMIN. Another merchant's record returns 404, exactly like an unknown ID.
        Other roles: 403.
      parameters:
        - name: dlqId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dead-letter webhook record details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDeadLetterWebhookResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/webhooks/dlq/{dlqId}/replay:
    post:
      tags: [DlqReplay]
      summary: "Retired: replay a legacy dead-letter record"
      deprecated: true
      description: >-
        Retired. Always 410 Gone for an identified caller; nothing is read, sent or written. Replay failed
        deliveries with POST /api/v1/webhooks/deliveries/failed/{deliveryId}/replay.
      parameters:
        - name: dlqId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/Gone"
  /api/v1/webhooks/dlq/replay-all:
    post:
      tags: [DlqReplay]
      summary: "Retired: replay every legacy dead-letter record"
      deprecated: true
      description: >-
        Retired. Always 410 Gone for an identified caller; nothing is read, sent or written. Replay failed
        deliveries with POST /api/v1/webhooks/deliveries/failed/replay.
      parameters:
        - name: merchantId
          in: query
          required: false
          description: Ignored.
          schema:
            type: string
            format: uuid
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/Gone"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request, e.g. malformed subscriptions or an administrator omitting merchantId.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Unauthorized:
      description: Missing or invalid authentication (no verified caller identity).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Forbidden:
      description: >-
        The caller's role does not permit the operation, the caller has no merchant identity, or a merchant asked
        for another merchant's data by merchantId.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NotFound:
      description: The resource does not exist or belongs to another merchant (the two cases are indistinguishable).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Conflict:
      description: The endpoint has delivery history and cannot be deleted; deactivate it instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Gone:
      description: The operation was retired (legacy dead-letter replay); the message names its replacement.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    ApiErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        correlationId:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    CreateWebhookEndpointRequest:
      type: object
      required:
        - targetUrl
        - subscribedEvents
      properties:
        merchantId:
          type: string
          format: uuid
          description: >-
            Owning merchant. Omit as a merchant (the merchantId of the caller's token is used; any other value is
            refused). Required for SYSTEM_ADMIN.
        targetUrl:
          type: string
          format: uri
          maxLength: 500
          description: >-
            Must be a public HTTPS URL. Refused with 400 "Invalid Webhook URL": other schemes or plain HTTP,
            username/password in the URL, invalid ports, IP literals or hostnames that are loopback, private,
            link-local, multicast or otherwise non-public, numeric/hex IP notations, single-label and internal
            names (localhost, *.local, *.internal, *.svc, ...), and hostnames that cannot be resolved or resolve to
            any non-public address. The same policy is re-checked before every test ping and legacy replay.
        subscribedEvents:
          type: string
          description: >-
            Comma-delimited event subscriptions. Each token is an event type (order.created, parcel.status.changed),
            a prefix wildcard of whole segments such as parcel.*, or * for all events. Empty, malformed or unknown
            tokens are rejected with 400.
          example: "parcel.status.changed,order.created"
        description:
          type: string
          example: "Main Production ERP Webhook"
    WebhookEndpointResponse:
      type: object
      description: Endpoint details for GET, list and status responses. Never contains the signing secret.
      properties:
        endpointId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        targetUrl:
          type: string
        subscribedEvents:
          type: string
        active:
          type: boolean
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    WebhookDeliveryAttemptResponse:
      type: object
      properties:
        attemptId:
          type: string
          format: uuid
        endpointId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        eventType:
          type: string
        httpStatusCode:
          type: integer
          nullable: true
          description: HTTP status returned by the endpoint; null when no HTTP response was received (timeout or connection failure).
        attemptNumber:
          type: integer
        success:
          type: boolean
          description: True only for a 2xx response.
        errorClass:
          type: string
          nullable: true
          description: Failure classification; null on success.
          enum: [TIMEOUT, CONNECTION_FAILURE, HTTP_CLIENT_ERROR, HTTP_RATE_LIMITED, HTTP_SERVER_ERROR, INVALID_RESPONSE, BLOCKED_DESTINATION, UNKNOWN]
        errorMessage:
          type: string
          nullable: true
          description: Sanitised failure summary; never contains URLs, hosts, raw error text or the endpoint's response body.
          example: Endpoint returned a server error (HTTP 500)
        latencyMs:
          type: integer
          nullable: true
          description: Round-trip time in milliseconds; null for attempts recorded before it was measured.
        attemptedAt:
          type: string
          format: date-time
    FailedDeliveryResponse:
      type: object
      description: A webhook delivery that failed for good, with its latest replay if there is one.
      properties:
        deliveryId:
          type: string
          format: uuid
        endpointId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
          description: The same in every attempt and replay.
        eventType:
          type: string
          example: parcel.status.changed
        orderId:
          type: string
          format: uuid
          nullable: true
        trackingNumber:
          type: string
          nullable: true
        attempts:
          type: integer
        lastHttpStatus:
          type: integer
          nullable: true
          description: Null when there was no response.
        errorClass:
          type: string
          nullable: true
          enum: [TIMEOUT, CONNECTION_FAILURE, HTTP_CLIENT_ERROR, HTTP_RATE_LIMITED, HTTP_SERVER_ERROR, INVALID_RESPONSE, BLOCKED_DESTINATION, UNKNOWN]
        errorMessage:
          type: string
          description: The reason as a sentence from a fixed set.
        occurredAt:
          type: string
          format: date-time
        failedAt:
          type: string
          format: date-time
        replayStatus:
          type: string
          nullable: true
          enum: [PENDING, IN_FLIGHT, SUCCEEDED, RETRY, DEAD]
          description: Status of the latest replay; null when it was never replayed.
        replayedAt:
          type: string
          format: date-time
          nullable: true
    ApiResponseFailedDeliveryResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/FailedDeliveryResponse"
    ApiResponseListFailedDeliveryResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/FailedDeliveryResponse"
    ApiResponseInteger:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: integer
    DeadLetterWebhookResponse:
      type: object
      properties:
        dlqId:
          type: string
          format: uuid
        endpointId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        eventType:
          type: string
        payload:
          type: string
        failureReason:
          type: string
          description: >-
            Raw failure detail recorded by the retired dispatcher; may contain the callback URL or host.
        errorClass:
          type: string
          description: Failure classification derived from the recorded failure.
          enum: [TIMEOUT, CONNECTION_FAILURE, HTTP_CLIENT_ERROR, HTTP_RATE_LIMITED, HTTP_SERVER_ERROR, INVALID_RESPONSE, BLOCKED_DESTINATION, UNKNOWN]
        failureSummary:
          type: string
          description: Sanitised failure summary; never contains URLs, hosts or raw error text.
          example: Endpoint returned a server error (HTTP 503)
        totalAttempts:
          type: integer
        replayed:
          type: boolean
        replayedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
          description: Dead-lettering timestamp (the time of the final failed attempt).
    WebhookEndpointCreatedResponse:
      type: object
      description: >-
        Newly registered endpoint plus its signing secret. The secret is returned only here, once; it cannot
        be retrieved again through GET or list.
      properties:
        endpoint:
          $ref: "#/components/schemas/WebhookEndpointResponse"
        signingSecret:
          type: string
          description: HMAC-SHA256 signing secret used to verify X-SwiftDrop-Signature. Shown once; store it securely.
    ApiResponseWebhookEndpointCreatedResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/WebhookEndpointCreatedResponse"
    ApiResponseWebhookEndpointResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/WebhookEndpointResponse"
    ApiResponseListWebhookEndpointResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpointResponse"
    ApiResponseWebhookDeliveryAttemptResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/WebhookDeliveryAttemptResponse"
    ApiResponseListWebhookDeliveryAttemptResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDeliveryAttemptResponse"
    ApiResponseDeadLetterWebhookResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/DeadLetterWebhookResponse"
    ApiResponseListDeadLetterWebhookResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/DeadLetterWebhookResponse"

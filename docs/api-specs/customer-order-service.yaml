openapi: 3.1.0
info:
  title: SwiftDrop Customer Order API
  description: Complete customer order lifecycle, fee estimation, label printing, and fee revision APIs.
  version: v1.0.0
servers:
  - url: /
    description: API Gateway (same origin as this Swagger UI)
security:
  - bearerAuth: []
paths:
  /api/v1/orders/health:
    get:
      tags: [Order]
      summary: Check order service health
      operationId: checkOrderHealth
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /api/v1/orders/estimate:
    post:
      tags: [Order]
      summary: Calculate pre-confirmation delivery fee estimate (FR-C2)
      operationId: calculateFeeEstimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeEstimateRequest"
      responses:
        "200":
          description: Fee estimate response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFeeEstimateResponse"
        "502":
          description: Pricing service rejected a request this service had validated
        "503":
          description: Pricing service is temporarily unavailable

  /api/v1/orders:
    post:
      tags: [Order]
      summary: Create and book a new customer order (FR-C1)
      operationId: createOrder
      parameters:
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-Correlation-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Distributed tracing correlation ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: Order created response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerOrderResponse"
        "401":
          description: Caller identification (X-User-Id) is missing
        "502":
          description: Pricing service rejected a request this service had validated
        "503":
          description: Pricing service is temporarily unavailable
    get:
      tags: [Order]
      summary: List customer's orders with pagination
      operationId: listOrders
      parameters:
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated customer UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
          description: Customer UUID to list. Honoured only for DISPATCHER and SYSTEM_ADMIN; other callers always see their own orders.
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated orders response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePagedCustomerOrderResponse"
        "401":
          description: Caller identification (X-User-Id) is missing

  /api/v1/orders/{orderId}:
    get:
      tags: [Order]
      summary: Get order details by order UUID
      operationId: getOrderById
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      responses:
        "200":
          description: Order details response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerOrderResponse"
        "404":
          description: Order not found, or not owned by the caller
    put:
      tags: [Order]
      summary: Edit order while in CREATED status
      operationId: updateOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderRequest"
      responses:
        "200":
          description: Updated order response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerOrderResponse"
        "404":
          description: Order not found, or not owned by the caller
        "502":
          description: Pricing service rejected a request this service had validated
        "503":
          description: Pricing service is temporarily unavailable
    delete:
      tags: [Order]
      summary: Delete order while in CREATED status
      operationId: deleteOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      responses:
        "200":
          description: Deletion confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"
        "404":
          description: Order not found, or not owned by the caller

  /api/v1/orders/addresses:
    get:
      tags: [Address book]
      summary: List my saved addresses, most recently changed first
      operationId: listSavedAddresses
      parameters:
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway; only CUSTOMER has an address book
      responses:
        "200":
          description: Saved addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSavedAddressList"
        "401":
          description: No signed-in caller
        "403":
          description: The caller is not a customer
    post:
      tags: [Address book]
      summary: Save a new address
      description: Up to 20 per customer.
      operationId: createSavedAddress
      parameters:
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway; only CUSTOMER has an address book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedAddressRequest"
      responses:
        "201":
          description: Address saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSavedAddress"
        "400":
          description: An invalid field
        "409":
          description: The address book is full
  /api/v1/orders/addresses/{addressId}:
    put:
      tags: [Address book]
      summary: Change a saved address
      operationId: updateSavedAddress
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway; only CUSTOMER has an address book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedAddressRequest"
      responses:
        "200":
          description: Address updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSavedAddress"
        "404":
          description: Not one of the caller's addresses
    delete:
      tags: [Address book]
      summary: Delete a saved address
      operationId: deleteSavedAddress
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway; only CUSTOMER has an address book
      responses:
        "204":
          description: Deleted
        "404":
          description: Not one of the caller's addresses
  /api/v1/orders/tracking/{trackingNumber}:
    get:
      tags: [Order]
      summary: Get order details by non-sequential tracking number
      operationId: getOrderByTrackingNumber
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
            example: SD-7K4M-9QX2
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      responses:
        "200":
          description: Order details response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerOrderResponse"
        "404":
          description: Order not found, or not owned by the caller

  /api/v1/orders/{orderId}/cancel:
    post:
      tags: [Order]
      summary: Request order cancellation (FR-C3)
      description: A customer can cancel only an order that is still CREATED (no courier assigned yet). Dispatchers and admins can cancel any order that is not already in a final status.
      operationId: cancelOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderRequest"
      responses:
        "200":
          description: Cancelled order response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerOrderResponse"
        "404":
          description: Order not found, or not owned by the caller
        "409":
          description: The order is no longer CREATED (for a customer), or is already in a final status

  /api/v1/orders/{orderId}/status-history:
    get:
      tags: [Order]
      summary: Get the statuses an order has been through
      description: Status and time only, oldest first. Only the order's owner (or a dispatcher or admin) can read it; anyone else gets 404.
      operationId: getStatusHistory
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      responses:
        "200":
          description: Status history, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListOrderStatusHistoryEntry"
        "404":
          description: Order not found, or not owned by the caller

  /api/v1/orders/{orderId}/fee-revision/accept:
    post:
      tags: [Order]
      summary: Customer accepts courier pickup fee revision (FR-C8, FR-K5)
      operationId: acceptFeeRevision
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      responses:
        "200":
          description: Accepted fee revision response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerOrderResponse"
        "404":
          description: Order not found, or not owned by the caller

  /api/v1/orders/{orderId}/fee-revision/reject:
    post:
      tags: [Order]
      summary: Customer rejects courier fee revision (auto-cancels at $0) (FR-C8, FR-K5)
      operationId: rejectFeeRevision
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      responses:
        "200":
          description: Rejected fee revision response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerOrderResponse"
        "404":
          description: Order not found, or not owned by the caller

  /api/v1/orders/{orderId}/shipping-label:
    get:
      tags: [Order]
      summary: Download 2-page A5 shipping label with QR code and fee receipt (FR-C4, FR-C5)
      operationId: downloadShippingLabel
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      responses:
        "200":
          description: 2-page A5 Shipping Label PDF, sent as an attachment named receipt-{trackingNumber}.pdf with Cache-Control no-store
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Order not found, or not owned by the caller

  /api/v1/orders/{orderId}/delivery-receipt:
    get:
      tags: [Order]
      summary: Download A5 final delivery & cash collection receipt (FR-C7)
      operationId: downloadDeliveryReceipt
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      responses:
        "200":
          description: Final Delivery Receipt PDF, sent as an attachment named delivery-receipt-{trackingNumber}.pdf with Cache-Control no-store
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Order not found, or not owned by the caller

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OrderSpeed:
      type: string
      enum: [STANDARD, EXPRESS, SAME_DAY]
      example: STANDARD

    PublicOrderStatus:
      type: string
      enum:
        - CREATED
        - PICKUP_ASSIGNED
        - PICKED_UP
        - IN_TRANSIT
        - OUT_FOR_DELIVERY
        - FAILED
        - DELIVERED
        - CANCELLED
        - RETURNED_TO_SENDER
      example: CREATED

    InternalQueueStatus:
      type: string
      enum:
        - CREATED
        - UNASSIGNED
        - PICKUP_ASSIGNED
        - PICKED_UP
        - AT_HUB
        - OUT_FOR_DELIVERY
        - OUTBOUND
        - INCOMING
        - DELIVERED
        - FAILED_ATTEMPT
        - FAILED_RETURN
        - CANCELLED
      example: CREATED

    FeeRevisionStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, EXPIRED]
      example: APPROVED

    SriLankanDistrict:
      type: string
      enum:
        - COLOMBO
        - GAMPAHA
        - KALUTARA
        - KANDY
        - MATALE
        - NUWARA_ELIYA
        - GALLE
        - MATARA
        - HAMBANTOTA
        - JAFFNA
        - KILINOCHCHI
        - MANNAR
        - VAVUNIYA
        - MULLAITIVU
        - BATTICALOA
        - AMPARA
        - TRINCOMALEE
        - KURUNEGALA
        - PUTTALAM
        - ANURADHAPURA
        - POLONNARUWA
        - BADULLA
        - MONARAGALA
        - RATNAPURA
        - KEGALLE
      example: COLOMBO

    FeeEstimateRequest:
      type: object
      required:
        - pickupDistrict
        - deliveryDistrict
        - actualWeightKg
      properties:
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        actualWeightKg:
          type: number
          minimum: 0.01
          maximum: 50
          format: double
          example: 1.5
        lengthCm:
          type: number
          minimum: 0.1
          maximum: 500
          format: double
          example: 25.0
        widthCm:
          type: number
          minimum: 0.1
          maximum: 500
          format: double
          example: 20.0
        heightCm:
          type: number
          minimum: 0.1
          maximum: 500
          format: double
          example: 10.0
        speed:
          $ref: "#/components/schemas/OrderSpeed"

    FeeEstimateResponse:
      type: object
      properties:
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        intraDistrict:
          type: boolean
          example: false
        actualWeightKg:
          type: number
          format: double
          example: 1.5
        volumetricWeightKg:
          type: number
          format: double
          example: 1.0
        chargeableWeightKg:
          type: number
          format: double
          example: 1.5
        speed:
          $ref: "#/components/schemas/OrderSpeed"
        baseFee:
          type: number
          format: double
          example: 550.0
        weightFee:
          type: number
          format: double
          example: 60.0
        speedSurcharge:
          type: number
          format: double
          example: 0.0
        estimatedFee:
          type: number
          format: double
          example: 610.0
        currency:
          type: string
          example: LKR
        pricingRuleVersionId:
          type: string
          example: PRICING-2026-V1

    SavedAddressRequest:
      type: object
      description: A saved pickup or drop-off address, in the same parts as the booking form.
      required: [label, contactName, contactPhone, house, street, city, district, postalCode]
      properties:
        label: { type: string, minLength: 2, maxLength: 40, description: "The customer's name for it, such as Home" }
        contactName: { type: string, minLength: 2, maxLength: 100 }
        contactPhone: { type: string, pattern: "^(?:\\+94|0)?[1-9][0-9]{8}$", description: Stored as +94 and 9 digits }
        alternatePhone: { type: string, pattern: "^(?:\\+94|0)?[1-9][0-9]{8}$" }
        house: { type: string, maxLength: 40, description: Must contain a letter or digit }
        street: { type: string, minLength: 2, maxLength: 150 }
        area: { type: string, maxLength: 98 }
        landmark: { type: string, maxLength: 100 }
        city: { type: string, minLength: 2, maxLength: 100 }
        district:
          $ref: "#/components/schemas/SriLankanDistrict"
        postalCode: { type: string, pattern: "^\\d{5}$" }
    SavedAddressResponse:
      type: object
      properties:
        addressId: { type: string, format: uuid }
        label: { type: string }
        contactName: { type: string }
        contactPhone: { type: string }
        alternatePhone: { type: string }
        house: { type: string }
        street: { type: string }
        area: { type: string }
        landmark: { type: string }
        city: { type: string }
        district:
          $ref: "#/components/schemas/SriLankanDistrict"
        postalCode: { type: string }
        updatedAt: { type: string, format: date-time }
    ApiResponseSavedAddress:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          $ref: "#/components/schemas/SavedAddressResponse"
    ApiResponseSavedAddressList:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: array
          items:
            $ref: "#/components/schemas/SavedAddressResponse"

    CreateOrderRequest:
      type: object
      required:
        - pickupAddressLine1
        - pickupCity
        - pickupDistrict
        - pickupPostalCode
        - pickupContactName
        - pickupContactPhone
        - deliveryAddressLine1
        - deliveryCity
        - deliveryDistrict
        - deliveryPostalCode
        - recipientName
        - recipientPhone
        - recipientEmail
        - lengthCm
        - widthCm
        - heightCm
        - actualWeightKg
        - prohibitedItemsDeclared
      properties:
        clientRequestId:
          type: string
          format: uuid
          description: >-
            Optional ID the client generates once per booking. Sending the same value again (a retry after a
            dropped connection) returns the order already created instead of a second one.
        customerId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        pickupAddressLine1:
          type: string
          minLength: 5
          maxLength: 200
          description: "Letters, digits, spaces and . , / # ( ) & ' : - only"
          example: No. 42, Galle Road
        pickupAddressLine2:
          type: string
          maxLength: 200
          description: "Letters, digits, spaces and . , / # ( ) & ' : - only"
          example: Suite 4B
        pickupCity:
          type: string
          minLength: 2
          maxLength: 100
          example: Colombo 03
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        pickupPostalCode:
          type: string
          pattern: '^\d{5}$'
          example: "00300"
        pickupContactName:
          type: string
          minLength: 2
          maxLength: 100
          example: Sunil Perera
        pickupContactPhone:
          type: string
          pattern: '^(?:\+94|0)?[1-9][0-9]{8}$'
          example: "+94771234567"
        pickupContactAlternatePhone:
          type: string
          description: Optional second phone number for the sender
          pattern: '^(?:\+94|0)?[1-9][0-9]{8}$'
          example: "+94715550101"
        deliveryAddressLine1:
          type: string
          minLength: 5
          maxLength: 200
          description: "Letters, digits, spaces and . , / # ( ) & ' : - only"
          example: No. 18, Peradeniya Road
        deliveryAddressLine2:
          type: string
          maxLength: 200
          description: "Letters, digits, spaces and . , / # ( ) & ' : - only"
          example: Hilltop Residence
        deliveryCity:
          type: string
          minLength: 2
          maxLength: 100
          example: Kandy
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryPostalCode:
          type: string
          pattern: '^\d{5}$'
          example: "20000"
        recipientName:
          type: string
          minLength: 2
          maxLength: 100
          example: Anura Fernando
        recipientPhone:
          type: string
          pattern: '^(?:\+94|0)?[1-9][0-9]{8}$'
          example: "+94719876543"
        recipientAlternatePhone:
          type: string
          description: Optional second phone number for the recipient
          pattern: '^(?:\+94|0)?[1-9][0-9]{8}$'
          example: "+94112345678"
        recipientEmail:
          type: string
          maxLength: 128
          format: email
          example: anura.f@gmail.com
        lengthCm:
          type: number
          minimum: 0.1
          maximum: 500
          format: double
          example: 25.0
        widthCm:
          type: number
          minimum: 0.1
          maximum: 500
          format: double
          example: 20.0
        heightCm:
          type: number
          minimum: 0.1
          maximum: 500
          format: double
          example: 10.0
        actualWeightKg:
          type: number
          minimum: 0.01
          maximum: 50
          format: double
          example: 1.5
        speed:
          $ref: "#/components/schemas/OrderSpeed"
        itemDescription:
          type: string
          maxLength: 512
          example: Handicrafts and tea canisters
        customerNotes:
          type: string
          description: Optional notes for the courier, such as a gate code or a landmark
          maxLength: 500
          example: Call when you reach the gate
        declaredValue:
          type: number
          format: double
          example: 5000.0

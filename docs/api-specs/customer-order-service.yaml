openapi: 3.1.0
info:
  title: SwiftDrop Customer Order API
  description: Complete customer order lifecycle, fee estimation, label printing, and fee revision APIs.
  version: v1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/orders/health:
    get:
      tags: [Order]
      summary: Check order service health
      operationId: checkOrderHealth
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /api/v1/orders/estimate:
    post:
      tags: [Order]
      summary: Calculate pre-confirmation delivery fee estimate (FR-C2)
      operationId: calculateFeeEstimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeEstimateRequest"
      responses:
        "200":
          description: Fee estimate response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFeeEstimateResponse"
        "502":
          description: Pricing service rejected a request this service had validated
        "503":
          description: Pricing service is temporarily unavailable

  /api/v1/orders:
    post:
      tags: [Order]
      summary: Create and book a new customer order (FR-C1)
      operationId: createOrder
      parameters:
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-Correlation-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Distributed tracing correlation ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: Order created response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerOrderResponse"
        "401":
          description: Caller identification (X-User-Id) is missing
        "502":
          description: Pricing service rejected a request this service had validated
        "503":
          description: Pricing service is temporarily unavailable
    get:
      tags: [Order]
      summary: List customer's orders with pagination
      operationId: listOrders
      parameters:
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated customer UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
          description: Customer UUID to list. Honoured only for DISPATCHER and SYSTEM_ADMIN; other callers always see their own orders.
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated orders response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePagedCustomerOrderResponse"
        "401":
          description: Caller identification (X-User-Id) is missing

  /api/v1/orders/{orderId}:
    get:
      tags: [Order]
      summary: Get order details by order UUID
      operationId: getOrderById
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      responses:
        "200":
          description: Order details response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerOrderResponse"
        "404":
          description: Order not found, or not owned by the caller
    put:
      tags: [Order]
      summary: Edit order while in CREATED status
      operationId: updateOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderRequest"
      responses:
        "200":
          description: Updated order response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerOrderResponse"
        "404":
          description: Order not found, or not owned by the caller
        "502":
          description: Pricing service rejected a request this service had validated
        "503":
          description: Pricing service is temporarily unavailable
    delete:
      tags: [Order]
      summary: Delete order while in CREATED status
      operationId: deleteOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      responses:
        "200":
          description: Deletion confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"
        "404":
          description: Order not found, or not owned by the caller

  /api/v1/orders/tracking/{trackingNumber}:
    get:
      tags: [Order]
      summary: Get order details by non-sequential tracking number
      operationId: getOrderByTrackingNumber
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
            example: SD-7K4M-9QX2
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      responses:
        "200":
          description: Order details response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerOrderResponse"
        "404":
          description: Order not found, or not owned by the caller

  /internal/v1/orders:
    post:
      tags: [Internal Order]
      summary: Create an order on behalf of a merchant (idempotent)
      description: Called by the merchant service. Idempotent on (merchantId, externalRef). Internal, no user context, must never be exposed through the API gateway.
      operationId: createMerchantOrder
      parameters:
        - name: X-Correlation-Id
          in: header
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalCreateOrderRequest"
      responses:
        "201":
          description: Order created and order.created published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerOrderResponse"
        "200":
          description: An order already exists for this (merchantId, externalRef); it is returned unchanged and no event is published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerOrderResponse"
        "400":
          description: Validation failed (field names only, never the submitted values)
        "502":
          description: Pricing service rejected a request this service had validated
        "503":
          description: Pricing service is temporarily unavailable; nothing was saved or published

  /internal/v1/orders/tracking/{trackingNumber}:
    get:
      tags: [Internal Order]
      summary: Public-safe tracking view by tracking number
      description: Service-to-service only, for the gateway tracking hub. No user context. Must never be exposed through the API gateway.
      operationId: getTracking
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
            pattern: '^SD-[A-Z0-9]{4}-[A-Z0-9]{4}$'
            example: SD-7K4M-9QX2
      responses:
        "200":
          description: Status, status history and city/district only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseInternalTrackingView"
        "400":
          description: Malformed tracking number
        "404":
          description: Unknown tracking number

  /api/v1/orders/{orderId}/cancel:
    post:
      tags: [Order]
      summary: Request order cancellation (FR-C3)
      operationId: cancelOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderRequest"
      responses:
        "200":
          description: Cancelled order response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerOrderResponse"
        "404":
          description: Order not found, or not owned by the caller

  /api/v1/orders/{orderId}/fee-revision/accept:
    post:
      tags: [Order]
      summary: Customer accepts courier pickup fee revision (FR-C8, FR-K5)
      operationId: acceptFeeRevision
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      responses:
        "200":
          description: Accepted fee revision response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerOrderResponse"
        "404":
          description: Order not found, or not owned by the caller

  /api/v1/orders/{orderId}/fee-revision/reject:
    post:
      tags: [Order]
      summary: Customer rejects courier fee revision (auto-cancels at $0) (FR-C8, FR-K5)
      operationId: rejectFeeRevision
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      responses:
        "200":
          description: Rejected fee revision response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerOrderResponse"
        "404":
          description: Order not found, or not owned by the caller

  /api/v1/orders/{orderId}/shipping-label:
    get:
      tags: [Order]
      summary: Download 2-page A5 shipping label with QR code and fee receipt (FR-C4, FR-C5)
      operationId: downloadShippingLabel
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      responses:
        "200":
          description: 2-page A5 Shipping Label PDF, sent as an attachment named receipt-{trackingNumber}.pdf with Cache-Control no-store
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Order not found, or not owned by the caller

  /api/v1/orders/{orderId}/delivery-receipt:
    get:
      tags: [Order]
      summary: Download A5 final delivery & cash collection receipt (FR-C7)
      operationId: downloadDeliveryReceipt
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Authenticated user UUID
        - name: X-User-Role
          in: header
          schema:
            type: string
          description: Caller role set by the gateway
      responses:
        "200":
          description: Final Delivery Receipt PDF, sent as an attachment named delivery-receipt-{trackingNumber}.pdf with Cache-Control no-store
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Order not found, or not owned by the caller


components:
  schemas:
    OrderSpeed:
      type: string
      enum: [STANDARD, EXPRESS, SAME_DAY]
      example: STANDARD

    PublicOrderStatus:
      type: string
      enum:
        - CREATED
        - PICKUP_ASSIGNED
        - PICKED_UP
        - IN_TRANSIT
        - OUT_FOR_DELIVERY
        - FAILED
        - DELIVERED
        - CANCELLED
        - RETURNED_TO_SENDER
      example: CREATED

    InternalQueueStatus:
      type: string
      enum:
        - CREATED
        - UNASSIGNED
        - PICKUP_ASSIGNED
        - PICKED_UP
        - AT_HUB
        - OUT_FOR_DELIVERY
        - OUTBOUND
        - INCOMING
        - DELIVERED
        - FAILED_ATTEMPT
        - FAILED_RETURN
        - CANCELLED
      example: CREATED

    FeeRevisionStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, EXPIRED]
      example: APPROVED

    SriLankanDistrict:
      type: string
      enum:
        - COLOMBO
        - GAMPAHA
        - KALUTARA
        - KANDY
        - MATALE
        - NUWARA_ELIYA
        - GALLE
        - MATARA
        - HAMBANTOTA
        - JAFFNA
        - KILINOCHCHI
        - MANNAR
        - VAVUNIYA
        - MULLAITIVU
        - BATTICALOA
        - AMPARA
        - TRINCOMALEE
        - KURUNEGALA
        - PUTTALAM
        - ANURADHAPURA
        - POLONNARUWA
        - BADULLA
        - MONARAGALA
        - RATNAPURA
        - KEGALLE
      example: COLOMBO

    FeeEstimateRequest:
      type: object
      required:
        - pickupDistrict
        - deliveryDistrict
        - actualWeightKg
      properties:
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        actualWeightKg:
          type: number
          minimum: 0.01
          maximum: 50
          format: double
          example: 1.5
        lengthCm:
          type: number
          format: double
          example: 25.0
        widthCm:
          type: number
          format: double
          example: 20.0
        heightCm:
          type: number
          format: double
          example: 10.0
        speed:
          $ref: "#/components/schemas/OrderSpeed"

    FeeEstimateResponse:
      type: object
      properties:
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        intraDistrict:
          type: boolean
          example: false
        actualWeightKg:
          type: number
          format: double
          example: 1.5
        volumetricWeightKg:
          type: number
          format: double
          example: 1.0
        chargeableWeightKg:
          type: number
          format: double
          example: 1.5
        speed:
          $ref: "#/components/schemas/OrderSpeed"
        baseFee:
          type: number
          format: double
          example: 550.0
        weightFee:
          type: number
          format: double
          example: 60.0
        speedSurcharge:
          type: number
          format: double
          example: 0.0
        estimatedFee:
          type: number
          format: double
          example: 610.0
        currency:
          type: string
          example: LKR
        pricingRuleVersionId:
          type: string
          example: PRICING-2026-V1

    CreateOrderRequest:
      type: object
      required:
        - pickupAddressLine1
        - pickupCity
        - pickupDistrict
        - pickupPostalCode
        - pickupContactName
        - pickupContactPhone
        - deliveryAddressLine1
        - deliveryCity
        - deliveryDistrict
        - deliveryPostalCode
        - recipientName
        - recipientPhone
        - recipientEmail
        - lengthCm
        - widthCm
        - heightCm
        - actualWeightKg
        - prohibitedItemsDeclared
      properties:
        customerId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        pickupAddressLine1:
          type: string
          minLength: 5
          maxLength: 200
          description: "Letters, digits, spaces and . , / # ( ) & ' : - only"
          example: No. 42, Galle Road
        pickupAddressLine2:
          type: string
          maxLength: 200
          description: "Letters, digits, spaces and . , / # ( ) & ' : - only"
          example: Suite 4B
        pickupCity:
          type: string
          minLength: 2
          maxLength: 100
          example: Colombo 03
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        pickupPostalCode:
          type: string
          pattern: '^\d{5}$'
          example: "00300"
        pickupContactName:
          type: string
          minLength: 2
          maxLength: 100
          example: Sunil Perera
        pickupContactPhone:
          type: string
          pattern: '^(0\d{9}|\+94\d{9})$'
          example: "+94771234567"
        pickupContactAlternatePhone:
          type: string
          description: Optional second phone number for the sender
          pattern: '^(0\d{9}|\+94\d{9})$'
          example: "+94715550101"
        deliveryAddressLine1:
          type: string
          minLength: 5
          maxLength: 200
          description: "Letters, digits, spaces and . , / # ( ) & ' : - only"
          example: No. 18, Peradeniya Road
        deliveryAddressLine2:
          type: string
          maxLength: 200
          description: "Letters, digits, spaces and . , / # ( ) & ' : - only"
          example: Hilltop Residence
        deliveryCity:
          type: string
          minLength: 2
          maxLength: 100
          example: Kandy
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryPostalCode:
          type: string
          pattern: '^\d{5}$'
          example: "20000"
        recipientName:
          type: string
          minLength: 2
          maxLength: 100
          example: Anura Fernando
        recipientPhone:
          type: string
          pattern: '^(0\d{9}|\+94\d{9})$'
          example: "+94719876543"
        recipientAlternatePhone:
          type: string
          description: Optional second phone number for the recipient
          pattern: '^(0\d{9}|\+94\d{9})$'
          example: "+94112345678"
        recipientEmail:
          type: string
          maxLength: 128
          format: email
          example: anura.f@gmail.com
        lengthCm:
          type: number
          format: double
          example: 25.0
        widthCm:
          type: number
          format: double
          example: 20.0
        heightCm:
          type: number
          format: double
          example: 10.0
        actualWeightKg:
          type: number
          minimum: 0.01
          maximum: 50
          format: double
          example: 1.5
        speed:
          $ref: "#/components/schemas/OrderSpeed"
        itemDescription:
          type: string
          maxLength: 512
          example: Handicrafts and tea canisters
        customerNotes:
          type: string
          description: Optional notes for the courier, such as a gate code or a landmark
          maxLength: 500
          example: Call when you reach the gate
        declaredValue:
          type: number
          format: double
          example: 5000.0
        codAmount:
          type: number
          format: double
          example: 0.0
        prohibitedItemsDeclared:
          type: boolean
          example: true
        pricingRuleVersionId:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]*$'
          example: PRICING-2026-V1

    UpdateOrderRequest:
      type: object
      properties:
        pickupAddressLine1:
          type: string
          minLength: 5
          maxLength: 200
          description: "Letters, digits, spaces and . , / # ( ) & ' : - only"
        pickupAddressLine2:
          type: string
          maxLength: 200
          description: "Letters, digits, spaces and . , / # ( ) & ' : - only"
        pickupCity:
          type: string
          minLength: 2
          maxLength: 100
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        pickupPostalCode:
          type: string
          pattern: '^\d{5}$'
        pickupContactName:
          type: string
          minLength: 2
          maxLength: 100
        pickupContactPhone:
          type: string
          pattern: '^(0\d{9}|\+94\d{9})$'
        pickupContactAlternatePhone:
          type: string
          description: Optional second phone number for the sender
          pattern: '^(0\d{9}|\+94\d{9})$'
          example: "+94715550101"
        deliveryAddressLine1:
          type: string
          minLength: 5
          maxLength: 200
          description: "Letters, digits, spaces and . , / # ( ) & ' : - only"
        deliveryAddressLine2:
          type: string
          maxLength: 200
          description: "Letters, digits, spaces and . , / # ( ) & ' : - only"
        deliveryCity:
          type: string
          minLength: 2
          maxLength: 100
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryPostalCode:
          type: string
          pattern: '^\d{5}$'
        recipientName:
          type: string
          minLength: 2
          maxLength: 100
        recipientPhone:
          type: string
          pattern: '^(0\d{9}|\+94\d{9})$'
        recipientAlternatePhone:
          type: string
          description: Optional second phone number for the recipient
          pattern: '^(0\d{9}|\+94\d{9})$'
          example: "+94112345678"
        recipientEmail:
          type: string
          maxLength: 128
          format: email
        lengthCm:
          type: number
          format: double
        widthCm:
          type: number
          format: double
        heightCm:
          type: number
          format: double
        actualWeightKg:
          type: number
          minimum: 0.01
          maximum: 50
          format: double
        speed:
          $ref: "#/components/schemas/OrderSpeed"
        itemDescription:
          type: string
          maxLength: 512
        customerNotes:
          type: string
          description: Optional notes for the courier, such as a gate code or a landmark
          maxLength: 500
          example: Call when you reach the gate
        declaredValue:
          type: number
          format: double
        codAmount:
          type: number
          format: double

    CancelOrderRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          maxLength: 512
          example: Sender no longer needs delivery

    CustomerOrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        orderId:
          type: string
          format: uuid
          example: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        trackingNumber:
          type: string
          example: SD-7K4M-9QX2
        customerId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        orderSpeed:
          $ref: "#/components/schemas/OrderSpeed"
        status:
          $ref: "#/components/schemas/PublicOrderStatus"
        internalQueueStatus:
          $ref: "#/components/schemas/InternalQueueStatus"
        pickupAddressLine1:
          type: string
        pickupAddressLine2:
          type: string
        pickupCity:
          type: string
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        pickupPostalCode:
          type: string
        pickupContactName:
          type: string
        pickupContactPhone:
          type: string
        pickupContactAlternatePhone:
          type: string
          description: Optional second phone number for the sender
        deliveryAddressLine1:
          type: string
        deliveryAddressLine2:
          type: string
        deliveryCity:
          type: string
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryPostalCode:
          type: string
        recipientName:
          type: string
        recipientPhone:
          type: string
        recipientAlternatePhone:
          type: string
          description: Optional second phone number for the recipient
        recipientEmail:
          type: string
        lengthCm:
          type: number
          format: double
        widthCm:
          type: number
          format: double
        heightCm:
          type: number
          format: double
        actualWeightKg:
          type: number
          format: double
        chargeableWeightKg:
          type: number
          format: double
        itemDescription:
          type: string
        customerNotes:
          type: string
          description: Optional notes for the courier

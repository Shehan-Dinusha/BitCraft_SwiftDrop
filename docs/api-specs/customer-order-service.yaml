    InternalCreateOrderRequest:
      type: object
      description: Order created on behalf of a merchant. The merchant id is also stored as the order customer id. Recipient email and dimensions are optional (dimensions default to 10 cm).
      required:
        - merchantId
        - externalRef
        - pickupAddressLine1
        - pickupCity
        - pickupDistrict
        - pickupPostalCode
        - pickupContactName
        - pickupContactPhone
        - deliveryAddressLine1
        - deliveryCity
        - deliveryDistrict
        - deliveryPostalCode
        - recipientName
        - recipientPhone
        - actualWeightKg
        - prohibitedItemsDeclared
      properties:
        merchantId:
          type: string
          format: uuid
        externalRef:
          type: string
          maxLength: 128
          pattern: '^[A-Za-z0-9._:/#-]+$'
          example: SHOP-2026-000123
        pickupAddressLine1:
          type: string
          minLength: 5
          maxLength: 200
        pickupAddressLine2:
          type: string
          maxLength: 200
        pickupCity:
          type: string
          minLength: 2
          maxLength: 100
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        pickupPostalCode:
          type: string
          pattern: '^\d{5}$'
        pickupContactName:
          type: string
          minLength: 2
          maxLength: 100
        pickupContactPhone:
          type: string
          pattern: '^(0\d{9}|\+94\d{9})$'
        deliveryAddressLine1:
          type: string
          minLength: 5
          maxLength: 200
        deliveryAddressLine2:
          type: string
          maxLength: 200
        deliveryCity:
          type: string
          minLength: 2
          maxLength: 100
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryPostalCode:
          type: string
          pattern: '^\d{5}$'
        recipientName:
          type: string
          minLength: 2
          maxLength: 100
        recipientPhone:
          type: string
          pattern: '^(0\d{9}|\+94\d{9})$'
        recipientEmail:
          type: string
          format: email
          maxLength: 128
          description: Optional for merchant orders
        lengthCm:
          type: number
          minimum: 0.1
          description: Optional, defaults to 10
        widthCm:
          type: number
          minimum: 0.1
          description: Optional, defaults to 10
        heightCm:
          type: number
          minimum: 0.1
          description: Optional, defaults to 10
        actualWeightKg:
          type: number
          minimum: 0.01
          maximum: 50
        speed:
          $ref: "#/components/schemas/OrderSpeed"
        itemDescription:
          type: string
          maxLength: 512
        declaredValue:
          type: number
          minimum: 0
        codAmount:
          type: number
          minimum: 0
        prohibitedItemsDeclared:
          type: boolean
          example: true

    InternalTrackingView:
      type: object
      description: Public-safe tracking view. No street address, name, phone, email, customer or merchant id, or fee.
      properties:
        trackingNumber:
          type: string
          example: SD-7K4M-9QX2
        status:
          $ref: "#/components/schemas/PublicOrderStatus"
        history:
          type: array
          description: Status history, oldest first
          items:
            $ref: "#/components/schemas/InternalTrackingHistoryEntry"
        pickupCity:
          type: string
          example: Colombo 03
        pickupDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryCity:
          type: string
          example: Kandy
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"

    InternalTrackingHistoryEntry:

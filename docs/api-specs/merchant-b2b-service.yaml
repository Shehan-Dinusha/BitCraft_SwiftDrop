openapi: 3.1.0
info:
  title: SwiftDrop Merchant B2B API
  description: Merchant onboarding, SHA-256 API key management, and bulk parcel order ingestion.
  version: v1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/b2b/orders:
    post:
      tags: [B2bOrders]
      summary: Create a merchant order or return an existing order for the same reference
      description: Requires a trusted merchant context injected after API-key authentication at the gateway.
      parameters:
        - $ref: '#/components/parameters/B2bMerchantId'
        - $ref: '#/components/parameters/B2bRole'
        - $ref: '#/components/parameters/B2bCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B2bOrderRequest'
      responses:
        '201':
          description: Order created by the order service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseB2bOrderResult'
        '200':
          description: Existing order for this merchant and external reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseB2bOrderResult'
        '400':
          description: Invalid order details
        '401':
          description: Missing authenticated merchant context
        '403':
          description: Merchant is not approved or caller role is not MERCHANT
        '404':
          description: Merchant not found
        '502':
          description: Invalid or failed order-service response
        '503':
          description: Order service unavailable; retry with the same external reference

  /api/v1/b2b/orders/bulk:
    post:
      tags: [B2bOrders]
      summary: Submit up to 500 orders with per-item results
      parameters:
        - $ref: '#/components/parameters/B2bMerchantId'
        - $ref: '#/components/parameters/B2bRole'
        - $ref: '#/components/parameters/B2bCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B2bBulkRequest'
      responses:
        '200':
          description: Results in input order, including validation and forwarding errors per item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseB2bBulkResponse'
        '400':
          description: Empty batch, more than 500 items, or malformed JSON
        '401':
          description: Missing authenticated merchant context
        '403':
          description: Merchant approval required
        '404':
          description: Merchant not found

  /api/v1/merchants/health:
    get:
      tags: [MerchantAccount]
      summary: Check merchant account health
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /api/v1/merchants:
    post:
      tags: [MerchantAccount]
      summary: Register a new merchant account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMerchantRequest"
      responses:
        "201":
          description: Merchant account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMerchantAccountResponse"
    get:
      tags: [MerchantAccount]
      summary: List all merchant accounts
      responses:
        "200":
          description: Merchant accounts retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListMerchantAccountResponse"

  /api/v1/merchants/{merchantId}:
    get:
      tags: [MerchantAccount]
      summary: Get merchant profile by UUID
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Merchant profile retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMerchantAccountResponse"
        "404":
          description: Merchant not found

  /api/v1/api-key-management/health:
    get:
      tags: [ApiKeyManagement]
      summary: Check API key controller health
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /api/v1/merchants/{merchantId}/api-keys:
    post:
      tags: [ApiKeyManagement]
      summary: Generate a new merchant API key
      description: Returns raw secret key ONLY ONCE.
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseApiKeyResponse"
    get:
      tags: [ApiKeyManagement]
      summary: List all API keys for a merchant
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: API keys retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListApiKeyResponse"

  /api/v1/merchants/{merchantId}/api-keys/{keyId}:
    delete:
      tags: [ApiKeyManagement]
      summary: Revoke an API key
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: API key revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseApiKeyResponse"

  /internal/v1/api-keys/validate:
    post:
      tags: [ApiKeyManagement]
      summary: Internal API key validation for gateway filter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantApiKeyValidationRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantApiKeyValidationResult"

  /api/v1/merchant-order-ingest/health:
    get:
      tags: [MerchantOrderIngest]
      summary: Check order ingest health
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"

  /api/v1/merchants/{merchantId}/ingest/bulk:
    post:
      tags: [MerchantOrderIngest]
      summary: Ingest a batch of delivery orders via JSON payload
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIngestRequest"
      responses:
        "202":
          description: Batch accepted and processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBulkIngestBatchResponse"

  /api/v1/merchants/{merchantId}/ingest/csv:
    post:
      tags: [MerchantOrderIngest]
      summary: Upload and process bulk orders from CSV
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "202":
          description: CSV batch accepted and processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBulkIngestBatchResponse"

  /api/v1/merchants/{merchantId}/batches:
    get:
      tags: [MerchantOrderIngest]
      summary: List ingestion batches for a merchant
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Batches retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListBulkIngestBatchResponse"

  /api/v1/merchants/batches/{batchId}:
    get:
      tags: [MerchantOrderIngest]
      summary: Get ingestion batch summary by UUID
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Batch retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBulkIngestBatchResponse"

  /api/v1/merchants/batches/{batchId}/items:
    get:
      tags: [MerchantOrderIngest]
      summary: Get row-level parcel tracking details for a batch
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Batch items retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListBulkBatchItemResponse"

components:
  parameters:
    B2bMerchantId:
      name: X-Merchant-Id
      in: header
      required: true
      description: Trusted merchant identity supplied by the gateway, not a public authentication mechanism
      schema:
        type: string
        format: uuid
    B2bRole:
      name: X-User-Role
      in: header
      required: true
      schema:
        type: string
        enum: [MERCHANT]
    B2bCorrelationId:
      name: X-Correlation-Id
      in: header
      schema:
        type: string
        format: uuid
  schemas:
    B2bAddress:
      type: object
      required: [addressLine1, city, district, postalCode, contactName, contactPhone]
      properties:
        addressLine1:
          type: string
          minLength: 5
          maxLength: 200
        city:
          type: string
          minLength: 2
          maxLength: 100
        district:
          type: string
          description: Sri Lankan district; case, spaces and hyphens are normalized
        postalCode:
          type: string
          pattern: '^\d{5}$'
        contactName:
          type: string
          minLength: 2
          maxLength: 100
        contactPhone:
          type: string
          description: Local or international Sri Lankan number, normalized to +94
    B2bParcel:
      type: object
      required: [prohibitedItemsDeclared]
      description: Supply exactly one of actualWeightKg and weightGrams
      properties:
        actualWeightKg:
          type: number
          minimum: 0.01
          maximum: 50
        weightGrams:
          type: number
          minimum: 10
          maximum: 50000
        prohibitedItemsDeclared:
          type: boolean
          const: true
        itemDescription:
          type: string
          maxLength: 512
        declaredValue:
          type: number
          minimum: 0
        codAmount:
          type: number
          minimum: 0
    B2bOrderRequest:
      type: object
      required: [externalRef, pickup, delivery, parcel]
      properties:
        externalRef:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:/#-]+$'
        pickup:
          $ref: '#/components/schemas/B2bAddress'
        delivery:
          $ref: '#/components/schemas/B2bAddress'
        parcel:
          $ref: '#/components/schemas/B2bParcel'
        speed:
          type: string
          description: STANDARD (default) or EXPRESS; case-insensitive
    B2bBulkRequest:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/B2bOrderRequest'
    B2bOrderResult:
      type: object
      properties:
        externalRef:
          type: string
        orderId:
          type: string
          format: uuid
        trackingNumber:
          type: string
        created:
          type: boolean
        error:
          type: string
          description: Present only for a failed bulk item
    B2bBulkResponse:
      type: object
      properties:
        total:
          type: integer
        successCount:
          type: integer
        failedCount:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/B2bOrderResult'
    ApiResponseB2bOrderResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/B2bOrderResult'
        timestamp:
          type: string
          format: date-time
    ApiResponseB2bBulkResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/B2bBulkResponse'
        timestamp:
          type: string
          format: date-time
    SriLankanDistrict:
      type: string
      enum:
        - COLOMBO
        - GAMPAHA
        - KALUTARA
        - KANDY
        - MATALE
        - NUWARA_ELIYA
        - GALLE
        - MATARA
        - HAMBANTOTA
        - JAFFNA
        - KILINOCHCHI
        - MANNAR
        - VAVUNIYA
        - MULLAITIVU
        - BATTICALOA
        - AMPARA
        - TRINCOMALEE
        - KURUNEGALA
        - PUTTALAM
        - ANURADHAPURA
        - POLONNARUWA
        - BADULLA
        - MONARAGALA
        - RATNAPURA
        - KEGALLE

    CreateMerchantRequest:
      type: object
      required:
        - businessName
        - contactEmail
        - contactPhone
        - pickupAddress
        - operatingDistrict
      properties:
        businessName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        pickupAddress:
          type: string
        operatingDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"

    MerchantAccountResponse:
      type: object
      properties:
        merchantId:
          type: string
          format: uuid
        businessName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        pickupAddress:
          type: string
        operatingDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateApiKeyRequest:
      type: object
      required:
        - keyName
      properties:
        keyName:
          type: string
        expiresInDays:
          type: integer

    ApiKeyResponse:
      type: object
      properties:
        keyId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        keyName:
          type: string
        keyPrefix:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        rawApiKey:
          type: string

    MerchantApiKeyValidationRequest:
      type: object
      required:
        - apiKey
      properties:
        apiKey:
          type: string

    MerchantApiKeyValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        merchantId:
          type: string
          format: uuid
        reason:
          type: string

    BulkOrderIngestItem:
      type: object
      required:
        - recipientName
        - recipientPhone
        - deliveryDistrict
        - deliveryAddress
      properties:
        externalRef:
          type: string
          description: Required to forward the row; stable idempotency reference
        deliveryCity:
          type: string
        deliveryPostalCode:
          type: string
        pickupCity:
          type: string
        pickupPostalCode:
          type: string
        prohibitedItemsDeclared:
          type: boolean
          description: Must explicitly be true to forward the row
        recipientName:
          type: string
        recipientPhone:
          type: string
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryAddress:
          type: string
        packageWeightKg:
          type: number
        deliverySpeed:
          type: string

    BulkIngestRequest:
      type: object
      required:
        - orders
      properties:
        fileName:
          type: string
        orders:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/BulkOrderIngestItem"

    BulkIngestBatchResponse:
      type: object
      properties:
        batchId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        fileName:
          type: string
        batchStatus:
          type: string
        totalRecords:
          type: integer
        successCount:
          type: integer
        failedCount:
          type: integer
        errorSummary:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    BulkBatchItemResponse:
      type: object
      properties:
        batchId:
          type: string
          format: uuid
        rowIndex:
          type: integer
        trackingNumber:
          type: string
        orderId:
          type: string
          format: uuid
        recipientName:
          type: string
        recipientPhone:
          type: string
        deliveryDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        deliveryAddress:
          type: string
        packageWeightKg:
          type: number
        deliverySpeed:
          type: string
        itemStatus:
          type: string
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time

    ApiResponseString:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: string
        timestamp:
          type: string
          format: date-time

    ApiResponseMerchantAccountResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/MerchantAccountResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseListMerchantAccountResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/MerchantAccountResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseApiKeyResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/ApiKeyResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseListApiKeyResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseBulkIngestBatchResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/BulkIngestBatchResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseListBulkIngestBatchResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/BulkIngestBatchResponse"
        timestamp:
          type: string
          format: date-time

    ApiResponseListBulkBatchItemResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/BulkBatchItemResponse"
        timestamp:
          type: string
          format: date-time

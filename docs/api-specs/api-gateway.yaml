openapi: 3.1.0
info:
  title: SwiftDrop API Gateway Public Tracking API
  description: |
    Sanitized public parcel tracking exposed by the API Gateway Real-Time
    Tracking Hub. The canonical read path is `/api/v1/public/track/{trackingNumber}`;
    `/api/v1/tracking/{trackingNumber}` is served by the same controller as a
    compatibility alias. These endpoints do not require a JWT and are rate limited.
    The WebSocket endpoint `/ws/tracking` accepts STOMP 1.2 clients and exposes
    `/topic/track/{trackingNumber}` publicly and `/topic/customer/{customerId}`
    only to the authenticated customer or a system administrator.
  version: v1.0.0
servers:
  - url: http://localhost:8080
x-websocket:
  path: /ws/tracking
  protocol: STOMP 1.2
  query:
    trackingNumber: Preferred tracking number query parameter.
    trackingId: Legacy alias accepted when trackingNumber is absent.
  topics:
    "/topic/track/{trackingNumber}": Public, sanitized tracking updates.
    "/topic/customer/{customerId}": Authenticated customer or system administrator only.
paths:
  /api/v1/public/track/{trackingNumber}:
    get:
      tags: [Public Tracking]
      summary: Get the latest sanitized tracking view
      operationId: getPublicTrackingView
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
          example: SD-2026-000123
      responses:
        "200":
          description: Latest sanitized tracking view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTrackingView"
        "404":
          description: Tracking data is not available
        "429":
          description: Public tracking rate limit exceeded
  /api/v1/public/track/{trackingNumber}/stream:
    get:
      tags: [Public Tracking]
      summary: Subscribe to Server-Sent Events tracking updates
      operationId: streamPublicTrackingView
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server-Sent Events stream of sanitized tracking views
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/PublicTrackingView"
        "429":
          description: Public tracking rate limit exceeded
  /api/v1/tracking/{trackingNumber}:
    get:
      tags: [Public Tracking]
      summary: Get the latest sanitized tracking view (compatibility alias)
      description: |
        Compatibility alias for `/api/v1/public/track/{trackingNumber}`. Both
        prefixes are handled by the same controller and return the same payload.
      operationId: getTrackingView
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
          example: SD-2026-000123
      responses:
        "200":
          description: Latest sanitized tracking view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTrackingView"
        "404":
          description: Tracking data is not available
        "429":
          description: Public tracking rate limit exceeded
  /api/v1/tracking/{trackingNumber}/stream:
    get:
      tags: [Public Tracking]
      summary: Subscribe to SSE tracking updates (compatibility alias)
      description: |
        Compatibility alias for `/api/v1/public/track/{trackingNumber}/stream`.
      operationId: streamTrackingView
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server-Sent Events stream of sanitized tracking views
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/PublicTrackingView"
        "429":
          description: Public tracking rate limit exceeded
components:
  schemas:
    PublicOrderStatus:
      type: string
      enum:
        - CREATED
        - PICKUP_ASSIGNED
        - PICKED_UP
        - IN_TRANSIT
        - OUT_FOR_DELIVERY
        - FAILED
        - DELIVERED
        - CANCELLED
        - RETURNED_TO_SENDER
    SriLankanDistrict:
      type: string
      enum:
        - COLOMBO
        - GAMPAHA
        - KALUTARA
        - KANDY
        - MATALE
        - NUWARA_ELIYA
        - GALLE
        - MATARA
        - HAMBANTOTA
        - JAFFNA
        - KILINOCHCHI
        - MANNAR
        - VAVUNIYA
        - MULLAITIVU
        - BATTICALOA
        - AMPARA
        - TRINCOMALEE
        - KURUNEGALA
        - PUTTALAM
        - ANURADHAPURA
        - POLONNARUWA
        - BADULLA
        - MONARAGALA
        - RATNAPURA
        - KEGALLE
    PublicTrackingTimelineEntry:
      type: object
      required: [status, timestamp]
      properties:
        status:
          $ref: "#/components/schemas/PublicOrderStatus"
        district:
          $ref: "#/components/schemas/SriLankanDistrict"
        timestamp:
          type: string
          format: date-time
    PublicTrackingView:
      type: object
      required: [trackingNumber, currentPublicStatus, statusTimeline]
      properties:
        trackingNumber:
          type: string
          example: SD-2026-000123
        currentPublicStatus:
          $ref: "#/components/schemas/PublicOrderStatus"
        originDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        destinationDistrict:
          $ref: "#/components/schemas/SriLankanDistrict"
        originCity:
          type: string
          description: City where the parcel was handed over.
          example: Colombo 03
        destinationCity:
          type: string
          description: Destination city.
          example: Kandy
        senderNameMasked:
          type: string
          description: Sender name reduced to initials only.
          example: N. P.
        senderPhoneMasked:
          type: string
          description: Sender phone with the middle digits hidden.
          example: 07X***4567
        receiverNameMasked:
          type: string
          description: Receiver name reduced to initials only.
          example: K. S.
        receiverPhoneMasked:
          type: string
          description: Receiver phone with the middle digits hidden.
          example: 07X***1234
        statusTimeline:
          type: array
          items:
            $ref: "#/components/schemas/PublicTrackingTimelineEntry"
